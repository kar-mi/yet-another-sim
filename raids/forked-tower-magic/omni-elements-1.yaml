# The Index - Omni-Elements 1. t=0 is the Omni-Elements begincast; every time below is measured from
# the ranked clears cached in scripts/raid_analyzer/.cache (see .claude/plans for the derivation).
#
# Each opposite pair of platforms (trapezoid + square) is one element, assigned per run. Six waves per
# round, ~1.5s apart, each detonating one pair; every element fires twice per round and the order is
# two permutations with no repeat across the join.
#
# Runs through the Elementary Chemistry raidwide (79.42) and stops before All-Knowing Flames (86.18).
# The arena stays index_arena_2 even after Elementary Absorption, since arenas can't swap mid-fight yet.

name: Omni-Elements 1
arena:
  generator: index_arena_2
duration: 82
boss: { id: chaos, pos: [0, 0] }

players:
  - { id: mt, role: tank, spawn: [0, 9.5] }
  - { id: ot, role: tank, spawn: [6.72, 6.72] }
  - { id: h1, role: healer, spawn: [9.5, 0] }
  - { id: h2, role: healer, spawn: [6.72, -6.72] }
  - { id: r1, role: dps, spawn: [0, -9.5] }
  - { id: r2, role: dps, spawn: [-6.72, -6.72] }
  - { id: m1, role: dps, spawn: [-9.5, 0] }
  - { id: m2, role: dps, spawn: [-6.72, 6.72] }

sections:
  - { id: raidwide, name: Omni-Elements, t: 0 }
  - { id: elements-1, name: Elements 1, t: 10.12 }
  - { id: orbs, name: Orbs, t: 22.31 }
  - { id: rings, name: Rings, t: 27.32 }
  - { id: implement-1, name: Implement 1, t: 36.56 }
  - { id: elements-2, name: Elements 2, t: 32.71 }
  - { id: implement-2, name: Implement 2, t: 50.82 }
  - { id: chemistry, name: Elementary Chemistry, t: 58.01 }

# One pair end = the trapezoid wedge plus the square platform flush against it. Hexagon apothem 13,
# hole apothem 5.6, platform side 15.011 (src/engine/arenaGenerators.ts).
_shapes:
  polyN: &polyN { kind: polygon, vertices: [[-3.233, 5.6], [3.233, 5.6], [7.506, 13], [7.506, 28.011], [-7.506, 28.011], [-7.506, 13]] }
  polyS: &polyS { kind: polygon, vertices: [[3.233, -5.6], [-3.233, -5.6], [-7.506, -13], [-7.506, -28.011], [7.506, -28.011], [7.506, -13]] }
  polyNE: &polyNE { kind: polygon, vertices: [[3.233, 5.6], [6.466, 0], [15.011, 0], [28.011, 7.506], [20.506, 20.506], [7.506, 13]] }
  polySW: &polySW { kind: polygon, vertices: [[-3.233, -5.6], [-6.466, 0], [-15.011, 0], [-28.011, -7.506], [-20.506, -20.506], [-7.506, -13]] }
  polySE: &polySE { kind: polygon, vertices: [[6.466, 0], [3.233, -5.6], [7.506, -13], [20.506, -20.506], [28.011, -7.506], [15.011, 0]] }
  polyNW: &polyNW { kind: polygon, vertices: [[-6.466, 0], [-3.233, 5.6], [-7.506, 13], [-20.506, 20.506], [-28.011, 7.506], [-15.011, 0]] }

# Platform element outline + glyph, held until the Elementary Chemistry raidwide (79.42).
_marker: &marker
  type: aoe
  time: 4
  name: Element
  telegraph: 75.42
  outline: true
  damage: 0
  damageType: "true"
  showCastBar: false
  showTelegraph: true

# A wave has no cast bar; its ring leaves the boss at cast start and reaches the square centers
# (20.506) as the pair detonates, and the pair flashes its color for the final 0.4s. Round 1's first ring leaves as Elementary Expansion ends.
_wave: &wave
  type: aoe
  name: Element
  telegraph: 7.83
  damage: 40
  damageType: magical
  avoidable: true
  showCastBar: false
  showTelegraph: false
  flashBeforeResolve: { lead: 0.4 }

_ring: &ring { center: [0, 0], radius: 20.506 }

# Cast bar with no damage or telegraph.
_castBar: &castBar
  type: aoe
  damage: 0
  damageType: "true"
  showCastBar: true
  showTelegraph: false
  shape: { kind: circle, center: [0, 0], radius: 0.1 }

# Ring hit: an invisible platform aoe that only hits its group's players carrying the platform's element.
_ringHit: &ringHit
  type: aoe
  name: Element
  telegraph: 6
  damage: 999
  damageType: "true"
  avoidable: true
  onlyCarriers: true
  showCastBar: false
  showTelegraph: false

# Cleansing orbs: two circles and one donut. Each spawns 1s after Predict (22.31) in a trapezoid,
# sits ~5s, then glides straight to the square one section clockwise (N trapezoid -> NE square) and
# detonates on the bow circle there at 32.70. The floor shape only flashes at detonation.
_orb: &orb
  type: aoe
  name: Cleansing
  time: 22.31
  telegraph: 10.39
  telegraphMode: resolve
  damage: 40
  damageType: magical
  avoidable: true
  showCastBar: false
  color: "#e0e0ff"

# Reference diagrams define geometry, not textures. Radii are estimated from the arena:
# bow circles cover a square and its corners (radius 11); harp covers the central hexagon (15).
# Bow and harp have no cast bar or telegraph of their own: they hit exactly as the Sealed Implements
# bar ends (37.66 / 51.85) and only flash on impact.
# TODO: boss visual indicator for which implement (bow vs harp) is coming.
_implement: &implement
  type: aoe
  telegraph: 1.1
  damage: 35
  damageType: magical
  avoidable: true
  showCastBar: false
  showTelegraph: true
  telegraphMode: resolve
  color: "#8fd14f"

_bow: &bow
  <<: *implement
  name: Aim

_harp: &harp
  <<: *implement
  name: Romeo's Ballad
  shape: { kind: circle, center: [0, 0], radius: 15 }

events:
  - { id: place-index, type: teleport_boss, time: 0, name: The Index, bossId: boss, spots: [[0, 0]], facing: 0 }
  # Keep the boss stationary and facing north for the entire encounter.
  - id: keep-boss-still
    type: aoe
    time: 0
    name: keep_boss_still
    telegraph: 82
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 0.1 }

  - id: omni-elements
    type: aoe
    time: 0
    name: Omni-Elements
    telegraph: 3.97
    damage: 20
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 30 }

  - { <<: *castBar, id: elementary-expansion, time: 7.13, name: Elementary Expansion, telegraph: 2.99 }
  - { <<: *castBar, id: predict, time: 18.32, name: Predict, telegraph: 2.99 }
  - { <<: *castBar, id: sealed-implements-1, time: 31.5, name: Sealed Implements, telegraph: 6.16 }
  - { <<: *castBar, id: sealed-implements-2, time: 45.76, name: Sealed Implements, telegraph: 6.09 }

  # Elementary Absorption (instant) drops the platforms on this same tick; not modelled (see header).
  - { <<: *castBar, id: elementary-chemistry-cast, time: 58.01, name: Elementary Chemistry, telegraph: 19.97 }
  # The biggest raidwide of the fight; in game it needs ~80% mitigation.
  - id: elementary-chemistry
    type: aoe
    time: 77.98
    name: Elementary Chemistry
    telegraph: 1.44
    damage: 80
    damageType: magical
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 30 }

  - { <<: *marker, id: mark-n, shape: *polyN, glyph: { at: [0, 20.506] } }
  - { <<: *marker, id: mark-s, shape: *polyS, glyph: { at: [0, -20.506] } }
  - { <<: *marker, id: mark-ne, shape: *polyNE, glyph: { at: [17.759, 10.253] } }
  - { <<: *marker, id: mark-sw, shape: *polySW, glyph: { at: [-17.759, -10.253] } }
  - { <<: *marker, id: mark-se, shape: *polySE, glyph: { at: [17.759, -10.253] } }
  - { <<: *marker, id: mark-nw, shape: *polyNW, glyph: { at: [-17.759, 10.253] } }

  # Round 1, waves 1-3 (resolve 17.95 / 19.47 / 20.98).
  - { <<: *wave, id: r1a-ns-n, time: 10.12, shape: *polyN, ring: *ring }
  - { <<: *wave, id: r1a-ns-s, time: 10.12, shape: *polyS }
  - { <<: *wave, id: r1a-nesw-ne, time: 11.64, shape: *polyNE, ring: *ring }
  - { <<: *wave, id: r1a-nesw-sw, time: 11.64, shape: *polySW }
  - { <<: *wave, id: r1a-senw-se, time: 13.15, shape: *polySE, ring: *ring }
  - { <<: *wave, id: r1a-senw-nw, time: 13.15, shape: *polyNW }

  # Round 1, waves 4-6 (resolve 22.47 / 23.97 / 25.48).
  - { <<: *wave, id: r1b-ns-n, time: 14.64, shape: *polyN, ring: *ring }
  - { <<: *wave, id: r1b-ns-s, time: 14.64, shape: *polyS }
  - { <<: *wave, id: r1b-nesw-ne, time: 16.14, shape: *polyNE, ring: *ring }
  - { <<: *wave, id: r1b-nesw-sw, time: 16.14, shape: *polySW }
  - { <<: *wave, id: r1b-senw-se, time: 17.65, shape: *polySE, ring: *ring }
  - { <<: *wave, id: r1b-senw-nw, time: 17.65, shape: *polyNW }

  # Round 2, waves 1-3 (resolve 40.54 / 42.05 / 43.57).
  - { <<: *wave, id: r2a-ns-n, time: 32.71, shape: *polyN, ring: *ring }
  - { <<: *wave, id: r2a-ns-s, time: 32.71, shape: *polyS }
  - { <<: *wave, id: r2a-nesw-ne, time: 34.22, shape: *polyNE, ring: *ring }
  - { <<: *wave, id: r2a-nesw-sw, time: 34.22, shape: *polySW }
  - { <<: *wave, id: r2a-senw-se, time: 35.74, shape: *polySE, ring: *ring }
  - { <<: *wave, id: r2a-senw-nw, time: 35.74, shape: *polyNW }

  # Round 2, waves 4-6 (resolve 45.06 / 46.55 / 48.07).
  - { <<: *wave, id: r2b-ns-n, time: 37.23, shape: *polyN, ring: *ring }
  - { <<: *wave, id: r2b-ns-s, time: 37.23, shape: *polyS }
  - { <<: *wave, id: r2b-nesw-ne, time: 38.72, shape: *polyNE, ring: *ring }
  - { <<: *wave, id: r2b-nesw-sw, time: 38.72, shape: *polySW }
  - { <<: *wave, id: r2b-senw-se, time: 40.24, shape: *polySE, ring: *ring }
  - { <<: *wave, id: r2b-senw-nw, time: 40.24, shape: *polyNW }

  # Implement 1 (resolve 37.66): bow or harp (Sealed Implements picks one of the two).
  - { <<: *bow, id: bow1-n, time: 36.56, shape: { kind: circle, center: [0, 20.506], radius: 11 } }
  - { <<: *bow, id: bow1-ne, time: 36.56, shape: { kind: circle, center: [17.759, 10.253], radius: 11 } }
  - { <<: *bow, id: bow1-se, time: 36.56, shape: { kind: circle, center: [17.759, -10.253], radius: 11 } }
  - { <<: *bow, id: bow1-s, time: 36.56, shape: { kind: circle, center: [0, -20.506], radius: 11 } }
  - { <<: *bow, id: bow1-sw, time: 36.56, shape: { kind: circle, center: [-17.759, -10.253], radius: 11 } }
  - { <<: *bow, id: bow1-nw, time: 36.56, shape: { kind: circle, center: [-17.759, 10.253], radius: 11 } }
  - { <<: *harp, id: harp1, time: 36.56 }

  # Implement 2 (resolve 51.85): bow or harp (Sealed Implements picks one of the two).
  - { <<: *bow, id: bow2-n, time: 50.82, telegraph: 1.03, shape: { kind: circle, center: [0, 20.506], radius: 11 } }
  - { <<: *bow, id: bow2-ne, time: 50.82, telegraph: 1.03, shape: { kind: circle, center: [17.759, 10.253], radius: 11 } }
  - { <<: *bow, id: bow2-se, time: 50.82, telegraph: 1.03, shape: { kind: circle, center: [17.759, -10.253], radius: 11 } }
  - { <<: *bow, id: bow2-s, time: 50.82, telegraph: 1.03, shape: { kind: circle, center: [0, -20.506], radius: 11 } }
  - { <<: *bow, id: bow2-sw, time: 50.82, telegraph: 1.03, shape: { kind: circle, center: [-17.759, -10.253], radius: 11 } }
  - { <<: *bow, id: bow2-nw, time: 50.82, telegraph: 1.03, shape: { kind: circle, center: [-17.759, 10.253], radius: 11 } }
  - { <<: *harp, id: harp2, time: 50.82, telegraph: 1.03 }

  # Element rings (Fire / Blizzard / Thunder III, hits 33.32 / 38.34 / 52.37). `deals.rings` puts every
  # player in one group and gives them two of the three elements; the rings and pie land 6s before the
  # hit, and only that group's carriers of a platform's element are hit there.
  # Group 1 (Predict), hit 33.32.
  - { id: ring1-fire, type: apply_effect, time: 27.32, name: Fire IV, applyEffect: { ref: fire_iv_ring } }
  - { id: ring1-blizzard, type: apply_effect, time: 27.32, name: Blizzard IV, applyEffect: { ref: blizzard_iv_ring } }
  - { id: ring1-thunder, type: apply_effect, time: 27.32, name: Thunder IV, applyEffect: { ref: thunder_iv_ring } }
  - { <<: *ringHit, id: ring1-n, time: 27.32, shape: *polyN }
  - { <<: *ringHit, id: ring1-s, time: 27.32, shape: *polyS }
  - { <<: *ringHit, id: ring1-ne, time: 27.32, shape: *polyNE }
  - { <<: *ringHit, id: ring1-sw, time: 27.32, shape: *polySW }
  - { <<: *ringHit, id: ring1-se, time: 27.32, shape: *polySE }
  - { <<: *ringHit, id: ring1-nw, time: 27.32, shape: *polyNW }

  # Group 2 (Sealed Implements 1), hit 38.34.
  - { id: ring2-fire, type: apply_effect, time: 32.34, name: Fire IV, applyEffect: { ref: fire_iv_ring } }
  - { id: ring2-blizzard, type: apply_effect, time: 32.34, name: Blizzard IV, applyEffect: { ref: blizzard_iv_ring } }
  - { id: ring2-thunder, type: apply_effect, time: 32.34, name: Thunder IV, applyEffect: { ref: thunder_iv_ring } }
  - { <<: *ringHit, id: ring2-n, time: 32.34, shape: *polyN }
  - { <<: *ringHit, id: ring2-s, time: 32.34, shape: *polyS }
  - { <<: *ringHit, id: ring2-ne, time: 32.34, shape: *polyNE }
  - { <<: *ringHit, id: ring2-sw, time: 32.34, shape: *polySW }
  - { <<: *ringHit, id: ring2-se, time: 32.34, shape: *polySE }
  - { <<: *ringHit, id: ring2-nw, time: 32.34, shape: *polyNW }

  # Group 3 (Sealed Implements 2), hit 52.37.
  - { id: ring3-fire, type: apply_effect, time: 46.37, name: Fire IV, applyEffect: { ref: fire_iv_ring } }
  - { id: ring3-blizzard, type: apply_effect, time: 46.37, name: Blizzard IV, applyEffect: { ref: blizzard_iv_ring } }
  - { id: ring3-thunder, type: apply_effect, time: 46.37, name: Thunder IV, applyEffect: { ref: thunder_iv_ring } }
  - { <<: *ringHit, id: ring3-n, time: 46.37, shape: *polyN }
  - { <<: *ringHit, id: ring3-s, time: 46.37, shape: *polyS }
  - { <<: *ringHit, id: ring3-ne, time: 46.37, shape: *polyNE }
  - { <<: *ringHit, id: ring3-sw, time: 46.37, shape: *polySW }
  - { <<: *ringHit, id: ring3-se, time: 46.37, shape: *polySE }
  - { <<: *ringHit, id: ring3-nw, time: 46.37, shape: *polyNW }

  # Cleansing orbs (resolve 32.70).
  - { <<: *castBar, id: cleansing-cast, time: 31.73, name: Cleansing, telegraph: 0.97 }
  - { <<: *orb, id: orb-nw-circle, mover: { from: [-8.054, -4.65], departAt: 27.7 }, shape: { kind: circle, center: [-17.759, 10.253], radius: 11 } }
  - { <<: *orb, id: orb-nw-donut, mover: { from: [-8.054, -4.65], departAt: 27.7 }, shape: { kind: donut, center: [-17.759, 10.253], inner: 5, outer: 11 } }
  - { <<: *orb, id: orb-ne-circle, mover: { from: [0, 9.3], departAt: 27.7 }, shape: { kind: circle, center: [17.759, 10.253], radius: 11 } }
  - { <<: *orb, id: orb-ne-donut, mover: { from: [0, 9.3], departAt: 27.7 }, shape: { kind: donut, center: [17.759, 10.253], inner: 5, outer: 11 } }
  - { <<: *orb, id: orb-s-circle, mover: { from: [8.054, -4.65], departAt: 27.7 }, shape: { kind: circle, center: [0, -20.506], radius: 11 } }
  - { <<: *orb, id: orb-s-donut, mover: { from: [8.054, -4.65], departAt: 27.7 }, shape: { kind: donut, center: [0, -20.506], inner: 5, outer: 11 } }

optionals:
  rngLabels:
    event-set-implement-1: { label: Implement 1, options: [Bow, Harp] }
    event-set-implement-2: { label: Implement 2, options: [Bow, Harp] }
    event-set-orbs: { label: Cleansing donut, options: [NW, NE, S] }
    label-pairs-0: { label: N/S element }
    label-pairs-1: { label: NE/SW element }
    label-pairs-2: { label: SE/NW element }
    time-shuffle-r1-first-first: { label: "Round 1: first pair", options: [N/S, NE/SW, SE/NW] }
    time-shuffle-r1-first-1: { label: "Round 1: waves 2–3", options: [Reverse pair order, Listed pair order] }
    time-shuffle-r1-second-first: { label: "Round 1: fourth pair", options: [First eligible pair, Second eligible pair] }
    time-shuffle-r1-second-1: { label: "Round 1: waves 5–6", options: [Reverse pair order, Listed pair order] }
    time-shuffle-r2-first-first: { label: "Round 2: first pair", options: [N/S, NE/SW, SE/NW] }
    time-shuffle-r2-first-1: { label: "Round 2: waves 2–3", options: [Reverse pair order, Listed pair order] }
    time-shuffle-r2-second-first: { label: "Round 2: fourth pair", options: [First eligible pair, Second eligible pair] }
    time-shuffle-r2-second-1: { label: "Round 2: waves 5–6", options: [Reverse pair order, Listed pair order] }
  # Which pair fires in which slot. Groups are listed pair-first in the same order in every entry, so
  # `noRepeatAfter` can keep a pair from detonating twice across the halfway point.
  timeShuffle:
    - id: r1-first
      rng: true
      groups: [[r1a-ns-n, r1a-ns-s], [r1a-nesw-ne, r1a-nesw-sw], [r1a-senw-se, r1a-senw-nw]]
    - id: r1-second
      rng: true
      noRepeatAfter: r1-first
      groups: [[r1b-ns-n, r1b-ns-s], [r1b-nesw-ne, r1b-nesw-sw], [r1b-senw-se, r1b-senw-nw]]
    - id: r2-first
      rng: true
      groups: [[r2a-ns-n, r2a-ns-s], [r2a-nesw-ne, r2a-nesw-sw], [r2a-senw-se, r2a-senw-nw]]
    - id: r2-second
      rng: true
      noRepeatAfter: r2-first
      groups: [[r2b-ns-n, r2b-ns-s], [r2b-nesw-ne, r2b-nesw-sw], [r2b-senw-se, r2b-senw-nw]]
  combinations:
    # Which element each pair is, drawn once and kept for the whole pull.
    labels:
      pairs:
        rng: true
        slots:
          - [mark-n, mark-s, r1a-ns-n, r1a-ns-s, r1b-ns-n, r1b-ns-s, r2a-ns-n, r2a-ns-s, r2b-ns-n, r2b-ns-s, ring1-n, ring1-s, ring2-n, ring2-s, ring3-n, ring3-s]
          - [mark-ne, mark-sw, r1a-nesw-ne, r1a-nesw-sw, r1b-nesw-ne, r1b-nesw-sw, r2a-nesw-ne, r2a-nesw-sw, r2b-nesw-ne, r2b-nesw-sw, ring1-ne, ring1-sw, ring2-ne, ring2-sw, ring3-ne, ring3-sw]
          - [mark-se, mark-nw, r1a-senw-se, r1a-senw-nw, r1b-senw-se, r1b-senw-nw, r2a-senw-se, r2a-senw-nw, r2b-senw-se, r2b-senw-nw, ring1-se, ring1-nw, ring2-se, ring2-nw, ring3-se, ring3-nw]
        variants:
          - { name: Blizzard IV, color: "#3aa0ff", glyph: ice }
          - { name: Thunder IV, color: "#ffd84a", glyph: lightning }
          - { name: Fire IV, color: "#ff3b30", glyph: fire }
    # Everyone gets two of the three elements; the third is their safe platform.
    deals:
      rings:
        rng: true
        groups:
          - size: 3
            name: Predict
            effects: [ring1-fire, ring1-blizzard, ring1-thunder]
            aoes: [ring1-n, ring1-s, ring1-ne, ring1-sw, ring1-se, ring1-nw]
          - size: 2
            name: Implement 1
            effects: [ring2-fire, ring2-blizzard, ring2-thunder]
            aoes: [ring2-n, ring2-s, ring2-ne, ring2-sw, ring2-se, ring2-nw]
          - size: 3
            name: Implement 2
            effects: [ring3-fire, ring3-blizzard, ring3-thunder]
            aoes: [ring3-n, ring3-s, ring3-ne, ring3-sw, ring3-se, ring3-nw]
        variants:
          - { name: Fire safe, effects: [1, 2] }
          - { name: Blizzard safe, effects: [0, 2] }
          - { name: Thunder safe, effects: [0, 1] }
    eventSets:
      implement-1:
        rng: true
        sets:
          - [bow1-n, bow1-ne, bow1-se, bow1-s, bow1-sw, bow1-nw]
          - [harp1]
      implement-2:
        rng: true
        sets:
          - [bow2-n, bow2-ne, bow2-se, bow2-s, bow2-sw, bow2-nw]
          - [harp2]
      orbs:
        rng: true
        sets:
          - [orb-nw-donut, orb-ne-circle, orb-s-circle]
          - [orb-nw-circle, orb-ne-donut, orb-s-circle]
          - [orb-nw-circle, orb-ne-circle, orb-s-donut]
