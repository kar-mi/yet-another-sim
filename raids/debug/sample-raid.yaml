# Sample Raid — basic shape tour: raidwide, circle, cone, rect, donut.

name: Sample Raid
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 45
botPatterns: sample-raid-bots

players:
  - id: mt
    role: tank
    spawn: { x: -12, z: 12 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: 12, z: 12 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

events:
  # Unavoidable raidwide (telegraph hidden).
  - id: aoe
    time: 1
    name: Aoe
    telegraph: 2
    damage: 10
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 38 }

  - id: fireball
    time: 4
    name: Fireball
    telegraph: 3
    damage: 60
    damageType: magical
    showCastBar: true
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 9 }

  - id: cleave
    time: 11
    name: Cleave
    telegraph: 3
    damage: 60
    damageType: magical
    showCastBar: false
    shape: { kind: cone, origin: { x: 0, z: 0 }, direction: { x: 0, z: 1 }, angleDeg: 90, length: 22 }

  - id: crossfire
    time: 18
    name: Crossfire
    telegraph: 4
    damage: 80
    damageType: magical
    showCastBar: true
    shape: { kind: rect, origin: { x: 0, z: 0 }, direction: { x: 1, z: 0 }, width: 6, length: 40 }

  - id: shockwave
    time: 26
    name: Shockwave
    telegraph: 4
    damage: 100
    damageType: magical
    showCastBar: false
    shape: { kind: donut, center: { x: 0, z: 0 }, inner: 7, outer: 30 }

waymarks:
  - { mark: A, pos: { x: 0, z: 16 } }
  - { mark: B, pos: { x: 16, z: 0 } }
  - { mark: C, pos: { x: 0, z: -16 } }
  - { mark: D, pos: { x: -16, z: 0 } }
  - { mark: "1", pos: { x: 10, z: 10 } }
  - { mark: "2", pos: { x: 10, z: -10 } }
  - { mark: "3", pos: { x: -10, z: -10 } }
  - { mark: "4", pos: { x: -10, z: 10 } }
