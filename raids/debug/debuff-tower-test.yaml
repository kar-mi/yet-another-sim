# Debuff Tower Test — towers that resolve invisible "charge" debuffs:
# spread, stack, and cone resolutions in sequence.

name: Debuff Tower Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 24
duration: 34

players:
  - id: mt
    role: tank
    spawn: { x: -2.8, z: 0 }
    pattern:
      - { time: 8, pos: { x: -1, z: 12.2 } }
      - { time: 18, pos: { x: -10, z: 8 } }
  - id: ot
    role: tank
    spawn: { x: -10, z: 8 }
    pattern:
      - { time: 8, pos: { x: -2, z: 15 } }
      - { time: 18, pos: { x: -14, z: 0 } }
  - id: h1
    role: healer
    spawn: { x: 2.8, z: 0 }
    pattern:
      - { time: 8, pos: { x: 1, z: 12.2 } }
      - { time: 18, pos: { x: 10, z: 8 } }
  - id: h2
    role: healer
    spawn: { x: 10, z: 8 }
    pattern:
      - { time: 8, pos: { x: 0, z: 15.5 } }
      - { time: 18, pos: { x: 0, z: -20 } }
  - id: r1
    role: dps
    spawn: { x: -10, z: -8 }
    pattern:
      - { time: 8, pos: { x: 2, z: 15 } }
      - { time: 18, pos: { x: 14, z: 0 } }
  - id: r2
    role: dps
    spawn: { x: 10, z: -8 }
    pattern:
      - { time: 8, pos: { x: 10, z: 0 } }
      - { time: 18, pos: { x: -3.8, z: -14 } }
  - id: m1
    role: dps
    spawn: { x: -8, z: 0 }
  - id: m2
    role: dps
    spawn: { x: 0, z: 10 }
    pattern:
      - { time: 8, pos: { x: -10, z: 0 } }
      - { time: 18, pos: { x: 3.8, z: -14 } }

# Shared tower defaults.
_towerBase: &towerBase
  type: tower
  telegraph: 3
  radius: 4
  requiredCount: 2
  failureDamage: 5

events:
  # Resolvers — triggered by towers via resolveEventIds.
  - type: effect_resolver
    id: spread-resolve
    name: Spread Resolve
    effectName: Spread Charge
    action: { kind: spread, radius: 2.5, damage: 8, damageType: magical }
  - type: effect_resolver
    id: stack-resolve
    name: Stack Resolve
    effectName: Stack Charge
    action: { kind: stack, radius: 4, requiredCount: 2, damage: 200, damageType: magical }
  - type: effect_resolver
    id: cone-resolve
    name: Cone Resolve
    effectName: Cone Charge
    action: { kind: cone_nearest, angleDeg: 70, length: 14, damage: 12, damageType: physical }

  # Phase 1 — spread charge, then a tower that fires the spread resolver.
  - type: apply_effect
    id: spread-charge
    time: 1
    name: Spread Charge
    applyEffect:
      ref: spread_charge
  - <<: *towerBase
    id: spread-tower
    time: 3
    name: Spread Debuff Tower
    pos: { x: 0, z: 0 }
    failureDamageType: magical
    resolveEventIds: [spread-resolve]
    visual: { fallingObject: sphere, countCircles: true, cylinderColor: "#66ddff", cylinderThickness: 2.4 }

  # Phase 2 — stack charge tower.
  - type: apply_effect
    id: stack-charge
    time: 10
    name: Stack Charge
    applyEffect:
      ref: stack_charge
      duration: 10
      markerIcon: stack_processed.png
  - <<: *towerBase
    id: stack-tower
    time: 12
    name: Stack Debuff Tower
    pos: { x: 0, z: 9 }
    failureDamageType: magical
    resolveEventIds: [stack-resolve]
    visual: { fallingObject: box, countCircles: true, cylinderColor: "#ffd166", cylinderThickness: 2 }

  # Phase 3 — cone charge tower.
  - type: apply_effect
    id: cone-charge
    time: 20
    name: Cone Charge
    applyEffect:
      ref: cone_charge
      duration: 10
      markerIcon: cone_processed.png
  - <<: *towerBase
    id: cone-tower
    time: 22
    name: Cone Debuff Tower
    pos: { x: 0, z: -14 }
    failureDamageType: physical
    resolveEventIds: [cone-resolve]
    visual: { fallingObject: cylinder, countCircles: true, cylinderColor: "#c77dff", cylinderThickness: 1.8 }

waymarks:
  - { mark: A, pos: { x: 0, z: 18 } }
  - { mark: B, pos: { x: 16, z: 0 } }
  - { mark: C, pos: { x: 0, z: -20 } }
  - { mark: D, pos: { x: -16, z: 0 } }
