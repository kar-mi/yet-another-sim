# Debuff Tower Test — towers that resolve invisible "charge" debuffs:
# spread, stack, and cone resolutions in sequence.

name: Debuff Tower Test
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 24
duration: 34

players:
  - id: mt
    role: tank
    spawn: [-2.8, 0]
    pattern:
      - { t: 8, pos: [-1, 12.2] }
      - { t: 18, pos: [-10, 8] }
  - id: ot
    role: tank
    spawn: [-10, 8]
    pattern:
      - { t: 8, pos: [-2, 15] }
      - { t: 18, pos: [-14, 0] }
  - id: h1
    role: healer
    spawn: [2.8, 0]
    pattern:
      - { t: 8, pos: [1, 12.2] }
      - { t: 18, pos: [10, 8] }
  - id: h2
    role: healer
    spawn: [10, 8]
    pattern:
      - { t: 8, pos: [0, 15.5] }
      - { t: 18, pos: [0, -20] }
  - id: r1
    role: dps
    spawn: [-10, -8]
    pattern:
      - { t: 8, pos: [2, 15] }
      - { t: 18, pos: [14, 0] }
  - id: r2
    role: dps
    spawn: [10, -8]
    pattern:
      - { t: 8, pos: [10, 0] }
      - { t: 18, pos: [-3.8, -14] }
  - id: m1
    role: dps
    spawn: [-8, 0]
  - id: m2
    role: dps
    spawn: [0, 10]
    pattern:
      - { t: 8, pos: [-10, 0] }
      - { t: 18, pos: [3.8, -14] }

# Shared tower defaults.
_towerBase: &towerBase
  type: tower
  telegraph: 3
  radius: 4
  requiredCount: 2
  failureDamage: 5

# Shared invisible charge-debuff defaults (behavior comes from the resolver).
_chargeBase: &chargeBase
  kind: debuff
  visibility: invisible
  behavior: { kind: none }

events:
  # Resolvers — triggered by towers via resolveEventIds.
  - type: effect_resolver
    id: spread-resolve
    name: Spread Resolve
    effectName: Spread Charge
    action: { kind: spread, radius: 2.5, damage: 8, damageType: magical }
  - type: effect_resolver
    id: stack-resolve
    name: Stack Resolve
    effectName: Stack Charge
    action: { kind: stack, radius: 4, requiredCount: 2, damage: 200, damageType: magical }
  - type: effect_resolver
    id: cone-resolve
    name: Cone Resolve
    effectName: Cone Charge
    action: { kind: cone_nearest, angleDeg: 70, length: 14, damage: 12, damageType: physical }

  # Phase 1 — spread charge, then a tower that fires the spread resolver.
  - type: apply_effect
    id: spread-charge
    t: 1
    name: Spread Charge
    applyEffect:
      <<: *chargeBase
      name: Spread Charge
      duration: 12
      markerIcon: defam_processed.png
  - <<: *towerBase
    id: spread-tower
    t: 3
    name: Spread Debuff Tower
    pos: [0, 0]
    failureDamageType: magical
    resolveEventIds: [spread-resolve]
    visual: { fallingObject: sphere, countCircles: true, cylinderColor: "#66ddff", cylinderThickness: 2.4 }

  # Phase 2 — stack charge tower.
  - type: apply_effect
    id: stack-charge
    t: 10
    name: Stack Charge
    applyEffect:
      <<: *chargeBase
      name: Stack Charge
      duration: 10
      markerIcon: stack_processed.png
  - <<: *towerBase
    id: stack-tower
    t: 12
    name: Stack Debuff Tower
    pos: [0, 9]
    failureDamageType: magical
    resolveEventIds: [stack-resolve]
    visual: { fallingObject: box, countCircles: true, cylinderColor: "#ffd166", cylinderThickness: 2 }

  # Phase 3 — cone charge tower.
  - type: apply_effect
    id: cone-charge
    t: 20
    name: Cone Charge
    applyEffect:
      <<: *chargeBase
      name: Cone Charge
      duration: 10
      markerIcon: cone_processed.png
  - <<: *towerBase
    id: cone-tower
    t: 22
    name: Cone Debuff Tower
    pos: [0, -14]
    failureDamageType: physical
    resolveEventIds: [cone-resolve]
    visual: { fallingObject: cylinder, countCircles: true, cylinderColor: "#c77dff", cylinderThickness: 1.8 }

waymarks:
  - { mark: A, pos: [0, 18] }
  - { mark: B, pos: [16, 0] }
  - { mark: C, pos: [0, -20] }
  - { mark: D, pos: [-16, 0] }
