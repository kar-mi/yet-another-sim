# Stored Bait — deferred boss-facing cones stored ahead of time,
# then fired at the closest player by a linked bait event.

name: Stored Bait
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 25
duration: 36

players:
  - id: mt
    role: tank
    spawn: [0, 3]
    pattern:
      - { t: 10.5, pos: [0, -14] }
      - { t: 19, pos: [0, 6] }
  - id: ot
    role: tank
    spawn: [0, -8]
    pattern:
      - { t: 10.5, pos: [0, -14] }
      - { t: 19, pos: [-4, 12] }
  - id: h1
    role: healer
    spawn: [-8, 0]
    pattern:
      - { t: 10.5, pos: [-10, -10] }
      - { t: 19, pos: [-10, 10] }
  - id: h2
    role: healer
    spawn: [8, 0]
    pattern:
      - { t: 10.5, pos: [10, -10] }
      - { t: 19, pos: [10, 10] }
  - id: r1
    role: dps
    spawn: [-5.66, 5.66]
    pattern:
      - { t: 10.5, pos: [-8, -12] }
      - { t: 19, pos: [-8, 12] }
  - id: r2
    role: dps
    spawn: [5.66, 5.66]
    pattern:
      - { t: 10.5, pos: [8, -12] }
      - { t: 19, pos: [8, 12] }
  - id: m1
    role: dps
    spawn: [-5.66, -5.66]
  - id: m2
    role: dps
    spawn: [5.66, -5.66]
    pattern:
      - { t: 10.5, pos: [5.66, -14] }
      - { t: 19, pos: [5.66, 12] }

# Deferred half-arena cone stored on the boss, resolved later by a bait.
_endingBase: &endingBase
  type: aoe
  deferred: true
  anchor: boss
  directionFrom: bossFacing
  telegraph: 3
  damage: 80
  damageType: magical
  shape: { kind: cone, angleDeg: 180, length: 25 }
  telegraphMode: resolve
  showCastBar: true

# Bait that fires a stored ending at the closest player.
_baitBase: &baitBase
  type: bait
  name: All Things Ending
  targetMode: closest
  telegraph: 4
  showCastBar: true

events:
  # Front cone stored, then baited.
  - <<: *endingBase
    id: future-ending
    t: 4
    name: Future Ending
    directionOffset: 0
  - <<: *baitBase
    id: all-things-ending-1
    t: 10
    link: future-ending

  # Rear cone (offset π) stored, then baited.
  - <<: *endingBase
    id: past-ending
    t: 18
    name: Past Ending
    directionOffset: 3.141592653589793
  - <<: *baitBase
    id: all-things-ending-2
    t: 24
    link: past-ending
