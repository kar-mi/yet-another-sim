# Stored Bait — deferred boss-facing cones stored ahead of time,
# then fired at the closest player by a linked bait event.

name: Stored Bait
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 25
duration: 36

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 3 }
    pattern:
      - { time: 10.5, pos: { x: 0, z: -14 } }
      - { time: 19, pos: { x: 0, z: 6 } }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
    pattern:
      - { time: 10.5, pos: { x: 0, z: -14 } }
      - { time: 19, pos: { x: -4, z: 12 } }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
    pattern:
      - { time: 10.5, pos: { x: -10, z: -10 } }
      - { time: 19, pos: { x: -10, z: 10 } }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
    pattern:
      - { time: 10.5, pos: { x: 10, z: -10 } }
      - { time: 19, pos: { x: 10, z: 10 } }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
    pattern:
      - { time: 10.5, pos: { x: -8, z: -12 } }
      - { time: 19, pos: { x: -8, z: 12 } }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
    pattern:
      - { time: 10.5, pos: { x: 8, z: -12 } }
      - { time: 19, pos: { x: 8, z: 12 } }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }
    pattern:
      - { time: 10.5, pos: { x: 5.66, z: -14 } }
      - { time: 19, pos: { x: 5.66, z: 12 } }

# Deferred half-arena cone stored on the boss, resolved later by a bait.
_endingBase: &endingBase
  type: aoe
  deferred: true
  anchor: boss
  directionFrom: bossFacing
  telegraph: 3
  damage: 80
  damageType: magical
  shape: { kind: cone, angleDeg: 180, length: 25 }
  telegraphMode: resolve
  showCastBar: true

# Bait that fires a stored ending at the closest player.
_baitBase: &baitBase
  type: bait
  name: All Things Ending
  targetMode: closest
  telegraph: 4
  showCastBar: true

events:
  # Front cone stored, then baited.
  - <<: *endingBase
    id: future-ending
    time: 4
    name: Future Ending
    directionOffset: 0
  - <<: *baitBase
    id: all-things-ending-1
    time: 10
    link: future-ending

  # Rear cone (offset π) stored, then baited.
  - <<: *endingBase
    id: past-ending
    time: 18
    name: Past Ending
    directionOffset: 3.141592653589793
  - <<: *baitBase
    id: all-things-ending-2
    time: 24
    link: past-ending
