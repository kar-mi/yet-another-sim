# Positional Test — boss-anchored cleaves keyed off boss facing:
# front 90, left half, rear 90.

name: Positional Test
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 25
duration: 30

players:
  - id: mt
    role: tank
    control: bot
    spawn: [0, 18]
  - id: ot
    role: tank
    control: bot
    spawn: [0, -18]
  - id: h1
    role: healer
    control: bot
    spawn: [-18, 0]
  - id: h2
    role: healer
    control: bot
    spawn: [18, 0]
  - id: r1
    role: dps
    control: bot
    spawn: [12, 12]
  - id: r2
    role: dps
    control: bot
    spawn: [-12, 12]
  - id: m1
    role: dps
    control: human
    spawn: [-12, -12]
  - id: m2
    role: dps
    control: bot
    spawn: [12, -12]

# Shared cleave defaults — anchored to the boss, aimed by its facing.
_cleaveBase: &cleaveBase
  telegraph: 4
  damage: 30
  damageType: physical
  showCastBar: true
  anchor: boss
  directionFrom: bossFacing

events:
  - <<: *cleaveBase
    id: front-cleave-90
    t: 3
    name: Front Cleave (90)
    shape: { kind: cone, angleDeg: 90, length: 25 }

  # Offset -π/2 — cleaves the boss's left half.
  - <<: *cleaveBase
    id: left-half-cleave
    t: 12
    name: Left Half Cleave
    directionOffset: -1.5708
    shape: { kind: cone, angleDeg: 180, length: 25 }

  # Offset π — rear cleave.
  - <<: *cleaveBase
    id: rear-cleave-90
    t: 21
    name: Rear Cleave (90)
    directionOffset: 3.14159
    shape: { kind: cone, angleDeg: 90, length: 25 }

waymarks:
  - { mark: A, pos: [0, 20] }
  - { mark: B, pos: [20, 0] }
  - { mark: C, pos: [0, -20] }
  - { mark: D, pos: [-20, 0] }
