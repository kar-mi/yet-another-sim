# Chain Test — two bonded pairs must separate past the break distance
# before the break window ends.

name: Chain Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 30
duration: 30

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 4 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -4 }
  - id: h1
    role: healer
    spawn: { x: -4, z: 4 }
  - id: h2
    role: healer
    spawn: { x: 4, z: -4 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

events:
  - type: chain
    id: binding-chains
    time: 4
    name: Binding Chains
    pairs: [[mt, h1], [ot, h2]]
    telegraph: 4
    breakWindow: 6
    breakDistance: 12
    breakDamage: 40
    damageType: magical
    debuff: chain_bond
    showCastBar: true
