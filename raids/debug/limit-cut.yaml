# Limit Cut — 8-player numbered dashes + 2-hit tankbuster.
# Players receive numbers 1–8 at cast start; dashes fire through the 8 inter-inter-cardinal
# spots in numerical order. Positioning is player skill; bots hold clock spots.

name: Limit Cut
arena:
  floorPlan: dmu-p1
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 24

boss:
  pos: [0, 0]
  radius: 3
  ring:
    scale: 2
    color: "#e62120"

players:
  - id: mt
    role: tank
    spawn: [0, 8]
  - id: ot
    role: tank
    spawn: [0, -8]
  - id: h1
    role: healer
    spawn: [-8, 0]
  - id: h2
    role: healer
    spawn: [8, 0]
  - id: r1
    role: dps
    spawn: [-5.66, 5.66]
  - id: r2
    role: dps
    spawn: [5.66, 5.66]
  - id: m1
    role: dps
    spawn: [-5.66, -5.66]
  - id: m2
    role: dps
    spawn: [5.66, -5.66]

waymarks:
  - { mark: A, pos: [0, 18] }
  - { mark: B, pos: [18, 0] }
  - { mark: C, pos: [0, -18] }
  - { mark: D, pos: [-18, 0] }
  - { mark: "1", pos: [12.73, 12.73] }
  - { mark: "2", pos: [12.73, -12.73] }
  - { mark: "3", pos: [-12.73, -12.73] }
  - { mark: "4", pos: [-12.73, 12.73] }

events:
  # Assign numbers 1–8 to all players; markers visible for 5 s.
  - type: limit_cut
    id: lc
    t: 3
    name: Limit Cut
    effect:
      name: Limit Cut
      kind: debuff
      duration: 5
      visibility: invisible
      behavior: { kind: none }

  # Dashes fire in numerical order, 1 = NNE (22.5° from north), counting clockwise.
  # Each rect crosses the full arena from the opposite edge to the numbered inter-inter-cardinal.
  - type: aoe
    id: lc-dash-1
    t: 5.5
    name: "Limit Cut #1"
    telegraph: 1.5
    damage: 60
    damageType: magical
    showTelegraph: true
    shape:
      kind: rect
      origin: [-8.04, -19.40]
      direction: [0.383, 0.924]
      width: 4
      length: 42

  - type: aoe
    id: lc-dash-2
    t: 7.0
    name: "Limit Cut #2"
    telegraph: 1.5
    damage: 60
    damageType: magical
    showTelegraph: true
    shape:
      kind: rect
      origin: [-19.40, -8.04]
      direction: [0.924, 0.383]
      width: 4
      length: 42

  - type: aoe
    id: lc-dash-3
    t: 8.5
    name: "Limit Cut #3"
    telegraph: 1.5
    damage: 60
    damageType: magical
    showTelegraph: true
    shape:
      kind: rect
      origin: [-19.40, 8.04]
      direction: [0.924, -0.383]
      width: 4
      length: 42

  - type: aoe
    id: lc-dash-4
    t: 10.0
    name: "Limit Cut #4"
    telegraph: 1.5
    damage: 60
    damageType: magical
    showTelegraph: true
    shape:
      kind: rect
      origin: [-8.04, 19.40]
      direction: [0.383, -0.924]
      width: 4
      length: 42

  - type: aoe
    id: lc-dash-5
    t: 11.5
    name: "Limit Cut #5"
    telegraph: 1.5
    damage: 60
    damageType: magical
    showTelegraph: true
    shape:
      kind: rect
      origin: [8.04, 19.40]
      direction: [-0.383, -0.924]
      width: 4
      length: 42

  - type: aoe
    id: lc-dash-6
    t: 13.0
    name: "Limit Cut #6"
    telegraph: 1.5
    damage: 60
    damageType: magical
    showTelegraph: true
    shape:
      kind: rect
      origin: [19.40, 8.04]
      direction: [-0.924, -0.383]
      width: 4
      length: 42

  - type: aoe
    id: lc-dash-7
    t: 14.5
    name: "Limit Cut #7"
    telegraph: 1.5
    damage: 60
    damageType: magical
    showTelegraph: true
    shape:
      kind: rect
      origin: [19.40, -8.04]
      direction: [-0.924, 0.383]
      width: 4
      length: 42

  - type: aoe
    id: lc-dash-8
    t: 16.0
    name: "Limit Cut #8"
    telegraph: 1.5
    damage: 60
    damageType: magical
    showTelegraph: true
    shape:
      kind: rect
      origin: [8.04, -19.40]
      direction: [-0.383, 0.924]
      width: 4
      length: 42

  # 2-hit tankbuster after the dashes
  - type: targeted
    id: lc-tb-1
    t: 19
    name: "Limit Cut TB 1"
    targetMode: closest
    role: tank
    telegraph: 1
    radius: 4
    damage: 120
    damageType: physical
    showCastBar: true

  - type: targeted
    id: lc-tb-2
    t: 21
    name: "Limit Cut TB 2"
    targetMode: closest
    role: tank
    telegraph: 1
    radius: 4
    damage: 120
    damageType: physical
    showCastBar: true
