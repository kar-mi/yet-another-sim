# Gaze Test — look-away eye events: normal, reverse (must look AT it),
# and rng (revealed at resolve), the last with knockback + vuln.

name: Gaze Test
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 30

players:
  - id: mt
    role: tank
    control: human
    spawn: [0, 0]
  - id: ot
    role: tank
    control: bot
    spawn: [8, 8]
  - id: h1
    role: healer
    control: bot
    spawn: [-8, 8]
  - id: h2
    role: healer
    control: bot
    spawn: [8, -8]
  - id: r1
    role: dps
    control: bot
    spawn: [-8, -8]
  - id: r2
    role: dps
    control: bot
    spawn: [12, 0]
  - id: m1
    role: dps
    control: bot
    spawn: [-12, 0]
  - id: m2
    role: dps
    control: bot
    spawn: [0, 12]

# Shared eye defaults — north eye board.
_gazeBase: &gazeBase
  type: gaze
  telegraph: 4
  damage: 40
  damageType: magical
  showCastBar: true
  pos: [0, 19]

events:
  # Normal gaze — hit if facing the eye.
  - <<: *gazeBase
    id: evil-eye
    t: 3
    name: Evil Eye

  # Reverse gaze — hit if NOT facing the eye.
  - <<: *gazeBase
    id: hypnotic-eye
    t: 11
    name: Hypnotic Eye
    reverse: true

  # RNG gaze ("?") — direction revealed on resolve; punishes with
  # knockback and a magic vulnerability.
  - <<: *gazeBase
    id: minds-eye
    t: 19
    name: Mind's Eye
    telegraph: 5
    damage: 50
    rng: true
    knockback: { distance: 6, height: 0 }
    applyEffect:
      name: Magic Vulnerability
      kind: debuff
      duration: 8
      behavior: { kind: vuln, damageType: magical, multiplier: 1.5 }

waymarks:
  - { mark: A, pos: [0, 16] }
  - { mark: B, pos: [16, 0] }
  - { mark: C, pos: [0, -16] }
  - { mark: D, pos: [-16, 0] }
