# Gaze Test — look-away eye events: normal, reverse (must look AT it),
# and rng (revealed at resolve), the last with knockback + vuln.

name: Gaze Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 30

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 0 }
  - id: ot
    role: tank
    spawn: { x: 8, z: 8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 8 }
  - id: h2
    role: healer
    spawn: { x: 8, z: -8 }
  - id: r1
    role: dps
    spawn: { x: -8, z: -8 }
  - id: r2
    role: dps
    spawn: { x: 12, z: 0 }
  - id: m1
    role: dps
    spawn: { x: -12, z: 0 }
  - id: m2
    role: dps
    spawn: { x: 0, z: 12 }

# Shared eye defaults — north eye board.
_gazeBase: &gazeBase
  type: gaze
  telegraph: 4
  damage: 40
  damageType: magical
  showCastBar: true
  pos: { x: 0, z: 19 }

events:
  # Normal gaze — hit if facing the eye.
  - <<: *gazeBase
    id: evil-eye
    time: 3
    name: Evil Eye

  # Reverse gaze — hit if NOT facing the eye.
  - <<: *gazeBase
    id: hypnotic-eye
    time: 11
    name: Hypnotic Eye
    reverse: true

  # RNG gaze ("?") — direction revealed on resolve; punishes with
  # knockback and a magic vulnerability.
  - <<: *gazeBase
    id: minds-eye
    time: 19
    name: Mind's Eye
    telegraph: 5
    damage: 50
    rng: true
    knockback: { distance: 6, height: 0 }
    applyEffect:
      ref: magic_vulnerability

waymarks:
  - { mark: A, pos: { x: 0, z: 16 } }
  - { mark: B, pos: { x: 16, z: 0 } }
  - { mark: C, pos: { x: 0, z: -16 } }
  - { mark: D, pos: { x: -16, z: 0 } }
