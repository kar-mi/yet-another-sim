# Positional Arc Test — uses positional to gate a circle by boss-relative bearing.

name: Positional Arc Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 25
duration: 18

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 18 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -18 }
  - id: h1
    role: healer
    spawn: { x: -18, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 18, z: 0 }
  - id: r1
    role: dps
    spawn: { x: 12, z: 12 }
  - id: r2
    role: dps
    spawn: { x: -12, z: 12 }
  - id: m1
    role: dps
    spawn: { x: -12, z: -12 }
  - id: m2
    role: dps
    spawn: { x: 12, z: -12 }

events:
  - id: tail-swipe
    time: 4
    name: Tail Swipe
    telegraph: 4
    damage: 50
    damageType: physical
    showCastBar: true
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 20 }
    positional:
      center: 3.14159
      width: 1.5708

waymarks:
  - { mark: A, pos: { x: 0, z: 20 } }
  - { mark: B, pos: { x: 20, z: 0 } }
  - { mark: C, pos: { x: 0, z: -20 } }
  - { mark: D, pos: { x: -20, z: 0 } }
