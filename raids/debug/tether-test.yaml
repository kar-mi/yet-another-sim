# Tether Test — tether sources that latch the closest player unless
# intercepted: a Doom debuff chain, then a Regen buff bond.

name: Tether Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 30
duration: 60

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

events:
  - type: tether_source
    id: void-chain
    time: 5
    name: Void Chain
    pos: { x: 0, z: -14 }
    finalizeAfter: 7
    tetherKind: debuff
    buffName: Doom
    applyEffect:
      ref: debug_doom

  - type: tether_source
    id: life-bond
    time: 25
    name: Life Bond
    pos: { x: 10, z: -10 }
    finalizeAfter: 6
    tetherKind: buff
    buffName: Regen
    applyEffect:
      name: Regen
      kind: buff
      duration: 15
      behavior: { kind: none }
