# Sample Raid II — off-center circle, rear cone, laser rect, donut,
# and a final corner pillar.

name: Sample Raid II
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 50

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

events:
  - id: eruption
    time: 5
    name: Eruption
    telegraph: 3
    damage: 70
    damageType: magical
    shape: { kind: circle, center: { x: 10, z: 10 }, radius: 8 }

  - id: back-cleave
    time: 13
    name: Back Cleave
    telegraph: 3
    damage: 65
    damageType: magical
    shape: { kind: cone, origin: { x: 0, z: 0 }, direction: { x: 0, z: -1 }, angleDeg: 100, length: 24 }

  - id: laser
    time: 21
    name: Laser
    telegraph: 4
    damage: 85
    damageType: magical
    shape: { kind: rect, origin: { x: 0, z: 0 }, direction: { x: 0, z: 1 }, width: 6, length: 40 }

  - id: ring-blast
    time: 30
    name: Ring Blast
    telegraph: 4
    damage: 100
    damageType: magical
    shape: { kind: donut, center: { x: 0, z: 0 }, inner: 5, outer: 22 }

  - id: pillars
    time: 40
    name: Pillars
    telegraph: 3
    damage: 90
    damageType: magical
    shape: { kind: circle, center: { x: -12, z: -12 }, radius: 10 }
