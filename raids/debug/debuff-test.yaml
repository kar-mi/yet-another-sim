# Debuff Test — vuln, typed damage, pyretic (dot while moving),
# and deep freeze (dot while idle), all centered circles.

name: Debuff Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 30
duration: 45

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

# Shared hit defaults — every event is a 1s telegraph circle on center.
_hitBase: &hitBase
  telegraph: 1
  shape: { kind: circle, center: { x: 0, z: 0 }, radius: 10 }

events:
  # Apply physical vuln, then follow up with a physical strike.
  - <<: *hitBase
    id: expose
    time: 3
    name: Expose
    damage: 0
    damageType: physical
    applyEffect:
      name: Physical Vulnerability
      kind: debuff
      duration: 8
      behavior: { kind: vuln, damageType: physical, multiplier: 1.5 }

  - <<: *hitBase
    id: typed-strike
    time: 7
    name: Typed Strike
    damage: 30
    damageType: physical

  # Pyretic — ticks while moving.
  - <<: *hitBase
    id: pyretic-brand
    time: 13
    name: Pyretic Brand
    damage: 0
    damageType: magical
    applyEffect:
      name: Pyretic
      kind: debuff
      duration: 8
      behavior: { kind: dot, dps: 8, condition: moving }

  # Deep Freeze — ticks while idle.
  - <<: *hitBase
    id: deep-freeze
    time: 25
    name: Deep Freeze
    damage: 0
    damageType: magical
    applyEffect:
      name: Freeze
      kind: debuff
      duration: 8
      behavior: { kind: dot, dps: 8, condition: idle }
