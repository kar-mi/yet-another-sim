# Tower Test — demonstrates YAML raid authoring with anchors and merge keys.
# Comments explain each phase; the &towerBase anchor keeps shared fields DRY.

name: Tower Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 26

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: -8, z: -8 }
    pattern:
      - { time: 14, pos: { x: -12.5, z: 0.5 } }
  - id: h1
    role: healer
    spawn: { x: 0, z: 12 }
  - id: h2
    role: healer
    spawn: { x: 6, z: 6 }
  - id: r1
    role: dps
    spawn: { x: 8, z: -2 }
    pattern:
      - { time: 7, pos: { x: 11, z: 0 } }
  - id: r2
    role: dps
    spawn: { x: 8, z: 2 }
    pattern:
      - { time: 7, pos: { x: 13, z: 0 } }
  - id: m1
    role: dps
    spawn: { x: -5, z: -5 }
    pattern:
      - { time: 14, pos: { x: -11.5, z: -0.5 } }
  - id: m2
    role: dps
    spawn: { x: 5, z: -5 }

# Shared tower defaults — merged into each event with <<: *towerBase.
# Override individual fields (e.g. telegraph, failureDamage) in the event itself.
_towerBase: &towerBase
  type: tower
  telegraph: 4
  radius: 3
  failureDamage: 30

events:
  # Phase 1 — single soak: the human player must step in alone.
  - <<: *towerBase
    id: single-tower
    time: 3
    name: Single Tower
    pos: { x: 0, z: 12 }
    requiredCount: 1
    failureDamageType: magical
    visual:
      fallingCylinder: true
      countCircles: true
      groundStyle: standard
      cylinderColor: "#33ccff"
      cylinderThickness: 3

  # Phase 2 — double soak: two players must share the tower.
  - <<: *towerBase
    id: double-tower
    time: 10
    name: Double Tower
    pos: { x: 12, z: 0 }
    requiredCount: 2
    failureDamageType: physical
    visual:
      countCircles: true
      pillar: true
      groundStyle: standard

  # Phase 3 — role-restricted: tank/healer only; knocks back on soak;
  #   wrong-role players die instantly; leaves a magic vulnerability debuff.
  - <<: *towerBase
    id: support-tower
    time: 17
    name: Support Tower
    telegraph: 5
    pos: { x: -12, z: 0 }
    failureDamage: 40
    failureDamageType: magical
    requiredRoles: [tank, healer]
    wrongRoleLethal: true
    applyEffect:
      name: Magic Vulnerability
      kind: debuff
      duration: 8
      behavior:
        kind: vuln
        damageType: magical
        multiplier: 1.5
    knockback:
      distance: 8
    visual:
      fallingCylinder: true
      pillar: true
      groundStyle: tank
      cylinderColor: "#cc66ff"

waymarks:
  - { mark: A, pos: { x: 0, z: 16 } }
  - { mark: B, pos: { x: 16, z: 0 } }
  - { mark: D, pos: { x: -16, z: 0 } }
