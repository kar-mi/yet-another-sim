# Tower Test — demonstrates YAML raid authoring with anchors and merge keys.
# Comments explain each phase; the &towerBase anchor keeps shared fields DRY.

name: Tower Test
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 26

players:
  - id: mt
    role: tank
    spawn: [0, 8]
  - id: ot
    role: tank
    spawn: [-8, -8]
    pattern:
      - { t: 14, pos: [-12.5, 0.5] }
  - id: h1
    role: healer
    spawn: [0, 12]
  - id: h2
    role: healer
    spawn: [6, 6]
  - id: r1
    role: dps
    spawn: [8, -2]
    pattern:
      - { t: 7, pos: [11, 0] }
  - id: r2
    role: dps
    spawn: [8, 2]
    pattern:
      - { t: 7, pos: [13, 0] }
  - id: m1
    role: dps
    spawn: [-5, -5]
    pattern:
      - { t: 14, pos: [-11.5, -0.5] }
  - id: m2
    role: dps
    spawn: [5, -5]

# Shared tower defaults — merged into each event with <<: *towerBase.
# Override individual fields (e.g. telegraph, failureDamage) in the event itself.
_towerBase: &towerBase
  type: tower
  telegraph: 4
  radius: 3
  failureDamage: 30

events:
  # Phase 1 — single soak: the human player must step in alone.
  - <<: *towerBase
    id: single-tower
    t: 3
    name: Single Tower
    pos: [0, 12]
    requiredCount: 1
    failureDamageType: magical
    visual:
      fallingCylinder: true
      countCircles: true
      groundStyle: standard
      cylinderColor: "#33ccff"
      cylinderThickness: 3

  # Phase 2 — double soak: two players must share the tower.
  - <<: *towerBase
    id: double-tower
    t: 10
    name: Double Tower
    pos: [12, 0]
    requiredCount: 2
    failureDamageType: physical
    visual:
      countCircles: true
      pillar: true
      groundStyle: standard

  # Phase 3 — role-restricted: tank/healer only; knocks back on soak;
  #   wrong-role players die instantly; leaves a magic vulnerability debuff.
  - <<: *towerBase
    id: support-tower
    t: 17
    name: Support Tower
    telegraph: 5
    pos: [-12, 0]
    failureDamage: 40
    failureDamageType: magical
    requiredRoles: [tank, healer]
    wrongRoleLethal: true
    applyEffect:
      name: Magic Vulnerability
      kind: debuff
      duration: 8
      behavior:
        kind: vuln
        damageType: magical
        multiplier: 1.5
    knockback:
      distance: 8
    visual:
      fallingCylinder: true
      pillar: true
      groundStyle: tank
      cylinderColor: "#cc66ff"

waymarks:
  - { mark: A, pos: [0, 16] }
  - { mark: B, pos: [16, 0] }
  - { mark: D, pos: [-16, 0] }
