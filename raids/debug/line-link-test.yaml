# Line Link Test — a north statue links to the four closest dps,
# then resolves with knockback and a magic vulnerability.

name: Line Link Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 30
duration: 35

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

events:
  - type: line_link
    id: north-statue
    time: 4
    name: North Statue
    pos: { x: 0, z: 34 }
    linkDuration: 3
    resolveAfter: 10
    target: { roles: [dps], count: 4, mode: closest }
    hiddenDebuffName: Line Linked
    applyEffect:
      name: Magic Vulnerability
      kind: debuff
      duration: 8
      behavior: { kind: vuln, damageType: magical, multiplier: 1.5 }
    knockback: { distance: 12 }
    visual: { kind: statue, width: 3, height: 5, depth: 1 }
