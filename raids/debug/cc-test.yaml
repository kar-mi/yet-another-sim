# CC Test — crowd-control mechanics: sleep ring, confusion donut,
# then four forced-march ground traps on the cardinals.

name: CC Test
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 30
duration: 45

players:
  - id: mt
    role: tank
    control: bot
    spawn: [0, 7]
  - id: ot
    role: tank
    control: bot
    spawn: [7, 0]
  - id: h1
    role: healer
    control: bot
    spawn: [0, -7]
  - id: h2
    role: healer
    control: bot
    spawn: [-7, 0]
  - id: r1
    role: dps
    control: bot
    spawn: [0, 20]
  - id: r2
    role: dps
    control: bot
    spawn: [20, 0]
  - id: m1
    role: dps
    control: human
    spawn: [0, -20]
  - id: m2
    role: dps
    control: bot
    spawn: [-20, 0]

# Shared forced-march trap defaults — merged into each march event.
_marchBase: &marchBase
  type: forced_march
  t: 4.5
  radius: 1.2
  distance: 8
  duration: 25
  preDelay: 0.3
  postDelay: 0.3

events:
  # Sleep the supports standing near the center.
  - id: slumber-supports
    t: 3
    name: Slumber (supports)
    telegraph: 1.5
    damage: 0
    damageType: magical
    applyEffect:
      name: Sleep
      kind: debuff
      duration: 22
      behavior: { kind: sleep }
    shape: { kind: circle, center: [0, 0], radius: 9 }

  # Confuse the dps standing in the outer donut.
  - id: confusion-dps
    t: 3
    name: Confusion (dps)
    telegraph: 1.5
    damage: 0
    damageType: magical
    applyEffect:
      name: Confusion
      kind: debuff
      duration: 25
      behavior: { kind: confusion, damage: 50, damageType: "true", radius: 1.5 }
    shape: { kind: donut, center: [0, 0], inner: 12, outer: 25 }

  # Forced-march traps on the four cardinals.
  - <<: *marchBase
    id: march-n
    name: March N
    pos: [0, 14]
    direction: [0, 1]
  - <<: *marchBase
    id: march-e
    name: March E
    pos: [14, 0]
    direction: [1, 0]
  - <<: *marchBase
    id: march-s
    name: March S
    pos: [0, -14]
    direction: [0, -1]
  - <<: *marchBase
    id: march-w
    name: March W
    pos: [-14, 0]
    direction: [-1, 0]
