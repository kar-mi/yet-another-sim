# CC Test — crowd-control mechanics: sleep ring, confusion donut,
# then four forced-march ground traps on the cardinals.

name: CC Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 30
duration: 45

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 7 }
  - id: ot
    role: tank
    spawn: { x: 7, z: 0 }
  - id: h1
    role: healer
    spawn: { x: 0, z: -7 }
  - id: h2
    role: healer
    spawn: { x: -7, z: 0 }
  - id: r1
    role: dps
    spawn: { x: 0, z: 20 }
  - id: r2
    role: dps
    spawn: { x: 20, z: 0 }
  - id: m1
    role: dps
    spawn: { x: 0, z: -20 }
  - id: m2
    role: dps
    spawn: { x: -20, z: 0 }

# Shared forced-march trap defaults — merged into each march event.
_marchBase: &marchBase
  type: forced_march
  time: 4.5
  radius: 1.2
  distance: 8
  duration: 25
  preDelay: 0.3
  postDelay: 0.3

events:
  # Sleep the supports standing near the center.
  - id: slumber-supports
    time: 3
    name: Slumber (supports)
    telegraph: 1.5
    damage: 0
    damageType: magical
    applyEffect:
      name: Sleep
      kind: debuff
      duration: 22
      behavior: { kind: sleep }
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 9 }

  # Confuse the dps standing in the outer donut.
  - id: confusion-dps
    time: 3
    name: Confusion (dps)
    telegraph: 1.5
    damage: 0
    damageType: magical
    applyEffect:
      name: Confusion
      kind: debuff
      duration: 25
      behavior: { kind: confusion, damage: 50, damageType: "true", radius: 1.5 }
    shape: { kind: donut, center: { x: 0, z: 0 }, inner: 12, outer: 25 }

  # Forced-march traps on the four cardinals.
  - <<: *marchBase
    id: march-n
    name: March N
    pos: { x: 0, z: 14 }
    direction: { x: 0, z: 1 }
  - <<: *marchBase
    id: march-e
    name: March E
    pos: { x: 14, z: 0 }
    direction: { x: 1, z: 0 }
  - <<: *marchBase
    id: march-s
    name: March S
    pos: { x: 0, z: -14 }
    direction: { x: 0, z: -1 }
  - <<: *marchBase
    id: march-w
    name: March W
    pos: { x: -14, z: 0 }
    direction: { x: -1, z: 0 }
