# Entropy / Dynamic Fluid demo — exercises the burstSpread mechanic.
#
# Entropy carriers: circle self-pop (r 6) + donut follow-up (inner 3, outer 8) on closest 2.
# Dynamic Fluid carriers: donut self-pop (inner 3, outer 8) + circle follow-up (r 6) on closest 2.
#
# Resolution at t ≈ 23: each carrier pops in place, then their two closest
# neighbours get hit by the opposite shape. Stand spread to avoid chaining.

name: Entropy / Dynamic Fluid Test

arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20

duration: 35

players:
  - { id: mt, role: tank,   spawn: { x: 0, z: 10 }  }
  - { id: ot, role: tank,   spawn: { x: 0, z: -10 }  }
  - { id: h1, role: healer, spawn: { x: -10, z: 0 }  }
  - { id: h2, role: healer, spawn: { x: 10, z: 0 }  }
  - { id: r1, role: dps,    spawn: { x: -7, z: 7 }  }
  - { id: r2, role: dps,    spawn: { x: 7, z: 7 }  }
  - { id: m1, role: dps,    spawn: { x: -7, z: -7 }  }
  - { id: m2, role: dps,    spawn: { x: 7, z: -7 }  }

# Shared debuff behaviors.
_entropy: &entropy
  ref: debug_entropy

_dynamicFluid: &dynamicFluid
  ref: debug_dynamic_fluid

events:
  # Opening raidwide to prime HP.
  - id: raidwide
    time: 2
    name: Raidwide
    telegraph: 2
    damage: 10
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 38 }

  # Entropy → tanks + melee DPS.
  - type: apply_effect
    id: entropy
    time: 5
    name: Entropy
    players: [mt, ot, m1, m2]
    applyEffect: *entropy

  # Dynamic Fluid → healers + ranged DPS.
  - type: apply_effect
    id: dynamic-fluid
    time: 5
    name: Dynamic Fluid
    players: [h1, h2, r1, r2]
    applyEffect: *dynamicFluid

waymarks:
  - { mark: A, pos: { x: 0, z: 16 } }
  - { mark: B, pos: { x: 16, z: 0 } }
  - { mark: C, pos: { x: 0, z: -16 } }
  - { mark: D, pos: { x: -16, z: 0 } }
