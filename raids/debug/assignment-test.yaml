name: Assignment Test
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 35

players:
  - id: mt
    role: tank
    spawn: [0, 7]
  - id: ot
    role: tank
    spawn: [7, 0]
  - id: h1
    role: healer
    spawn: [0, -7]
  - id: h2
    role: healer
    spawn: [-7, 0]
  - id: r1
    role: dps
    spawn: [0, 14]
  - id: r2
    role: dps
    spawn: [14, 0]
  - id: m1
    role: dps
    spawn: [0, -14]
  - id: m2
    role: dps
    spawn: [-14, 0]

events:
  # First / Second / Third in Line — priority debuffs on three explicit players.
  - type: apply_effect
    id: assign-first
    t: 5
    name: First in Line
    players: [mt]
    applyEffect:
      name: First in Line
      kind: debuff
      duration: 18
      behavior: { kind: assignment, expiryDamage: 20, expiryDamageType: "true" }
      icon: first_in_line.png
      marker: "1"

  - type: apply_effect
    id: assign-second
    t: 5
    name: Second in Line
    players: [ot]
    applyEffect:
      name: Second in Line
      kind: debuff
      duration: 18
      behavior: { kind: assignment, expiryDamage: 20, expiryDamageType: "true" }
      icon: second_in_line.png
      marker: "2"

  - type: apply_effect
    id: assign-third
    t: 5
    name: Third in Line
    players: [h1]
    applyEffect:
      name: Third in Line
      kind: debuff
      duration: 18
      behavior: { kind: assignment, expiryDamage: 20, expiryDamageType: "true" }
      icon: third_in_line.png
      marker: "3"

  # Alpha / Beta — group split across all eight players.
  - type: apply_effect
    id: assign-alpha
    t: 5
    name: Alpha
    players: [mt, ot, r1, r2]
    applyEffect:
      name: Alpha
      kind: debuff
      duration: 20
      behavior: { kind: assignment, expiryDamage: 20, expiryDamageType: "true" }
      icon: alpha.png
      marker: "α"

  - type: apply_effect
    id: assign-beta
    t: 5
    name: Beta
    players: [h1, h2, m1, m2]
    applyEffect:
      name: Beta
      kind: debuff
      duration: 20
      behavior: { kind: assignment, expiryDamage: 20, expiryDamageType: "true" }
      icon: beta.png
      marker: "β"
