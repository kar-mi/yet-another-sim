name: Assignment Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 35

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 7 }
  - id: ot
    role: tank
    spawn: { x: 7, z: 0 }
  - id: h1
    role: healer
    spawn: { x: 0, z: -7 }
  - id: h2
    role: healer
    spawn: { x: -7, z: 0 }
  - id: r1
    role: dps
    spawn: { x: 0, z: 14 }
  - id: r2
    role: dps
    spawn: { x: 14, z: 0 }
  - id: m1
    role: dps
    spawn: { x: 0, z: -14 }
  - id: m2
    role: dps
    spawn: { x: -14, z: 0 }

events:
  # First / Second / Third in Line — priority debuffs on three explicit players.
  - type: apply_effect
    id: assign-first
    time: 5
    name: First in Line
    players: [mt]
    applyEffect:
      ref: first_in_line

  - type: apply_effect
    id: assign-second
    time: 5
    name: Second in Line
    players: [ot]
    applyEffect:
      ref: second_in_line

  - type: apply_effect
    id: assign-third
    time: 5
    name: Third in Line
    players: [h1]
    applyEffect:
      ref: third_in_line

  # Alpha / Beta — group split across all eight players.
  - type: apply_effect
    id: assign-alpha
    time: 5
    name: Alpha
    players: [mt, ot, r1, r2]
    applyEffect:
      ref: alpha

  - type: apply_effect
    id: assign-beta
    time: 5
    name: Beta
    players: [h1, h2, m1, m2]
    applyEffect:
      ref: beta
