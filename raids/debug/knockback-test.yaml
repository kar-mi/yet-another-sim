# Knockback Test — friction slide, gravity arc, custom origin,
# and a localized eruption.

name: Knockback Test
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 30
duration: 42

players:
  - id: mt
    role: tank
    spawn: [0, 8]
  - id: ot
    role: tank
    spawn: [0, -8]
  - id: h1
    role: healer
    spawn: [-8, 0]
  - id: h2
    role: healer
    spawn: [8, 0]
  - id: r1
    role: dps
    spawn: [-5.66, 5.66]
  - id: r2
    role: dps
    spawn: [5.66, 5.66]
  - id: m1
    role: dps
    spawn: [-5.66, -5.66]
  - id: m2
    role: dps
    spawn: [5.66, -5.66]

# Arena-wide hit circle shared by most events.
_arenaCircle: &arenaCircle { kind: circle, center: [0, 0], radius: 30 }

events:
  # Plain raidwide, no knockback (control case).
  - id: raidwide
    t: 2
    name: Raidwide
    telegraph: 3
    damage: 20
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: *arenaCircle

  # Flat friction-slide knockback.
  - id: shockwave
    t: 8
    name: Shockwave
    telegraph: 3
    damage: 15
    damageType: physical
    showCastBar: true
    shape: *arenaCircle
    knockback: { distance: 12 }

  # Gravity-arc launch (height > 0).
  - id: skyward-launch
    t: 15
    name: Skyward Launch
    telegraph: 3
    damage: 0
    damageType: physical
    showCastBar: true
    shape: *arenaCircle
    knockback: { distance: 10, height: 9 }

  # Knockback from a custom origin south of the arena.
  - id: tidal-crash
    t: 23
    name: Tidal Crash
    telegraph: 4
    damage: 25
    damageType: magical
    showCastBar: true
    shape: *arenaCircle
    knockback: { distance: 14, origin: [0, -40] }

  # Localized eruption with an arcing launch.
  - id: eruption
    t: 32
    name: Eruption
    telegraph: 4
    damage: 30
    damageType: physical
    showCastBar: true
    shape: { kind: circle, center: [0, 0], radius: 8 }
    knockback: { distance: 13, height: 6 }

waymarks:
  - { mark: A, pos: [0, 16] }
  - { mark: B, pos: [16, 0] }
  - { mark: C, pos: [0, -16] }
  - { mark: D, pos: [-16, 0] }
