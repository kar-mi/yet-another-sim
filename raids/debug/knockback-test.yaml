# Knockback Test — friction slide, gravity arc, custom origin,
# and a localized eruption.

name: Knockback Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 30
duration: 42

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

# Arena-wide hit circle shared by most events.
_arenaCircle: &arenaCircle { kind: circle, center: { x: 0, z: 0 }, radius: 30 }

events:
  # Plain raidwide, no knockback (control case).
  - id: raidwide
    time: 2
    name: Raidwide
    telegraph: 3
    damage: 20
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: *arenaCircle

  # Flat friction-slide knockback.
  - id: shockwave
    time: 8
    name: Shockwave
    telegraph: 3
    damage: 15
    damageType: physical
    showCastBar: true
    shape: *arenaCircle
    knockback: { distance: 12 }

  # Gravity-arc launch (height > 0).
  - id: skyward-launch
    time: 15
    name: Skyward Launch
    telegraph: 3
    damage: 0
    damageType: physical
    showCastBar: true
    shape: *arenaCircle
    knockback: { distance: 10, height: 9 }

  # Knockback from a custom origin south of the arena.
  - id: tidal-crash
    time: 23
    name: Tidal Crash
    telegraph: 4
    damage: 25
    damageType: magical
    showCastBar: true
    shape: *arenaCircle
    knockback: { distance: 14, origin: { x: 0, z: -40 } }

  # Localized eruption with an arcing launch.
  - id: eruption
    time: 32
    name: Eruption
    telegraph: 4
    damage: 30
    damageType: physical
    showCastBar: true
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 8 }
    knockback: { distance: 13, height: 6 }

waymarks:
  - { mark: A, pos: { x: 0, z: 16 } }
  - { mark: B, pos: { x: 16, z: 0 } }
  - { mark: C, pos: { x: 0, z: -16 } }
  - { mark: D, pos: { x: -16, z: 0 } }
