# Lightning Variant Test — repeating Mystery Magic pairs: rng inverse rects
# (with mirrored A/B variants) running alongside a spread/stack fire flip.

name: Lightning Variant Test
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 30
botPatterns: lightning-variant-test-bots

players:
  - id: mt
    role: tank
    spawn: [0, 0]
  - id: ot
    role: tank
    spawn: [8, 8]
  - id: h1
    role: healer
    spawn: [-8, 8]
  - id: h2
    role: healer
    spawn: [8, -8]
  - id: r1
    role: dps
    spawn: [-8, -8]
  - id: r2
    role: dps
    spawn: [12, 0]
  - id: m1
    role: dps
    spawn: [-12, 0]
  - id: m2
    role: dps
    spawn: [0, 12]

# Lightning rect geometry — variant A and its mirrored variant B.
_lightningBase: &lightningBase
  type: inverse
  name: Mystery Magic (Lightning)
  telegraph: 5
  damage: 60
  damageType: magical
  showCastBar: true
  rng: true
  variantRng: true
  ringColor: "#a855f7"
  ringHeight: 3.2
  shownShapes:
    - { kind: rect, origin: [-17.929725, -10.174735], direction: [0.724049, 0.689749], width: 10, length: 40 }
    - { kind: rect, origin: [-4.134745, -24.655715], direction: [0.724049, 0.689749], width: 10, length: 40 }
  hiddenShapes:
    - { kind: rect, origin: [-24.827215, -2.934245], direction: [0.724049, 0.689749], width: 10, length: 40 }
    - { kind: rect, origin: [-11.032235, -17.415225], direction: [0.724049, 0.689749], width: 10, length: 40 }
  shownShapesB:
    - { kind: rect, origin: [17.929725, -10.174735], direction: [-0.724049, 0.689749], width: 10, length: 40 }
    - { kind: rect, origin: [4.134745, -24.655715], direction: [-0.724049, 0.689749], width: 10, length: 40 }
  hiddenShapesB:
    - { kind: rect, origin: [24.827215, -2.934245], direction: [-0.724049, 0.689749], width: 10, length: 40 }
    - { kind: rect, origin: [11.032235, -17.415225], direction: [-0.724049, 0.689749], width: 10, length: 40 }

# Fire spread/stack flip cast alongside each lightning.
_fireBase: &fireBase
  type: spread_stack
  name: Mystery Magic (Fire)
  telegraph: 5
  shown: spread
  damageType: magical
  spread: { radius: 4, damage: 0 }
  stack:
    groups: [[r1, r2, m1, m2], [h1, h2, mt, ot]]
    radius: 6
    requiredCount: 4
    damage: 200
  ringColor: "#f97316"
  ringHeight: 7
  showCastBar: true

events:
  # Lock the boss facing for the whole encounter.
  - type: aoe
    id: stillness
    t: 0
    name: Stillness
    telegraph: 25
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 0.1 }

  # Three repeats of the lightning + fire pair.
  - <<: *lightningBase
    id: lightning-1
    t: 4
  - <<: *fireBase
    id: fire-1
    t: 4

  - <<: *lightningBase
    id: lightning-2
    t: 12
  - <<: *fireBase
    id: fire-2
    t: 12

  - <<: *lightningBase
    id: lightning-3
    t: 20
  - <<: *fireBase
    id: fire-3
    t: 20

waymarks:
  - { mark: A, pos: [0, 12] }
  - { mark: B, pos: [12, 0] }
  - { mark: C, pos: [0, -12] }
  - { mark: D, pos: [-12, 0] }
  - { mark: "1", pos: [-6, 6] }
  - { mark: "2", pos: [6, 6] }
  - { mark: "3", pos: [6, -6] }
  - { mark: "4", pos: [-6, -6] }
