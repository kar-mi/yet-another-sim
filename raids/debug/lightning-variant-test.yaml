# Lightning Variant Test — repeating Mystery Magic pairs: rng inverse rects
# (with mirrored A/B variants) running alongside a spread/stack fire flip.

name: Lightning Variant Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 30
botPatterns: lightning-variant-test-bots

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 0 }
  - id: ot
    role: tank
    spawn: { x: 8, z: 8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 8 }
  - id: h2
    role: healer
    spawn: { x: 8, z: -8 }
  - id: r1
    role: dps
    spawn: { x: -8, z: -8 }
  - id: r2
    role: dps
    spawn: { x: 12, z: 0 }
  - id: m1
    role: dps
    spawn: { x: -12, z: 0 }
  - id: m2
    role: dps
    spawn: { x: 0, z: 12 }

# Lightning rect geometry — variant A and its mirrored variant B.
_lightningBase: &lightningBase
  type: inverse
  name: Mystery Magic (Lightning)
  telegraph: 5
  damage: 60
  damageType: magical
  showCastBar: true
  rng: true
  variantRng: true
  ringColor: "#a855f7"
  ringHeight: 3.2
  shownShapes:
    - { kind: rect, origin: { x: -17.929725, z: -10.174735 }, direction: { x: 0.724049, z: 0.689749 }, width: 10, length: 40 }
    - { kind: rect, origin: { x: -4.134745, z: -24.655715 }, direction: { x: 0.724049, z: 0.689749 }, width: 10, length: 40 }
  hiddenShapes:
    - { kind: rect, origin: { x: -24.827215, z: -2.934245 }, direction: { x: 0.724049, z: 0.689749 }, width: 10, length: 40 }
    - { kind: rect, origin: { x: -11.032235, z: -17.415225 }, direction: { x: 0.724049, z: 0.689749 }, width: 10, length: 40 }
  shownShapesB:
    - { kind: rect, origin: { x: 17.929725, z: -10.174735 }, direction: { x: -0.724049, z: 0.689749 }, width: 10, length: 40 }
    - { kind: rect, origin: { x: 4.134745, z: -24.655715 }, direction: { x: -0.724049, z: 0.689749 }, width: 10, length: 40 }
  hiddenShapesB:
    - { kind: rect, origin: { x: 24.827215, z: -2.934245 }, direction: { x: -0.724049, z: 0.689749 }, width: 10, length: 40 }
    - { kind: rect, origin: { x: 11.032235, z: -17.415225 }, direction: { x: -0.724049, z: 0.689749 }, width: 10, length: 40 }

# Fire spread/stack flip cast alongside each lightning.
_fireBase: &fireBase
  type: spread_stack
  name: Mystery Magic (Fire)
  telegraph: 5
  shown: spread
  damageType: magical
  spread: { radius: 4, damage: 0 }
  stack:
    groups: [[r1, r2, m1, m2], [h1, h2, mt, ot]]
    radius: 6
    requiredCount: 4
    damage: 200
  ringColor: "#f97316"
  ringHeight: 7
  showCastBar: true

events:
  # Lock the boss facing for the whole encounter.
  - type: aoe
    id: stillness
    time: 0
    name: Stillness
    telegraph: 25
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 0.1 }

  # Three repeats of the lightning + fire pair.
  - <<: *lightningBase
    id: lightning-1
    time: 4
  - <<: *fireBase
    id: fire-1
    time: 4

  - <<: *lightningBase
    id: lightning-2
    time: 12
  - <<: *fireBase
    id: fire-2
    time: 12

  - <<: *lightningBase
    id: lightning-3
    time: 20
  - <<: *fireBase
    id: fire-3
    time: 20

waymarks:
  - { mark: A, pos: { x: 0, z: 12 } }
  - { mark: B, pos: { x: 12, z: 0 } }
  - { mark: C, pos: { x: 0, z: -12 } }
  - { mark: D, pos: { x: -12, z: 0 } }
  - { mark: "1", pos: { x: -6, z: 6 } }
  - { mark: "2", pos: { x: 6, z: 6 } }
  - { mark: "3", pos: { x: 6, z: -6 } }
  - { mark: "4", pos: { x: -6, z: -6 } }
