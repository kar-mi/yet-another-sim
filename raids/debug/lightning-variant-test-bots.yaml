# Bot solver data for lightning-variant-test — spread/stack spots plus
# lightning-adjusted positions for each shown/inverted A/B outcome.
#
# Generic rules: two-mechanic rules (spread/stack mode + lightning-1 orientation) come first; the
# bare fire-1.<mode> rule is the no-lightning fallback. Bots solve the actual mode, so the resolved
# id is already fire-1.spread / fire-1.stack.

players: {}

solvers:
  generic:
    - when: { mechanic: [fire-1.spread, lightning-1.shown.a] }
      spots: { mt: { x: 6.83, z: 5.13 }, ot: { x: 6, z: -6 }, h1: { x: -5.08, z: -17.27 }, h2: { x: 17.5, z: 4.24 }, r1: { x: 0, z: 18 }, r2: { x: -18, z: 0 }, m1: { x: 2.07, z: -2.17 }, m2: { x: -6, z: -6 } }
