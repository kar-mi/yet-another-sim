# Spread / Stack Test — the "?" fire flip: honest spread, honest stack,
# both lies, and a final rng coin flip.

name: Spread / Stack Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 36

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

# Shared spread/stack defaults.
_flipBase: &flipBase
  type: spread_stack
  telegraph: 4
  damageType: magical
  spread: { radius: 4, damage: 40 }
  stack:
    groups: [[r1, r2, m1, m2], [h1, h2, mt, ot]]
    radius: 6
    requiredCount: 4
    damage: 120
  ringColor: "#f97316"
  ringHeight: 7
  showCastBar: true

events:
  # Lock the boss facing for the whole encounter.
  - type: aoe
    id: stillness
    time: 0
    name: Stillness
    telegraph: 36
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 0.1 }

  # Honest casts — what is shown is what resolves.
  - <<: *flipBase
    id: honest-spread
    time: 3
    name: Honest Spread
    shown: spread
  - <<: *flipBase
    id: honest-stack
    time: 10
    name: Honest Stack
    shown: stack

  # "?" lies — the shown mechanic flips on resolve.
  - <<: *flipBase
    id: lie-spread-is-stack
    time: 17
    name: "Lie: shows Spread, is Stack"
    shown: spread
    questionMark: true
  - <<: *flipBase
    id: lie-stack-is-spread
    time: 24
    name: "Lie: shows Stack, is Spread"
    shown: stack
    questionMark: true

  # Coin flip — random shown mechanic plus a "?" flip chance.
  - <<: *flipBase
    id: coin-flip
    time: 31
    name: Coin Flip (random shown + ?)
    shown: random
    rng: true

botSolvers:
  generic:
    - when: { mechanic: honest-spread.spread }
      spots: { mt: { x: -6, z: 6 }, ot: { x: 6, z: 6 }, h1: { x: 0, z: -18 }, h2: { x: 18, z: 0 }, r1: { x: 0, z: 18 }, r2: { x: -18, z: 0 }, m1: { x: -6, z: 6 }, m2: { x: -6, z: -6 } }
    - when: { mechanic: honest-spread.stack }
      spots: { mt: { x: 6, z: -6 }, ot: { x: 6, z: -6 }, h1: { x: 6, z: -6 }, h2: { x: 6, z: -6 }, r1: { x: -6, z: 6 }, r2: { x: -6, z: 6 }, m1: { x: -6, z: 6 }, m2: { x: -6, z: 6 } }

waymarks:
  - { mark: A, pos: { x: 0, z: 16 } }
  - { mark: B, pos: { x: 16, z: 0 } }
  - { mark: C, pos: { x: 0, z: -16 } }
  - { mark: D, pos: { x: -16, z: 0 } }
