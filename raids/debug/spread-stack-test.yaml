# Spread / Stack Test — the "?" fire flip: honest spread, honest stack,
# both lies, and a final rng coin flip.

name: Spread / Stack Test
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 36

players:
  - id: mt
    role: tank
    spawn: [0, 8]
  - id: ot
    role: tank
    spawn: [0, -8]
  - id: h1
    role: healer
    spawn: [-8, 0]
  - id: h2
    role: healer
    spawn: [8, 0]
  - id: r1
    role: dps
    spawn: [-5.66, 5.66]
  - id: r2
    role: dps
    spawn: [5.66, 5.66]
  - id: m1
    role: dps
    spawn: [-5.66, -5.66]
  - id: m2
    role: dps
    spawn: [5.66, -5.66]

# Shared spread/stack defaults.
_flipBase: &flipBase
  type: spread_stack
  telegraph: 4
  damageType: magical
  spread: { radius: 4, damage: 40 }
  stack:
    groups: [[r1, r2, m1, m2], [h1, h2, mt, ot]]
    radius: 6
    requiredCount: 4
    damage: 120
  ringColor: "#f97316"
  ringHeight: 7
  showCastBar: true

events:
  # Lock the boss facing for the whole encounter.
  - type: aoe
    id: stillness
    t: 0
    name: Stillness
    telegraph: 36
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 0.1 }

  # Honest casts — what is shown is what resolves.
  - <<: *flipBase
    id: honest-spread
    t: 3
    name: Honest Spread
    shown: spread
  - <<: *flipBase
    id: honest-stack
    t: 10
    name: Honest Stack
    shown: stack

  # "?" lies — the shown mechanic flips on resolve.
  - <<: *flipBase
    id: lie-spread-is-stack
    t: 17
    name: "Lie: shows Spread, is Stack"
    shown: spread
    questionMark: true
  - <<: *flipBase
    id: lie-stack-is-spread
    t: 24
    name: "Lie: shows Stack, is Spread"
    shown: stack
    questionMark: true

  # Coin flip — random shown mechanic plus a "?" flip chance.
  - <<: *flipBase
    id: coin-flip
    t: 31
    name: Coin Flip (random shown + ?)
    shown: random
    rng: true

botSolvers:
  spreadStack:
    honest-spread:
      spread:
        mt: [-6, 6]
        ot: [6, 6]
        h1: [0, -18]
        h2: [18, 0]
        r1: [0, 18]
        r2: [-18, 0]
        m1: [-6, 6]
        m2: [-6, -6]
      stack:
        mt: [6, -6]
        ot: [6, -6]
        h1: [6, -6]
        h2: [6, -6]
        r1: [-6, 6]
        r2: [-6, 6]
        m1: [-6, 6]
        m2: [-6, 6]

waymarks:
  - { mark: A, pos: [0, 16] }
  - { mark: B, pos: [16, 0] }
  - { mark: C, pos: [0, -16] }
  - { mark: D, pos: [-16, 0] }
