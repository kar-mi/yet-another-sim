# Arena Zones Test — demonstrates circle, rect, and polygon floor zones.

name: Arena Zones Test
arena:
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 12
    - kind: rect
      center: { x: 18, z: 0 }
      width: 8
      height: 20
    - kind: polygon
      vertices:
        - { x: -24, z: -8 }
        - { x: -14, z: -8 }
        - { x: -19, z: 8 }
duration: 12

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

events: []
