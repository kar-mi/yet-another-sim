    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 20 }

  - type: apply_effect
    id: epic-hero
    time: 5
    name: Epic Hero
    players: [mt, h1, m1, m2]
