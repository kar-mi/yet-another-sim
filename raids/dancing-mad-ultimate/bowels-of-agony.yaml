name: Bowels of Agony
arena:
  floorPlan: dmu-p1
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 106
botPatterns: bowels-of-agony-bots

bosses:
  - id: chaos
    pos: { x: -8, z: 0 }
    aggro: mt
  - id: exdeath
    pos: { x: 8, z: 0 }
    aggro: ot
  - id: kefka
    pos: { x: 0, z: 18 }
    targetable: false
    hidden: true   # not drawn until dash #1 reveals it (teleportBoss), then re-hidden after

crystals:
  spawnAt: 24
  spots: [{ x: -9, z: 9 }, { x: 9, z: 9 }, { x: 9, z: -9 }, { x: -9, z: -9 }]
  rng: true
optionals:
  orderSwap:
    rng: true
    groups:
      - [latitude-implosion-left, latitude-implosion-right]
      - [longitude-implosion-front, longitude-implosion-back]
  # Seeded Kefka dash sweep: dash #1 starts at any card/intercard and the sequence rotates CW or CCW.
  # The events list is the canonical N→CCW order (index = dash number); the limit cut derives its
  # placement basis from the rolled sweep.
  divebombSweep:
    rng: true
    events:
      - kefka-divebomb-1
      - kefka-divebomb-2
      - kefka-divebomb-3
      - kefka-divebomb-4
      - kefka-divebomb-5
      - kefka-divebomb-6
      - kefka-divebomb-7
      - kefka-divebomb-8
    limitCut: bowels-limit-cut

players:
  - { id: mt, role: tank,   spawn: { x: 0, z: 6 } }
  - { id: ot, role: tank,   spawn: { x: 4, z: 8 } }
  - { id: h1, role: healer, spawn: { x: -8, z: 2 } }
  - { id: h2, role: healer, spawn: { x: 8, z: 2 } }
  - { id: r1, role: dps,    spawn: { x: -8, z: -4 } }
  - { id: r2, role: dps,    spawn: { x: 8, z: -4 } }
  - { id: m1, role: dps,    spawn: { x: -4, z: -8 } }
  - { id: m2, role: dps,    spawn: { x: 4, z: -8 } }

_heroEpic: &heroEpic
  ref: epic_hero

_heroFated: &heroFated
  ref: fated_hero

_headwind: &headwind
  ref: bowels_headwind

_tailwind: &tailwind
  ref: bowels_tailwind

_entropyShort: &entropyShort
  ref: entropy_short

_entropyLong: &entropyLong
  ref: entropy_long

_dynamicFluidShort: &dynamicFluidShort
  ref: dynamic_fluid_short

_dynamicFluidLong: &dynamicFluidLong
  ref: dynamic_fluid_long

events:
  # Lock the boss at the start
  - type: aoe
    id: boss-facing-lock-chaos
    time: 0
    name: Forsaken Boss Facing
    telegraph: 6
    damage: 0
    damageType: "true"
    bossId: chaos
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 0.1 }

  # Lock the boss at the start
  - type: aoe
    id: boss-facing-lock-exdeath
    time: 0
    name: Forsaken Boss Facing
    telegraph: 6
    damage: 0
    damageType: "true"
    bossId: exdeath
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 0.1 }


  - type: aoe
