  - type: limit_cut
    id: bowels-limit-cut
    time: 91
    name: Limit Cut
    # Placement basis (relative-north + handedness) is derived from the rolled Kefka divebomb sweep
    # via optionals.divebombSweep — relative-north = opposite dash #1's start, handedness = opposite
    # the sweep direction. No hardcoded rotation here; the seeded sweep fills it in.
    effect:
      name: Limit Cut
      kind: debuff
      duration: 9
      visibility: invisible
      behavior: { kind: none }
      markerIconScale: 2.5

