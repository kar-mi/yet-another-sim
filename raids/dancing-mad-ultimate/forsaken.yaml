# Forsaken — eight two-player tower soaks with charge-debuff resolutions,
# interleaved with stored Past/Future Ending cones baited on the closest player.

name: Forsaken
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 118
boss:
  pos: [0, 0]
  radius: 3
  ring:
    scale: 2
    color: "#e62120"
botPatterns: forsaken-bots

# Tower positions on the 8-radius ring, named by compass direction.
# Convention: pos is [northward, westward] — first component +N/-S, second +W/-E.
# Intercardinals use 8./√2 ≈ 5.65 per axis so they sit the same 8 from center.
_towerPos:
  N:  &posN  [8, 0]
  S:  &posS  [-8, 0]
  W:  &posW  [0, 8]
  E:  &posE  [0, -8]
  NW: &posNW [5.65, 5.65]
  NE: &posNE [5.65, -5.65]
  SW: &posSW [-5.65, 5.65]
  SE: &posSE [-5.65, -5.65]

players:
  - id: mt
    role: tank
    spawn: [0, 8]
  - id: ot
    role: tank
    spawn: [0, -8]
  - id: h1
    role: healer
    spawn: [-8, 0]
  - id: h2
    role: healer
    spawn: [8, 0]
  - id: r1
    role: dps
    spawn: [-5.66, 5.66]
  - id: r2
    role: dps
    spawn: [5.66, 5.66]
  - id: m1
    role: dps
    spawn: [-5.66, -5.66]
  - id: m2
    role: dps
    spawn: [5.66, -5.66]

optionals:
  towerRng: true
  combinations:
    pairings:
      rng: true
      patterns:
        - id: baseline
          pairs:
            - { members: [h1, mt], group: A, charges: [stack, defamation] }
            - { members: [h2, ot], group: B, charges: [cone, cone] }
            - { members: [r1, m1], group: A, charges: [stack, cone] }
            - { members: [r2, m2], group: B, charges: [defamation, defamation] }
        - id: alternate
          pairs:
            - { members: [h1, mt], group: B, charges: [cone, cone] }
            - { members: [h2, ot], group: A, charges: [stack, defamation] }
            - { members: [r1, m1], group: B, charges: [defamation, defamation] }
            - { members: [r2, m2], group: A, charges: [stack, cone] }
        - id: pattern-c
          pairs:
            - { members: [h1, mt], group: A, charges: [stack, defamation] }
            - { members: [h2, ot], group: B, charges: [cone, cone] }
            - { members: [r1, m1], group: B, charges: [defamation, defamation] }
            - { members: [r2, m2], group: A, charges: [stack, cone] }
        - id: pattern-d
          pairs:
            - { members: [h1, mt], group: B, charges: [cone, cone] }
            - { members: [h2, ot], group: A, charges: [stack, defamation] }
            - { members: [r1, m1], group: A, charges: [stack, cone] }
            - { members: [r2, m2], group: B, charges: [defamation, defamation] }

# Shared lethal tower defaults — every tower resolves the charge debuffs
# of its soakers via the three resolvers below.
_towerBase: &towerBase
  type: tower
  telegraph: 10
  radius: 4
  requiredCount: 2
  failureDamage: 999999
  failureDamageType: "true"
  resolveEventIds: [forsaken-stack-resolve, forsaken-cone-resolve, forsaken-defamation-resolve]
  visual:
    fallingObject: sphere
    cylinderThickness: 3.5
    fallingObjectAlpha: 0.7

# Deferred half-arena (180°) ending cone, stored then baited. Each instance sets its own
# directionOffset at store time: 0 = Future (front, toward the baited player), π = Past (rear,
# away from the baited player). The boss only turns when the linked bait fires.
_endingBase: &endingBase
  type: aoe
  deferred: true
  anchor: boss
  directionFrom: bossFacing
  telegraph: 5
  damage: 90
  damageType: magical
  shape: { kind: cone, angleDeg: 180, length: 24 }
  telegraphMode: resolve
  showCastBar: false

# Clone marker on the closest player while an ending is stored.
_closeBaitBase: &closeBaitBase
  type: targeted
  targetMode: closest
  radius: 2.5
  telegraph: 5
  damage: 0
  damageType: "true"
  showCastBar: false
  showTelegraph: true

# Bait that turns the boss to the closest player and fires its linked stored ending.
_allEndingBase: &allEndingBase
  type: bait
  targetMode: closest
  telegraph: 5
  showCastBar: true

# Spread the clones drop on the 4 closest players as each All Ending resolves (no cast bar).
# Each spread mirrors its All Ending's t/telegraph so the two resolve in the same tick.
_cloneSpreadBase: &cloneSpreadBase
  type: targeted
  name: Clone Spread
  targetMode: closest
  count: 4
  radius: 5
  damage: 15
  damageType: magical
  showCastBar: false
  showTelegraph: false

events:
  # Lock the boss facing for the whole encounter.
  - type: aoe
    id: boss-facing-lock
    t: 0
    name: Forsaken Boss Facing
    telegraph: 118
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 0.1 }

  # Charge-debuff resolvers, fired by towers via resolveEventIds.
  - type: effect_resolver
    id: forsaken-stack-resolve
    name: Stack Resolve
    effectName: Stack Charge
    action: { kind: stack, radius: 4.5, requiredCount: 3, damage: 80, damageType: magical }
  - type: effect_resolver
    id: forsaken-cone-resolve
    name: Cone Resolve
    effectName: Cone Charge
    action: { kind: cone_nearest, angleDeg: 70, length: 14, damage: 12, damageType: physical }
  - type: effect_resolver
    id: forsaken-defamation-resolve
    name: Defamation Resolve
    effectName: Defamation Charge
    action: { kind: spread, radius: 2.5, damage: 8, damageType: magical }

  # Opener — raidwide plus pair/assignment distribution.
  - type: aoe
    id: forsaken-raidwide
    t: 3.0
    name: Forsaken
    telegraph: 3
    damage: 25
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 20 }
  # Charge distribution + per-tower re-balance. The opener stamps each player's planned charge
  # (world.initialCharges, from optionals.combinations.pairings). After each tower wave resolves
  # (its soakers' charges consumed by the resolvers above), it re-balances back up to the next
  # wave's target counts, dealt to the just-resolved soakers in roster order.
  - type: reassign
    id: forsaken-charges
    t: 3.0
    name: Forsaken Assignment
    initial: plan
    onResolve:
      tower-odd:  { stack: 0, cone: 4, defamation: 4 }
      tower-even: { stack: 2, cone: 3, defamation: 3 }
    charges:
      - kind: stack
        effect: { name: Stack Charge, kind: debuff, duration: 120, visibility: invisible, behavior: { kind: none } }
        marker: { name: Stack Charge Marker, kind: debuff, duration: 5, visibility: invisible, markerIcon: stack_processed.png, behavior: { kind: none } }
      - kind: cone
        effect: { name: Cone Charge, kind: debuff, duration: 120, visibility: invisible, behavior: { kind: none } }
        marker: { name: Cone Charge Marker, kind: debuff, duration: 5, visibility: invisible, markerIcon: cone_processed.png, behavior: { kind: none } }
      - kind: defamation
        effect: { name: Defamation Charge, kind: debuff, duration: 120, visibility: invisible, behavior: { kind: none } }
        marker: { name: Defamation Charge Marker, kind: debuff, duration: 5, visibility: invisible, markerIcon: defam_processed.png, behavior: { kind: none } }

  # Towers 1-2 (A side).
  - <<: *towerBase
    id: tower-1-left
    t: 6.0
    name: Forsaken Tower 1 Left (A)
    labels: [tower-odd]
    group: A
    pos: *posW
  - <<: *towerBase
    id: tower-1-right
    t: 6.0
    name: Forsaken Tower 1 Right (A)
    labels: [tower-odd]
    group: A
    pos: *posN
  - type: heal
    id: heal-after-tower-1
    t: 18
    name: Tower 1 Recovery

  - <<: *towerBase
    id: tower-2-left
    t: 16.0
    name: Forsaken Tower 2 Left (A)
    labels: [tower-even]
    group: A
    pos: *posNW
  - <<: *towerBase
    id: tower-2-right
    t: 16.0
    name: Forsaken Tower 2 Right (A)
    labels: [tower-even]
    group: A
    pos: *posNE
  - type: heal
    id: heal-after-tower-2
    t: 28
    name: Tower 2 Recovery

  # Ending 1 (Future / front) — cast 20→26 (stored as the clone bait appears), baited at 31.
  - <<: *endingBase
    id: ending-store-1
    t: 20.0
    name: Future Ending
    directionOffset: 0
    telegraph: 6
    showCastBar: true
  - <<: *closeBaitBase
    id: close-bait-1
    t: 26.0
    name: Clone Bait
    labels: [bait-1]
  - <<: *allEndingBase
    id: all-ending-1
    t: 31.0
    name: All Ending
    link: ending-store-1
  - <<: *cloneSpreadBase
    id: clone-spread-1
    t: 31.0
    telegraph: 5

  - <<: *towerBase
    id: tower-3-left
    t: 26.0
    name: Forsaken Tower 3 Left (A)
    labels: [tower-odd]
    group: A
    pos: *posN
  - <<: *towerBase
    id: tower-3-right
    t: 26.0
    name: Forsaken Tower 3 Right (A)
    labels: [tower-odd]
    group: A
    pos: *posE
  - type: heal
    id: heal-after-tower-3
    t: 38
    name: Tower 3 Recovery

  - <<: *towerBase
    id: tower-4-left
    t: 36.0
    name: Forsaken Tower 4 Left (B)
    labels: [tower-even]
    group: B
    pos: *posNE
  - <<: *towerBase
    id: tower-4-right
    t: 36.0
    name: Forsaken Tower 4 Right (B)
    labels: [tower-even]
    group: B
    pos: *posSE
  - type: heal
    id: heal-after-tower-4
    t: 48
    name: Tower 4 Recovery

  # Ending 2 (Past / rear) — cast 40→46 (stored as the clone bait appears), baited at 53.
  - <<: *endingBase
    id: ending-store-2
    t: 40.0
    name: Past Ending
    directionOffset: 3.141592653589793
    telegraph: 6
    showCastBar: true
  - <<: *closeBaitBase
    id: close-bait-2
    t: 46.0
    name: Clone Bait
    labels: [bait-2]
    telegraph: 7
  - <<: *allEndingBase
    id: all-ending-2
    t: 53.0
    name: All Ending
    telegraph: 3
    link: ending-store-2
  - <<: *cloneSpreadBase
    id: clone-spread-2
    t: 53.0
    telegraph: 3

  - <<: *towerBase
    id: tower-5-left
    t: 46.0
    name: Forsaken Tower 5 Left (B)
    labels: [tower-odd]
    group: B
    pos: *posE
  - <<: *towerBase
    id: tower-5-right
    t: 46.0
    name: Forsaken Tower 5 Right (B)
    labels: [tower-odd]
    group: B
    pos: *posS
  - type: heal
    id: heal-after-tower-5
    t: 58
    name: Tower 5 Recovery

  - <<: *towerBase
    id: tower-6-left
    t: 56.0
    name: Forsaken Tower 6 Left (B)
    labels: [tower-even]
    group: B
    pos: *posSE
  - <<: *towerBase
    id: tower-6-right
    t: 56.0
    name: Forsaken Tower 6 Right (B)
    labels: [tower-even]
    group: B
    pos: *posSW
  - type: heal
    id: heal-after-tower-6
    t: 68
    name: Tower 6 Recovery

  # Ending 3 (Future / front) — cast 60→66 (stored as the clone bait appears), baited at 71.
  - <<: *endingBase
    id: ending-store-3
    t: 60.0
    name: Future Ending
    directionOffset: 0
    telegraph: 6
    showCastBar: true
  - <<: *closeBaitBase
    id: close-bait-3
    t: 66.0
    name: Clone Bait
    labels: [bait-3]
  - <<: *allEndingBase
    id: all-ending-3
    t: 71.0
    name: All Ending
    link: ending-store-3
  - <<: *cloneSpreadBase
    id: clone-spread-3
    t: 71.0
    telegraph: 5

  - <<: *towerBase
    id: tower-7-left
    t: 66.0
    name: Forsaken Tower 7 Left (B)
    labels: [tower-odd]
    group: B
    pos: *posS
  - <<: *towerBase
    id: tower-7-right
    t: 66.0
    name: Forsaken Tower 7 Right (B)
    labels: [tower-odd]
    group: B
    pos: *posW
  - type: heal
    id: heal-after-tower-7
    t: 78
    name: Tower 7 Recovery

  - <<: *towerBase
    id: tower-8-left
    t: 76.0
    name: Forsaken Tower 8 Left (A)
    labels: [tower-even]
    group: A
    pos: *posSW
  - <<: *towerBase
    id: tower-8-right
    t: 76.0
    name: Forsaken Tower 8 Right (A)
    labels: [tower-even]
    group: A
    pos: *posNW
  - type: heal
    id: heal-after-tower-8
    t: 88
    name: Tower Recovery

  # Ending 4 (Past / rear) — cast 80→86 (stored as the clone bait appears), then the closing raidwide.
  - <<: *endingBase
    id: ending-store-4
    t: 80.0
    name: Past Ending
    directionOffset: 3.141592653589793
    telegraph: 6
    showCastBar: true
  - <<: *closeBaitBase
    id: close-bait-4
    t: 86.0
    name: Clone Bait
    labels: [bait-4]
    telegraph: 7
  - <<: *allEndingBase
    id: all-ending-4
    t: 93.0
    name: All Ending
    # No tower follows ending 4, so the bait itself is labeled to hold the cluster (away from the
    # rear cleave) through resolve. Earlier baits hand off to their coincident tower instead.
    labels: [bait-4]
    telegraph: 6
    link: ending-store-4
  - <<: *cloneSpreadBase
    id: clone-spread-4
    t: 93.0
    telegraph: 6

  - type: aoe
    id: forsaken-end-raidwide
    t: 106.0
    name: Forsaken Ends
    telegraph: 3
    damage: 35
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 20 }

waymarks:
  - { mark: A, pos: [0, 12] }
  - { mark: B, pos: [-12, 0] }
  - { mark: C, pos: [0, -12] }
  - { mark: D, pos: [12, 0] }
  - { mark: "1", pos: [6, 6] }
  - { mark: "2", pos: [-6, 6] }
  - { mark: "3", pos: [-6, -6] }
  - { mark: "4", pos: [6, -6] }
