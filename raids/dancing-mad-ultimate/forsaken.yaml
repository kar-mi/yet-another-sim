# Forsaken — eight two-player tower soaks with charge-debuff resolutions,
# interleaved with stored Past/Future Ending cones baited on the closest player.

name: Forsaken
arena:
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 118
boss:
  pos: [0, 0]
  radius: 3
  ring:
    scale: 2
    color: "#e62120"
botPatterns: forsaken-bots

# Tower positions on the 8-radius ring, named by compass direction.
# Convention: pos is [northward, westward] — first component +N/-S, second +W/-E.
# Intercardinals use 8./√2 ≈ 5.65 per axis so they sit the same 8 from center.
_towerPos:
  N:  &posN  [8, 0]
  S:  &posS  [-8, 0]
  W:  &posW  [0, 8]
  E:  &posE  [0, -8]
  NW: &posNW [5.65, 5.65]
  NE: &posNE [5.65, -5.65]
  SW: &posSW [-5.65, 5.65]
  SE: &posSE [-5.65, -5.65]

players:
  - id: mt
    role: tank
    spawn: [0, 8]
  - id: ot
    role: tank
    spawn: [0, -8]
  - id: h1
    role: healer
    spawn: [-8, 0]
  - id: h2
    role: healer
    spawn: [8, 0]
  - id: r1
    role: dps
    spawn: [-5.66, 5.66]
  - id: r2
    role: dps
    spawn: [5.66, 5.66]
  - id: m1
    role: dps
    spawn: [-5.66, -5.66]
  - id: m2
    role: dps
    spawn: [5.66, -5.66]

optionals:
  combinations:
    forsaken:
      rng: true
      towerRng: true
      patterns:
        - id: baseline
          pairs:
            - { members: [h1, mt], assignments: [stack, defamation] }
            - { members: [h2, ot], assignments: [cone, cone] }
            - { members: [r1, m1], assignments: [stack, cone] }
            - { members: [r2, m2], assignments: [defamation, defamation] }
        - id: alternate
          pairs:
            - { members: [h1, mt], assignments: [cone, cone] }
            - { members: [h2, ot], assignments: [stack, defamation] }
            - { members: [r1, m1], assignments: [defamation, defamation] }
            - { members: [r2, m2], assignments: [stack, cone] }
        - id: pattern-c
          pairs:
            - { members: [h1, mt], assignments: [stack, defamation] }
            - { members: [h2, ot], assignments: [cone, cone] }
            - { members: [r1, m1], assignments: [defamation, defamation] }
            - { members: [r2, m2], assignments: [stack, cone] }
        - id: pattern-d
          pairs:
            - { members: [h1, mt], assignments: [cone, cone] }
            - { members: [h2, ot], assignments: [stack, defamation] }
            - { members: [r1, m1], assignments: [stack, cone] }
            - { members: [r2, m2], assignments: [defamation, defamation] }

# Shared lethal tower defaults — every tower resolves the charge debuffs
# of its soakers via the three resolvers below.
_towerBase: &towerBase
  type: tower
  telegraph: 5
  radius: 4
  requiredCount: 2
  failureDamage: 999999
  failureDamageType: "true"
  resolveEventIds: [forsaken-stack-resolve, forsaken-cone-resolve, forsaken-defamation-resolve]
  visual:
    fallingObject: sphere
    cylinderThickness: 3.5
    fallingObjectAlpha: 0.7

# Deferred half-arena (180°) ending cone, stored then baited. Each instance sets its own
# directionOffset at store time: 0 = Future (front, toward the baited player), π = Past (rear,
# away from the baited player). The boss only turns when the linked bait fires.
_endingBase: &endingBase
  type: aoe
  deferred: true
  anchor: boss
  directionFrom: bossFacing
  telegraph: 5
  damage: 90
  damageType: magical
  shape: { kind: cone, angleDeg: 180, length: 24 }
  telegraphMode: resolve
  showCastBar: false

# Clone marker on the closest player while an ending is stored.
_closeBaitBase: &closeBaitBase
  type: targeted
  targetMode: closest
  radius: 2.5
  telegraph: 5
  damage: 0
  damageType: "true"
  showCastBar: false
  showTelegraph: true

# Bait that turns the boss to the closest player and fires its linked stored ending.
_allEndingBase: &allEndingBase
  type: bait
  targetMode: closest
  telegraph: 5
  showCastBar: true

events:
  # Lock the boss facing for the whole encounter.
  - type: aoe
    id: boss-facing-lock
    t: 0
    name: Forsaken Boss Facing
    telegraph: 118
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 0.1 }

  # Charge-debuff resolvers, fired by towers via resolveEventIds.
  - type: effect_resolver
    id: forsaken-stack-resolve
    name: Stack Resolve
    effectName: Stack Charge
    action: { kind: stack, radius: 4.5, requiredCount: 3, damage: 80, damageType: magical }
  - type: effect_resolver
    id: forsaken-cone-resolve
    name: Cone Resolve
    effectName: Cone Charge
    action: { kind: cone_nearest, angleDeg: 70, length: 14, damage: 12, damageType: physical }
  - type: effect_resolver
    id: forsaken-defamation-resolve
    name: Defamation Resolve
    effectName: Defamation Charge
    action: { kind: spread, radius: 2.5, damage: 8, damageType: magical }

  # Opener — raidwide plus pair/assignment distribution.
  - type: aoe
    id: forsaken-raidwide
    t: 3.0
    name: Forsaken
    telegraph: 3
    damage: 25
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 20 }
  - type: forsaken_assign
    id: forsaken-assign
    t: 3.0
    name: Forsaken Assignment
    duration: 120
    markerDuration: 5

  # Towers 1-2 (A side).
  - <<: *towerBase
    id: tower-1-left
    t: 11.0
    name: Forsaken Tower 1 Left (A)
    labels: [tower-odd]
    group: A
    pos: *posW
  - <<: *towerBase
    id: tower-1-right
    t: 11.0
    name: Forsaken Tower 1 Right (A)
    labels: [tower-odd]
    group: A
    pos: *posN
  - type: heal
    id: heal-after-tower-1
    t: 18
    name: Tower 1 Recovery

  - <<: *towerBase
    id: tower-2-left
    t: 22.0
    name: Forsaken Tower 2 Left (A)
    labels: [tower-even]
    group: A
    pos: *posNW
  - <<: *towerBase
    id: tower-2-right
    t: 22.0
    name: Forsaken Tower 2 Right (A)
    labels: [tower-even]
    group: A
    pos: *posNE
  - type: heal
    id: heal-after-tower-2
    t: 29
    name: Tower 2 Recovery

  # Ending 1 (Future / front) — stored at 27, baited at 32 alongside tower 3.
  - <<: *endingBase
    id: ending-store-1
    t: 27.0
    name: Future Ending
    directionOffset: 0
    showCastBar: true
  - <<: *closeBaitBase
    id: close-bait-1
    t: 27.0
    name: Clone Bait
    labels: [bait-1]
  - <<: *allEndingBase
    id: all-ending-1
    t: 32.0
    name: All Ending
    link: ending-store-1

  - <<: *towerBase
    id: tower-3-left
    t: 32.0
    name: Forsaken Tower 3 Left (A)
    labels: [tower-odd]
    group: A
    pos: *posN
  - <<: *towerBase
    id: tower-3-right
    t: 32.0
    name: Forsaken Tower 3 Right (A)
    labels: [tower-odd]
    group: A
    pos: *posE
  - type: heal
    id: heal-after-tower-3
    t: 39
    name: Tower 3 Recovery

  - <<: *towerBase
    id: tower-4-left
    t: 42.0
    name: Forsaken Tower 4 Left (B)
    labels: [tower-even]
    group: B
    pos: *posNE
  - <<: *towerBase
    id: tower-4-right
    t: 42.0
    name: Forsaken Tower 4 Right (B)
    labels: [tower-even]
    group: B
    pos: *posSE
  - type: heal
    id: heal-after-tower-4
    t: 49
    name: Tower 4 Recovery

  # Ending 2 (Past / rear) — longer store window (telegraph 7), baited with tower 5.
  - <<: *endingBase
    id: ending-store-2
    t: 47.0
    name: Past Ending
    directionOffset: 3.141592653589793
    telegraph: 7
    showCastBar: true
  - <<: *closeBaitBase
    id: close-bait-2
    t: 47.0
    name: Clone Bait
    labels: [bait-2]
    telegraph: 7
  - <<: *allEndingBase
    id: all-ending-2
    t: 54.0
    name: All Ending
    telegraph: 4
    link: ending-store-2

  - <<: *towerBase
    id: tower-5-left
    t: 54.0
    name: Forsaken Tower 5 Left (B)
    labels: [tower-odd]
    group: B
    telegraph: 4
    pos: *posE
  - <<: *towerBase
    id: tower-5-right
    t: 54.0
    name: Forsaken Tower 5 Right (B)
    labels: [tower-odd]
    group: B
    telegraph: 4
    pos: *posS
  - type: heal
    id: heal-after-tower-5
    t: 60
    name: Tower 5 Recovery

  - <<: *towerBase
    id: tower-6-left
    t: 64.0
    name: Forsaken Tower 6 Left (B)
    labels: [tower-even]
    group: B
    pos: *posSE
  - <<: *towerBase
    id: tower-6-right
    t: 64.0
    name: Forsaken Tower 6 Right (B)
    labels: [tower-even]
    group: B
    pos: *posSW
  - type: heal
    id: heal-after-tower-6
    t: 71
    name: Tower 6 Recovery

  # Ending 3 (Future / front) — stored at 69, baited at 74 alongside tower 7.
  - <<: *endingBase
    id: ending-store-3
    t: 69.0
    name: Future Ending
    directionOffset: 0
    showCastBar: true
  - <<: *closeBaitBase
    id: close-bait-3
    t: 69.0
    name: Clone Bait
    labels: [bait-3]
  - <<: *allEndingBase
    id: all-ending-3
    t: 74.0
    name: All Ending
    link: ending-store-3

  - <<: *towerBase
    id: tower-7-left
    t: 74.0
    name: Forsaken Tower 7 Left (B)
    labels: [tower-odd]
    group: B
    pos: *posS
  - <<: *towerBase
    id: tower-7-right
    t: 74.0
    name: Forsaken Tower 7 Right (B)
    labels: [tower-odd]
    group: B
    pos: *posW
  - type: heal
    id: heal-after-tower-7
    t: 81
    name: Tower 7 Recovery

  - <<: *towerBase
    id: tower-8-left
    t: 84.0
    name: Forsaken Tower 8 Left (A)
    labels: [tower-even]
    group: A
    pos: *posSW
  - <<: *towerBase
    id: tower-8-right
    t: 84.0
    name: Forsaken Tower 8 Right (A)
    labels: [tower-even]
    group: A
    pos: *posNW
  - type: heal
    id: heal-after-tower-8
    t: 91
    name: Tower Recovery

  # Ending 4 (Past / rear) — final stored cone, then the closing raidwide.
  - <<: *endingBase
    id: ending-store-4
    t: 89.0
    name: Past Ending
    directionOffset: 3.141592653589793
    telegraph: 7
    showCastBar: true
  - <<: *closeBaitBase
    id: close-bait-4
    t: 89.0
    name: Clone Bait
    labels: [bait-4]
    telegraph: 7
  - <<: *allEndingBase
    id: all-ending-4
    t: 96.0
    name: All Ending
    # No tower follows ending 4, so the bait itself is labeled to hold the cluster (away from the
    # rear cleave) through resolve. Earlier baits hand off to their coincident tower instead.
    labels: [bait-4]
    telegraph: 6
    link: ending-store-4

  - type: aoe
    id: forsaken-end-raidwide
    t: 109.0
    name: Forsaken Ends
    telegraph: 3
    damage: 35
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 20 }

waymarks:
  - { mark: A, pos: [0, 12] }
  - { mark: B, pos: [-12, 0] }
  - { mark: C, pos: [0, -12] }
  - { mark: D, pos: [12, 0] }
  - { mark: "1", pos: [6, 6] }
  - { mark: "2", pos: [-6, 6] }
  - { mark: "3", pos: [-6, -6] }
  - { mark: "4", pos: [6, -6] }
