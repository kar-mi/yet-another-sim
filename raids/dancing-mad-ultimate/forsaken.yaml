# Forsaken — eight two-player tower soaks with charge-debuff resolutions,
# interleaved with seeded Past/Future Ending cones baited on the closest player.

name: Forsaken
arena:
  floorPlan: dmu-p1
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 123
boss:
  pos: { x: 0, z: 0 }
  radius: 3
  ring:
    scale: 2
    color: "#e62120"
botPatterns: forsaken-bots

# Tower positions on the 8-radius ring, named by compass direction.
# Convention: pos is [northward, westward] — first component +N/-S, second +W/-E.
# Intercardinals use 8./√2 ≈ 5.65 per axis so they sit the same 8 from center.
_towerPos:
  N:  &posN  { x: 8, z: 0 }
  S:  &posS  { x: -8, z: 0 }
  W:  &posW  { x: 0, z: 8 }
  E:  &posE  { x: 0, z: -8 }
  NW: &posNW { x: 5.65, z: 5.65 }
  NE: &posNE { x: 5.65, z: -5.65 }
  SW: &posSW { x: -5.65, z: 5.65 }
  SE: &posSE { x: -5.65, z: -5.65 }

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

optionals:
  towerRng: true
  combinations:
    endings:
      rng: true
      events: [ending-store-1, ending-store-2, ending-store-3, ending-store-4]
      # 2 Future + 2 Past, shuffled across the 4 slots; each rolled variant overrides the
      # store event's directionOffset AND its cast-bar name so the label matches the cone.
      variants:
        - { offset: 0, name: Future Ending }
        - { offset: 0, name: Future Ending }
        - { offset: 3.141592653589793, name: Past Ending }
        - { offset: 3.141592653589793, name: Past Ending }
    pairings:
      rng: true
      patterns:
        - id: baseline
          pairs:
            - { members: [h1, mt], group: A, charges: [stack, defamation] }
            - { members: [h2, ot], group: B, charges: [cone, cone] }
            - { members: [r1, m1], group: A, charges: [stack, cone] }
            - { members: [r2, m2], group: B, charges: [defamation, defamation] }
        - id: alternate
          pairs:
            - { members: [h1, mt], group: B, charges: [cone, cone] }
            - { members: [h2, ot], group: A, charges: [stack, defamation] }
            - { members: [r1, m1], group: B, charges: [defamation, defamation] }
            - { members: [r2, m2], group: A, charges: [stack, cone] }
        - id: pattern-c
          pairs:
            - { members: [h1, mt], group: A, charges: [stack, defamation] }
            - { members: [h2, ot], group: B, charges: [cone, cone] }
            - { members: [r1, m1], group: B, charges: [defamation, defamation] }
            - { members: [r2, m2], group: A, charges: [stack, cone] }
        - id: pattern-d
          pairs:
            - { members: [h1, mt], group: B, charges: [cone, cone] }
            - { members: [h2, ot], group: A, charges: [stack, defamation] }
            - { members: [r1, m1], group: A, charges: [stack, cone] }
            - { members: [r2, m2], group: B, charges: [defamation, defamation] }

# Shared lethal tower defaults — every tower resolves the charge debuffs
# of its soakers via the three resolvers below.
_towerBase: &towerBase
  type: tower
  telegraph: 10
  radius: 4
  requiredCount: 2
  failureDamage: 999999
  failureDamageType: "true"
  resolveEventIds: [forsaken-stack-resolve, forsaken-cone-resolve, forsaken-defamation-resolve]
  visual:
    fallingObject: sphere
    cylinderThickness: 3.5
    fallingObjectAlpha: 0.7

# Deferred half-arena (180°) ending cone, stored then baited. Forsaken shuffles exactly two
# Future/front (0) and two Past/rear (π) offsets across the four stores each run.
# Boss only turns when the linked bait fires.
_endingBase: &endingBase
  type: aoe
  deferred: true
  anchor: boss
  directionFrom: bossFacing
  telegraph: 5
  damage: 90
  damageType: magical
  shape: { kind: cone, angleDeg: 180, length: 24 }
  telegraphMode: resolve
  showCastBar: false


# Bait that turns the boss to the closest player and fires its linked stored ending.
_allEndingBase: &allEndingBase
  type: bait
  targetMode: closest
  telegraph: 5
  showCastBar: true

# Spread the clones drop on the 4 closest players as each even tower resolves (no cast bar).
# Each spread's t is set so its telegraph ends on its even tower's resolve tick (tower-2/4/6/8 at
# 28/48/68/88), i.e. t = towerResolve - telegraph.
_cloneSpreadBase: &cloneSpreadBase
  type: targeted
  name: Clone Spread
  targetMode: closest
  count: 4
  radius: 5
  damage: 15
  damageType: magical
  showCastBar: false
  showTelegraph: false
  telegraph: 5

events:
  # Lock the boss facing for the whole encounter.
  - type: aoe
    id: boss-facing-lock
    time: 0
    name: Forsaken Boss Facing
    telegraph: 123
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 0.1 }

  # Charge-debuff resolvers, fired by towers via resolveEventIds.
  - type: effect_resolver
    id: forsaken-stack-resolve
    name: Stack Resolve
    effectName: Stack Charge
    action: { kind: stack, radius: 4.5, requiredCount: 3, damage: 80, damageType: magical }
  - type: effect_resolver
    id: forsaken-cone-resolve
    name: Cone Resolve
    effectName: Cone Charge
    action: { kind: cone_nearest, angleDeg: 70, length: 14, damage: 12, damageType: physical }
  - type: effect_resolver
    id: forsaken-defamation-resolve
    name: Defamation Resolve
    effectName: Defamation Charge
    action: { kind: spread, radius: 2.5, damage: 8, damageType: magical }

  # Opener — raidwide plus pair/assignment distribution.
  - type: aoe
    id: forsaken-raidwide
    time: 3
    name: Forsaken
    telegraph: 5
    damage: 25
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 20 }
  # Charge distribution + per-tower re-balance. The opener stamps each player's planned charge
  # (world.initialCharges, from optionals.combinations.pairings). After each tower wave resolves
  # (its soakers' charges consumed by the resolvers above), it re-balances back up to the next
  # wave's target counts, dealt to the just-resolved soakers in roster order.
  - type: reassign
    id: forsaken-charges
    time: 7 #second early , but can change to 8 with better head icons
    name: Forsaken Assignment
    initial: plan
    onResolve:
      tower-odd:  { stack: 0, cone: 4, defamation: 4 }
      tower-even: { stack: 2, cone: 3, defamation: 3 }
    charges:
      - kind: stack
        effect: { name: Stack Charge, kind: debuff, duration: 120, visibility: invisible, behavior: { kind: none } }
        marker: { name: Stack Charge Marker, kind: debuff, duration: 5, visibility: invisible, markerIcon: stack_processed.png, behavior: { kind: none } }
      - kind: cone
        effect: { name: Cone Charge, kind: debuff, duration: 120, visibility: invisible, behavior: { kind: none } }
        marker: { name: Cone Charge Marker, kind: debuff, duration: 5, visibility: invisible, markerIcon: cone_processed.png, behavior: { kind: none } }
      - kind: defamation
        effect: { name: Defamation Charge, kind: debuff, duration: 120, visibility: invisible, behavior: { kind: none } }
        marker: { name: Defamation Charge Marker, kind: debuff, duration: 5, visibility: invisible, markerIcon: defam_processed.png, behavior: { kind: none } }

  # Towers 1-2 (A side).
  - <<: *towerBase
    id: tower-1-left
    time: 8.0
    name: Forsaken Tower 1 Left (A)
    labels: [tower-odd]
    group: A
    pos: *posW
  - <<: *towerBase
    id: tower-1-right
    time: 8.0
    name: Forsaken Tower 1 Right (A)
    labels: [tower-odd]
    group: A
    pos: *posN
  - type: heal
    id: heal-after-tower-1
    time: 20
    name: Tower 1 Recovery

  - <<: *towerBase
    id: tower-2-left
    time: 18.0
    name: Forsaken Tower 2 Left (A)
    labels: [tower-even]
    group: A
    pos: *posNW
  - <<: *towerBase
    id: tower-2-right
    time: 18.0
    name: Forsaken Tower 2 Right (A)
    labels: [tower-even]
    group: A
    pos: *posNE
  - type: heal
    id: heal-after-tower-2
    time: 30
    name: Tower 2 Recovery

  # Ending 1 (seeded Future/Past) — cast 20→26, baited at 33.
  - <<: *endingBase
    id: ending-store-1
    time: 20.0
    name: Ending-Store-Placeholder
    telegraph: 6
    showCastBar: true
  - <<: *allEndingBase
    id: all-ending-1
    time: 33.0
    name: All Ending
    link: ending-store-1
  - <<: *cloneSpreadBase
    id: clone-spread-1
    time: 23.0 # resolves with tower-2 @28
    telegraph: 5

  - <<: *towerBase
    id: tower-3-left
    time: 28.0
    name: Forsaken Tower 3 Left (A)
    labels: [tower-odd]
    group: A
    pos: *posN
  - <<: *towerBase
    id: tower-3-right
    time: 28.0
    name: Forsaken Tower 3 Right (A)
    labels: [tower-odd]
    group: A
    pos: *posE
  - type: heal
    id: heal-after-tower-3
    time: 40
    name: Tower 3 Recovery

  - <<: *towerBase
    id: tower-4-left
    time: 38.0
    name: Forsaken Tower 4 Left (B)
    labels: [tower-even]
    group: B
    pos: *posNE
  - <<: *towerBase
    id: tower-4-right
    time: 38.0
    name: Forsaken Tower 4 Right (B)
    labels: [tower-even]
    group: B
    pos: *posSE
  - type: heal
    id: heal-after-tower-4
    time: 50
    name: Tower 4 Recovery

  # Ending 2 (seeded Future/Past) — cast 40→46, baited at 53.
  - <<: *endingBase
    id: ending-store-2
    time: 40.0
    name: Ending-Store-Placeholder
    telegraph: 6
    showCastBar: true
  - <<: *allEndingBase
    id: all-ending-2
    time: 53.0
    name: All Ending
    link: ending-store-2
  - <<: *cloneSpreadBase
    id: clone-spread-2
    time: 43.0 # resolves with tower-4 @48

  - <<: *towerBase
    id: tower-5-left
    time: 48.0
    name: Forsaken Tower 5 Left (B)
    labels: [tower-odd]
    group: B
    pos: *posE
  - <<: *towerBase
    id: tower-5-right
    time: 48.0
    name: Forsaken Tower 5 Right (B)
    labels: [tower-odd]
    group: B
    pos: *posS
  - type: heal
    id: heal-after-tower-5
    time: 60
    name: Tower 5 Recovery

  - <<: *towerBase
    id: tower-6-left
    time: 58.0
    name: Forsaken Tower 6 Left (B)
    labels: [tower-even]
    group: B
    pos: *posSE
  - <<: *towerBase
    id: tower-6-right
    time: 58.0
    name: Forsaken Tower 6 Right (B)
    labels: [tower-even]
    group: B
    pos: *posSW
  - type: heal
    id: heal-after-tower-6
    time: 70
    name: Tower 6 Recovery

  # Ending 3 (seeded Future/Past) — cast 62→68, baited at 73.
  - <<: *endingBase
    id: ending-store-3
    time: 62.0
    name: Ending-Store-Placeholder
    telegraph: 6
    showCastBar: true
  - <<: *allEndingBase
    id: all-ending-3
    time: 73.0
    name: All Ending
    link: ending-store-3
  - <<: *cloneSpreadBase
    id: clone-spread-3
    time: 63.0 # resolves with tower-6 @68
    telegraph: 5

  - <<: *towerBase
    id: tower-7-left
    time: 68.0
    name: Forsaken Tower 7 Left (B)
    labels: [tower-odd]
    group: B
    pos: *posS
  - <<: *towerBase
    id: tower-7-right
    time: 68.0
    name: Forsaken Tower 7 Right (B)
    labels: [tower-odd]
    group: B
    pos: *posW
  - type: heal
    id: heal-after-tower-7
    time: 80
    name: Tower 7 Recovery

  - <<: *towerBase
    id: tower-8-left
    time: 78.0
    name: Forsaken Tower 8 Left (A)
    labels: [tower-even]
    group: A
    pos: *posSW
  - <<: *towerBase
    id: tower-8-right
    time: 78.0
    name: Forsaken Tower 8 Right (A)
    labels: [tower-even]
    group: A
    pos: *posNW
  - type: heal
    id: heal-after-tower-8
    time: 90
    name: Tower Recovery

  # Ending 4 (seeded Future/Past) — cast 80→86, then the closing raidwide at 93.
  - <<: *endingBase
    id: ending-store-4
    time: 80.0
    name: Ending-Store-Placeholder
    telegraph: 6
    showCastBar: true
  - <<: *allEndingBase
    id: all-ending-4
    time: 93.0
    name: All Ending
    # No tower follows ending 4, so the bait itself is labeled to hold the cluster (away from the
    # rear cleave) through resolve. Earlier baits hand off to their coincident tower instead.
    labels: [bait-4]
    link: ending-store-4
  - <<: *cloneSpreadBase
    id: clone-spread-4
    time: 83.0 # resolves with tower-8 @88

  - type: aoe
    id: forsaken-end-raidwide
    time: 108.0
    name: Forsaken Ends
    telegraph: 3
    damage: 35
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 20 }

waymarks:
  - { mark: A, pos: { x: 0, z: 12 } }
  - { mark: B, pos: { x: 12, z: 0 } }
  - { mark: C, pos: { x: 0, z: -12 } }
  - { mark: D, pos: { x: -12, z: 0 } }
  - { mark: "1", pos: { x: 6, z: 6 } }
  - { mark: "2", pos: { x: -6, z: 6 } }
  - { mark: "3", pos: { x: -6, z: -6 } }
  - { mark: "4", pos: { x: 6, z: -6 } }
