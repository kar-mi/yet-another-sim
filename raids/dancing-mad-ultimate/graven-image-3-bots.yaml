# Bot patterns + solver data for Graven Image 3 — movement, Double Trouble
# spots, plant-arrow placements per combo, and spread/stack lightning spots.

players:
  mt:
    - { t: 0, pos: [0, -4] }
    - { t: 14, pos: [-5, 5] }
    - { t: 25, pos: [0, 8] }
  ot:
    - { t: 0, pos: [0, -4] }
    - { t: 14, pos: [-5, 5] }
    - { t: 25, pos: [-8, 0] }
  h1:
    - { t: 0, pos: [0, -4] }
    - { t: 14, pos: [-5, 5] }
    - { t: 25, pos: [-3, -6.5] }
    - { t: 28, pos: [-3, -15] }
    - { t: 29, pos: [0, -15] }
  h2:
    - { t: 0, pos: [0, -4] }
    - { t: 14, pos: [-5, 5] }
    - { t: 25, pos: [6.5, 3] }
    - { t: 28, pos: [15, 3] }
    - { t: 29, pos: [15, 0] }
  r1:
    - { t: 0, pos: [0, -4] }
    - { t: 14, pos: [5, -5] }
    - { t: 25, pos: [-3, 6.5] }
    - { t: 28, pos: [-3, 15] }
    - { t: 29, pos: [0, 15] }
  r2:
    - { t: 0, pos: [0, -4] }
    - { t: 14, pos: [5, -5] }
    - { t: 25, pos: [-6.5, 3] }
    - { t: 28, pos: [-15, 3] }
    - { t: 29, pos: [-15, 0] }
  m1:
    - { t: 0, pos: [0, -4] }
    - { t: 14, pos: [5, -5] }
    - { t: 25, pos: [0, -8] }
  m2:
    - { t: 0, pos: [0, -4] }
    - { t: 14, pos: [5, -5] }
    - { t: 25, pos: [8, 0] }

solvers:
  # Generic, data-driven rules in priority order: plant arrows, then Mystery Magic 3 fire/lightning,
  # then Double Trouble.
  generic:
    # Teletrouncing plant arrows — each bot goes to the spot for its assigned combo and active plant
    # slot (short = slot 0, long = slot 1).
    - { when: { plant: right right, plantSlot: 0 }, spot: { x: 0, z: 12 } }
    - { when: { plant: right right, plantSlot: 1 }, spot: { x: -6, z: 12 } }
    - { when: { plant: right down, plantSlot: 0 }, spot: { x: 6, z: 12 } }
    - { when: { plant: right down, plantSlot: 1 }, spot: { x: 12, z: 12 } }
    - { when: { plant: down down, plantSlot: 0 }, spot: { x: 12, z: 6 } }
    - { when: { plant: down down, plantSlot: 1 }, spot: { x: 12, z: 0 } }
    - { when: { plant: down left, plantSlot: 0 }, spot: { x: 12, z: -6 } }
    - { when: { plant: down left, plantSlot: 1 }, spot: { x: 12, z: -12 } }
    - { when: { plant: left left, plantSlot: 0 }, spot: { x: 6, z: -12 } }
    - { when: { plant: left left, plantSlot: 1 }, spot: { x: 0, z: -12 } }
    - { when: { plant: left up, plantSlot: 0 }, spot: { x: -6, z: -12 } }
    - { when: { plant: left up, plantSlot: 1 }, spot: { x: -12, z: -12 } }
    - { when: { plant: up up, plantSlot: 0 }, spot: { x: -12, z: -6 } }
    - { when: { plant: up up, plantSlot: 1 }, spot: { x: -12, z: 0 } }
    - { when: { plant: up right, plantSlot: 0 }, spot: { x: -12, z: 6 } }
    - { when: { plant: up right, plantSlot: 1 }, spot: { x: -12, z: 12 } }

    # Mystery Magic 3 Fire — spread/stack "?" (fire-1) crossed with the lightning-1 inverse
    # orientation. Two-mechanic rules (mode + lightning orientation) come first; the bare
    # fire-1.<mode> rule is the no-lightning fallback. Bots solve the actual mode, so questionMark
    # is already resolved in the fire-1.spread / fire-1.stack resolved id.
    # Spread, by lightning orientation.
    - when: { mechanic: [fire-1.spread, lightning-1.shown.a] }
      spots: { mt: { x: 6.83, z: 5.13 }, ot: { x: 6, z: -6 }, h1: { x: -5.08, z: -17.27 }, h2: { x: 17.5, z: 4.24 }, r1: { x: 0, z: 18 }, r2: { x: -18, z: 0 }, m1: { x: 2.07, z: -2.17 }, m2: { x: -6, z: -6 } }
    - when: { mechanic: [fire-1.spread, lightning-1.inverted.a] }
      spots: { mt: { x: 6, z: 6 }, ot: { x: -2.07, z: 2.17 }, h1: { x: 0, z: -18 }, h2: { x: 18, z: 0 }, r1: { x: 5.08, z: 17.27 }, r2: { x: -17.5, z: -4.24 }, m1: { x: -6, z: 6 }, m2: { x: -6.83, z: -5.13 } }
    - when: { mechanic: [fire-1.spread, lightning-1.shown.b] }
      spots: { mt: { x: -6.83, z: 5.13 }, ot: { x: -6, z: -6 }, h1: { x: 5.08, z: -17.27 }, h2: { x: -17.5, z: 4.24 }, r1: { x: 0, z: 18 }, r2: { x: 18, z: 0 }, m1: { x: -2.07, z: -2.17 }, m2: { x: 6, z: -6 } }
    - when: { mechanic: [fire-1.spread, lightning-1.inverted.b] }
      spots: { mt: { x: -6, z: 6 }, ot: { x: 2.07, z: 2.17 }, h1: { x: 0, z: -18 }, h2: { x: -18, z: 0 }, r1: { x: -5.08, z: 17.27 }, r2: { x: 17.5, z: -4.24 }, m1: { x: 6, z: 6 }, m2: { x: 6.83, z: -5.13 } }
    - when: { mechanic: fire-1.spread }
      spots: { mt: { x: 6, z: 6 }, ot: { x: 6, z: -6 }, h1: { x: 0, z: -18 }, h2: { x: 18, z: 0 }, r1: { x: 0, z: 18 }, r2: { x: -18, z: 0 }, m1: { x: -6, z: 6 }, m2: { x: -6, z: -6 } }

    # Stack, by lightning orientation.
    - when: { mechanic: [fire-1.stack, lightning-1.shown.a] }
      spots: { r1: { x: -7.74, z: 7.82 }, r2: { x: -7.74, z: 7.82 }, m1: { x: -7.74, z: 7.82 }, m2: { x: -7.74, z: 7.82 }, mt: { x: 6, z: -6 }, ot: { x: 6, z: -6 }, h1: { x: 6, z: -6 }, h2: { x: 6, z: -6 } }
    - when: { mechanic: [fire-1.stack, lightning-1.inverted.a] }
      spots: { r1: { x: -6, z: 6 }, r2: { x: -6, z: 6 }, m1: { x: -6, z: 6 }, m2: { x: -6, z: 6 }, mt: { x: 7.74, z: -7.82 }, ot: { x: 7.74, z: -7.82 }, h1: { x: 7.74, z: -7.82 }, h2: { x: 7.74, z: -7.82 } }
    - when: { mechanic: [fire-1.stack, lightning-1.shown.b] }
      spots: { r1: { x: 7.74, z: 7.82 }, r2: { x: 7.74, z: 7.82 }, m1: { x: 7.74, z: 7.82 }, m2: { x: 7.74, z: 7.82 }, mt: { x: -6, z: -6 }, ot: { x: -6, z: -6 }, h1: { x: -6, z: -6 }, h2: { x: -6, z: -6 } }
    - when: { mechanic: [fire-1.stack, lightning-1.inverted.b] }
      spots: { r1: { x: 6, z: 6 }, r2: { x: 6, z: 6 }, m1: { x: 6, z: 6 }, m2: { x: 6, z: 6 }, mt: { x: -7.74, z: -7.82 }, ot: { x: -7.74, z: -7.82 }, h1: { x: -7.74, z: -7.82 }, h2: { x: -7.74, z: -7.82 } }
    - when: { mechanic: fire-1.stack }
      spots: { mt: { x: 6, z: -6 }, ot: { x: 6, z: -6 }, h1: { x: 6, z: -6 }, h2: { x: 6, z: -6 }, r1: { x: -6, z: 6 }, r2: { x: -6, z: 6 }, m1: { x: -6, z: 6 }, m2: { x: -6, z: 6 } }

    # Double Trouble — once the debuff has settled (startAt 20), support and dps split to opposite
    # safe offsets so the expiry knockback throws them clear of each other.
    - when: { debuff: Double Trouble, role: tank }
      startAt: 20
      spot: { x: -8, z: 7 }
    - when: { debuff: Double Trouble, role: healer }
      startAt: 20
      spot: { x: -8, z: 7 }
    - when: { debuff: Double Trouble, role: dps }
      startAt: 20
      spot: { x: 7, z: -8 }
