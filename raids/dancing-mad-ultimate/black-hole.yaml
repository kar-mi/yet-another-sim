optionals:
  combinations:
    endings:
      rng: true
      events:
        - [latlong-1-a, latlong-1-b]
        - [latlong-2-a, latlong-2-b]
      variants:
        - { name: Latitude Implosion,  offset: [-1.5707963267948966, 1.5707963267948966] }
        - { name: Longitude Implosion, offset: [0, 3.141592653589793] }
    eventSets:
      slap-happy-1:
        rng: true
        sets:
          - [slap-happy-1-right-hit-1, slap-happy-1-right-hit-2, slap-happy-1-right-hit-3, slap-happy-1-party-stack, visual-chaos-cone-at-party-stack, slap-happy-1-right-hold]
          - [slap-happy-1-left-hit-1, slap-happy-1-left-hit-2, slap-happy-1-left-hit-3, slap-happy-1-role-stack-mt, slap-happy-1-role-stack-h1, slap-happy-1-role-stack-m1, slap-happy-1-role-cone-mt, slap-happy-1-role-cone-h1, slap-happy-1-role-cone-m1, slap-happy-1-left-hold]
      slap-happy-2:
        rng: true
        sets:
          - [slap-happy-2-right-edict-bait, slap-happy-2-right-hit-1, slap-happy-2-right-hit-2, slap-happy-2-right-hit-3, slap-happy-2-party-stack, visual-chaos-cone-at-party-stack-2, slap-happy-2-right-hold]
          - [slap-happy-2-left-edict-bait, slap-happy-2-left-hit-1, slap-happy-2-left-hit-2, slap-happy-2-left-hit-3, slap-happy-2-role-stack-mt, slap-happy-2-role-stack-h1, slap-happy-2-role-stack-m1, slap-happy-2-role-cone-mt, slap-happy-2-role-cone-h1, slap-happy-2-role-cone-m1, slap-happy-2-left-hold]
      slap-happy-3:
        rng: true
        sets:
          - [slap-happy-3-right-hit-1, slap-happy-3-right-hit-2, slap-happy-3-right-hit-3, slap-happy-3-party-stack, visual-chaos-cone-at-party-stack-3, slap-happy-3-right-hold]
          - [slap-happy-3-left-hit-1, slap-happy-3-left-hit-2, slap-happy-3-left-hit-3, slap-happy-3-role-stack-mt, slap-happy-3-role-stack-h1, slap-happy-3-role-stack-m1, slap-happy-3-role-cone-mt, slap-happy-3-role-cone-h1, slap-happy-3-role-cone-m1, slap-happy-3-left-hold]
      # first_in_line has two dps (r1, m1): one does the regular dps hand-off, the other carries
      # Accretion. Which one is picked at random per pull, not hardcoded to m1.
      accretion-duty-first-in-line:
        rng: true
        sets:
          - [accretion-dps-m1, accretion-duty-dps-m1, non-accretion-duty-r1]
          - [accretion-dps-r1, accretion-duty-dps-r1, non-accretion-duty-m1]

