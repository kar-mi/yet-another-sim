  - type: apply_effect
    id: primordial-crust
    time: 17
    name: Primordial Crust
    players: [mt, ot, h1, h2, r1, r2, m1, m2]
    applyEffect:
      ref: primordial_crust
      duration: 200
      showTimer: false

  # Accretion carrier #2: second_in_line's healer (h2) - the group's spare non-hand-off member.
  - type: apply_effect
    id: accretion-healer
    time: 17
    name: Accretion
    players: [h2]
    applyEffect:
      ref: accretion
  - type: apply_effect
    id: accretion-duty-healer
    time: 17
    name: Accretion Duty
    players: [h2]
    applyEffect:
      ref: accretion_duty

  # Accretion carrier #1: first_in_line's spare dps (r1 or m1 - it has two dps, one does the DPS
  # hand-off, the other carries Accretion). Which one is picked by the RNG eventSet below
  # (optionals.combinations.eventSets.accretion-duty-first-in-line), not hardcoded, so the bot
  # solver (which matches by debuff + role, never by name) resolves correctly either way.
  - type: apply_effect
    id: accretion-dps-m1
    time: 17
    name: Accretion
    players: [m1]
    applyEffect:
      ref: accretion
  - type: apply_effect
    id: accretion-duty-dps-m1
    time: 17
    name: Accretion Duty
    players: [m1]
    applyEffect:
      ref: accretion_duty

  - type: apply_effect
    id: accretion-dps-r1
    time: 17
    name: Accretion
    players: [r1]
    applyEffect:
      ref: accretion
  - type: apply_effect
    id: accretion-duty-dps-r1
    time: 17
    name: Accretion Duty
    players: [r1]
    applyEffect:
      ref: accretion_duty

  # Everyone else gets the complementary marker: the 5 who never carry Accretion, plus whichever of
  # r1/m1 the RNG above didn't pick (see accretion-duty-first-in-line).
  - type: apply_effect
    id: non-accretion-duty
    time: 17
    name: NonAccretion Duty
    players: [mt, ot, h1, r2, m2]
    applyEffect:
      ref: non_accretion_duty

  - type: apply_effect
