name: P3 - Black Hole
arena:
  floorPlan: dmu-p1
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 150

bosses:
  - id: chaos
    pos: { x: 0, z: 0 }
    aggro: mt
  - id: exdeath
    pos: { x: 8, z: 0 }
    aggro: ot
  - id: kefka
    pos: { x: 0, z: 18 }
    targetable: false

crystals:
  - kind: single
    element: earth
    pos: { x: 0, z: -18 }
    spawnAt: 9

players:
  - { id: mt, role: tank,   spawn: { x: 0, z: 6 } }
  - { id: ot, role: tank,   spawn: { x: 4, z: 8 } }
  - { id: h1, role: healer, spawn: { x: -8, z: 2 } }
  - { id: h2, role: healer, spawn: { x: 8, z: 2 } }
  - { id: r1, role: dps,    spawn: { x: -8, z: -4 } }
  - { id: r2, role: dps,    spawn: { x: 8, z: -4 } }
  - { id: m1, role: dps,    spawn: { x: -4, z: -8 } }
  - { id: m2, role: dps,    spawn: { x: 4, z: -8 } }

_heroEpic: &heroEpic
  ref: epic_hero
_heroFated: &heroFated
  ref: fated_hero
_blackHole: &blackHole
  name: Black Hole
  kind: debuff
  duration: 3
  behavior:
    kind: mitigation
    multiplier: 0.5
_blackHoleCombos: &blackHoleCombos
  - - { pos: { x: 0, z: 17 }, tether: true }
    - { pos: { x: 17, z: 0 }, tether: true }
    - { pos: { x: 0, z: -17 }, tether: true }
    - { pos: { x: 5, z: 13 }, tether: false }
    - { pos: { x: -7, z: 7 }, tether: false }
    - { pos: { x: 7, z: 7 }, tether: false }
    - { pos: { x: -13, z: 5 }, tether: false }
    - { pos: { x: 13, z: -5 }, tether: false }
    - { pos: { x: -7, z: -7 }, tether: false }
    - { pos: { x: 6, z: -7 }, tether: false }
    - { pos: { x: -6, z: -13 }, tether: false }
  - - { pos: { x: 0, z: 17 }, tether: true }
    - { pos: { x: 17, z: 0 }, tether: true }
    - { pos: { x: 0, z: -17 }, tether: true }
    - { pos: { x: -13, z: 5 }, tether: false }
    - { pos: { x: -9, z: 0 }, tether: false }
    - { pos: { x: 0, z: 9 }, tether: false }
    - { pos: { x: 6, z: 13 }, tether: false }
    - { pos: { x: 9, z: 0 }, tether: false }
    - { pos: { x: 13, z: -6 }, tether: false }
    - { pos: { x: 0, z: -9 }, tether: false }
    - { pos: { x: -5, z: -13 }, tether: false }

_slapHappyCircle: &slapHappyCircle
  type: aoe
  name: Slap Happy
  telegraph: 4
  damage: 20
  damageType: physical
  telegraphMode: resolve
  bossId: kefka
  shape: { kind: circle, center: { x: 0, z: 0 }, radius: 8 }

_roleStack: &roleStack
  type: group
  name: Role Stack
  telegraph: 0.1
  radius: 4
  damage: 120
  damageType: magical
  showCastBar: false
  showMarker: false
  showTelegraph: false

_roleStackMt: &roleStackMt
  <<: *roleStack
  groups: [[mt]]
  requiredCount: 2

_roleStackH1: &roleStackH1
  <<: *roleStack
  groups: [[h1]]
  requiredCount: 2

_roleStackM1: &roleStackM1
  <<: *roleStack
  groups: [[m1]]
  requiredCount: 4

_roleCone: &roleCone
  type: aoe
  name: Chaos Cone
  telegraph: 0.1
  damage: 0
  damageType: magical
  showCastBar: false
  telegraphMode: resolve
  bossId: chaos
  anchor: boss
  shape: { kind: cone, angleDeg: 60, length: 30 }

_roleConeMt: &roleConeMt
  <<: *roleCone
  aimAtPlayer: mt

_roleConeH1: &roleConeH1
  <<: *roleCone
  aimAtPlayer: h1

_roleConeM1: &roleConeM1
  <<: *roleCone
  aimAtPlayer: m1

_partyStack: &partyStack
  type: group
  name: Party Stack
  groups: [[h1]]
  telegraph: 0.1
  radius: 4
  requiredCount: 8
  damage: 120
  damageType: magical
  showCastBar: false
  showMarker: false
  showTelegraph: false

_partyCone: &partyCone
  type: aoe
  name: Chaos Cone
  telegraph: 0.1
  damage: 0
  damageType: magical
  showCastBar: false
  telegraphMode: resolve
  bossId: chaos
  anchor: boss
  aimAtPlayer: h1
  shape: { kind: cone, angleDeg: 70, length: 30 }

_blackHoleLaserBeam: &blackHoleLaserBeam
  width: 4
  length: 40
  damage: 10
  damageType: "true"
  applyEffect:
    ref: unbecoming

_blackHoleLaser: &blackHoleLaser
  type: tether_source
  name: Black Hole Laser
  tetherKind: debuff
  buffName: Unbecoming
  applyTetherEffect: false
  showSource: false
  beam: *blackHoleLaserBeam

optionals:
  combinations:
    eventSets:
      slap-happy-1:
        rng: true
        sets:
          - [slap-happy-1-right-hit-1, slap-happy-1-right-hit-2, slap-happy-1-right-hit-3, slap-happy-1-party-stack, visual-chaos-cone-at-party-stack]
          - [slap-happy-1-left-hit-1, slap-happy-1-left-hit-2, slap-happy-1-left-hit-3, slap-happy-1-role-stack-mt, slap-happy-1-role-stack-h1, slap-happy-1-role-stack-m1, slap-happy-1-role-cone-mt, slap-happy-1-role-cone-h1, slap-happy-1-role-cone-m1]

events:
  - type: aoe
    id: boss-facing-lock-chaos
    time: 0
    name: Black Hole Boss Facing
    telegraph: 3
    damage: 0
    damageType: "true"
    bossId: chaos
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 0.1 }

  - type: aoe
    id: boss-facing-lock-exdeath
    time: 0
    name: Black Hole Boss Facing
    telegraph: 3
    damage: 0
    damageType: "true"
    bossId: exdeath
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 0.1 }

  - type: aoe
    id: decisive-battle
    time: 0
    name: Decisive Battle
    telegraph: 3
    damage: 0
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 20 }

  - type: apply_effect
    id: epic-hero
    time: 3
    name: Epic Hero
    players: [mt, h1, m1, m2]
    applyEffect: *heroEpic
  - type: apply_effect
    id: fated-hero
    time: 3
    name: Fated Hero
    players: [ot, h2, r1, r2]
    applyEffect: *heroFated

  - type: targeted
    id: thunder-iii-tb-3
    time: 0
    name: Thunder III
    targetMode: aggro
    role: tank
    radius: 4
    telegraph: 4
    damage: 55
    damageType: magical
    showCastBar: true
    bossId: exdeath

  - type: aoe
    id: earthquake-cast
    time: 5
    name: Earthquake
    telegraph: 4
    damage: 0
    damageType: magical
    showCastBar: true
    showTelegraph: false
    bossId: kefka
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 20 }

  - type: set_hp
    id: earthquake-hp-1
    time: 9
    name: Earthquake
    amount: 1
  - type: apply_effect
    id: primordial-crust
    time: 9
    name: Primordial Crust
    players: [mt, ot, h1, h2, r1, r2, m1, m2]
    applyEffect:
      ref: primordial_crust
      duration: 180

  - type: apply_effect
    id: accretion-healer
    time: 9
    name: Accretion
    players: [h1]
    applyEffect:
      ref: accretion

  - type: apply_effect
    id: accretion-dps
    time: 9
    name: Accretion
    players: [m1]
    applyEffect:
      ref: accretion
  - type: apply_effect
    id: first-in-line
    time: 9
    name: First in Line
    players: [r1, m1, mt]
    applyEffect:
      ref: first_in_line
  - type: apply_effect
    id: second-in-line
    time: 9
    name: Second in Line
    players: [r2, ot, h2]
    applyEffect:
      ref: second_in_line
  - type: apply_effect
    id: third-in-line
    time: 9
    name: Third in Line
    players: [h1, m2]
    applyEffect:
      ref: third_in_line

  - type: heal
    id: recovery-after-earthquake-1
    time: 15
    name: Earthquake Recovery
  - type: heal
    id: recovery-after-earthquake-2
    time: 18
    name: Earthquake Recovery

  - <<: *slapHappyCircle
    id: slap-happy-1-right-hit-1
    time: 20
    showCastBar: true
    bossRelativeCenter: { lateral: 8, forward: -8 }

  - <<: *slapHappyCircle
    id: slap-happy-1-right-hit-2
    time: 21
    showCastBar: false
    bossRelativeCenter: { lateral: 8, forward: 0 }

  - <<: *slapHappyCircle
    id: slap-happy-1-right-hit-3
    time: 22
    showCastBar: false
    bossRelativeCenter: { lateral: 8, forward: 8 }

  - <<: *slapHappyCircle
    id: slap-happy-1-left-hit-1
    time: 20
    showCastBar: true
    bossRelativeCenter: { lateral: -8, forward: -8 }

  - <<: *slapHappyCircle
    id: slap-happy-1-left-hit-2
    time: 21
    showCastBar: false
    bossRelativeCenter: { lateral: -8, forward: 0 }

  - <<: *slapHappyCircle
    id: slap-happy-1-left-hit-3
    time: 22
    showCastBar: false
    bossRelativeCenter: { lateral: -8, forward: 8 }

  - <<: *partyStack
    id: slap-happy-1-party-stack
    time: 28

  - <<: *partyCone
    id: visual-chaos-cone-at-party-stack
    time: 28

  - <<: *roleStackMt
    id: slap-happy-1-role-stack-mt
    time: 28

  - <<: *roleStackH1
    id: slap-happy-1-role-stack-h1
    time: 28

  - <<: *roleStackM1
    id: slap-happy-1-role-stack-m1
    time: 28

  - <<: *roleConeMt
    id: slap-happy-1-role-cone-mt
    time: 28

  - <<: *roleConeH1
    id: slap-happy-1-role-cone-h1
    time: 28

  - <<: *roleConeM1
    id: slap-happy-1-role-cone-m1
    time: 28

  - type: hazard
    id: black-hole-1
    time: 29
    name: Black Hole
    blackHole:
      combos: *blackHoleCombos
    radius: 1.68
    duration: 14
    applyEffect: *blackHole

  - <<: *blackHoleLaser
    id: black-hole-1-laser-1
    time: 29
    fromBlackHoleOrb: { hazardId: black-hole-1, tetherIndex: 0 }
    finalizeAfter: 7

  - <<: *blackHoleLaser
    id: black-hole-1-laser-2
    time: 36
    fromBlackHoleOrb: { hazardId: black-hole-1, tetherIndex: 1 }
    finalizeAfter: 7

  - <<: *blackHoleLaser
    id: black-hole-1-laser-3
    time: 36
    fromBlackHoleOrb: { hazardId: black-hole-1, tetherIndex: 2 }
    finalizeAfter: 7

waymarks:
  - { mark: A, pos: { x: 0, z: 12 } }
  - { mark: B, pos: { x: 12, z: 0 } }
  - { mark: C, pos: { x: 0, z: -12 } }
  - { mark: D, pos: { x: -12, z: 0 } }
  - { mark: "1", pos: { x: 6, z: 6 } }
  - { mark: "2", pos: { x: 6, z: -6 } }
  - { mark: "3", pos: { x: -6, z: -6 } }
  - { mark: "4", pos: { x: -6, z: 6 } }
