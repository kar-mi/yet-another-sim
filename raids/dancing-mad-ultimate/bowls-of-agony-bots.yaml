# Bot patterns for Bowls of Agony — survival, not perfect strategy.
# Bots spread at time:24 to dodge Entropy/Dynamic Fluid pops and Thunder III get-out,
# then use diagonal safe zones for both Implosions, stack for Vacuum Wave + group stack.

players:
  mt:
    - { time: 0,  pos: { x: 0, z: 6 } }
  ot:
    - { time: 0,  pos: { x: 5, z: 0 } }
  h1:
    - { time: 0,  pos: { x: -6, z: 8 } }
  h2:
    - { time: 0,  pos: { x: 6, z: 8 } }
  r1:
    - { time: 0,  pos: { x: -6, z: -8 } }
  r2:
    - { time: 0,  pos: { x: 6, z: -8 } }
  m1:
    - { time: 0,  pos: { x: -4, z: -6 } }
  m2:
    - { time: 0,  pos: { x: 4, z: -6 } }

solvers:
  generic:

    #ot moves exdeath to middle after decisive battle
    - when: { static: true }
      startAt: 6
      endAt: 9
      spots:
        ot: { x: -4.5, z: 0 }


    # After crystals spawn, OT holds in the Wind frame between Chaos and Exdeath.
    - when: { static: true }
      startAt: 24
      endAt: 36
      frame: [{ crystal: wind }]
      spots:
        ot: { r: 0, z: 4.5 }

    # Once Thunder III snapshots Exdeath, OT moves farther along the same Wind-frame line.
    - when: { mechanic: thunder-iii-get-out }
      frame: [{ crystal: wind }]
      spots:
        ot: { r: 0, z: 14 }

    # short debuff static spots
    - when: { static: true }
      startAt: 24
      endAt: 43
      frame: [{ crystal: wind }]
      spots:
        mt: { r: 0, z: 18 }
        h1: { r: 6, z: 16 }
        m1: { r: -6, z: 16 }
        m2: { r: -6, z: 16 }
        h2: { r: 6, z: 16 }

    #ot and mt bait tb #need to fix timing
    - when: { static: true } # 
      startAt: 36
      endAt: 47
      frame: [{ crystal: wind }]
      spots:
        ot: { r: 0, z: 4.5 }
        mt: { r: 0, z: 4.5 }


        #range go to crystal based on which debuff is the short one
    - when: { partyDebuff: Entropy Short }
      startAt: 24
      endAt: 43
      frame: [{ crystal: fire }]
      spots:
        r1: { r: -5, z: 14 }
        r2: { r: 5, z: 14 }
    - when: { partyDebuff: Dynamic Fluid Short }
      startAt: 24
      endAt: 43
      frame: [{ crystal: water }]
      spots:
        r1: { r: -5, z: 14 }
        r2: { r: 5, z: 14 }


    # range start to move during Thunder III tankbusters.
    - when: { static: true }
      startAt: 43
      endAt: 53
      frame: [{ crystal: wind }]
      spots:
        r1: { r: 0, z: -14 }
        r2: { r: 0, z: -14 }

    # Post-tankbuster: preposition for Chaos's outward-facing implosions and drag Exdeath to Wind.
    - when: { static: true }
      startAt: 53
      endAt: 60
      frame: [{ crystal: wind }]
      spots:
        mt: { r: 0, z: 18 }
        ot: { r: 0, z: 18 }
        h1: { r: 6, z: 16 }
        m1: { r: -6, z: 16 }
        m2: { r: -6, z: 16 }
        h2: { r: 6, z: 16 }

    - when: { partyDebuff: Entropy Long }
      startAt: 53
      endAt: 60
      frame: [{ crystal: fire }]
      spots:
        r1: { r: 4, z: 10 } #maybe adjust this, so that its in line with the south intercard of the boss if boss was at wind
        r2: { r: -4, z: 14 }

    - when: { partyDebuff: Dynamic Fluid Long }
      startAt: 53
      endAt: 60
      frame: [{ crystal: water }]
      spots:
        r1: { r: 4, z: 10 } # maybe adjust this, so that its in line with the south intercard of the boss if boss was at wind
        r2: { r: -4, z: 14 }

    # Latitude/Longitude order is seeded RNG, authored as two staggered cast slots:
    # first implosion resolves at t:66, then the other resolves at t:68. Only one implosion is live
    # at a time, so the mechanic-gated rules below dodge whichever cast is currently active.
    # The cones reach length 44 (whole arena), so distance can't save you -- everyone sits ON an
    # intercardinal of Chaos and steps ~2 degrees across whichever cone edge is firing (89->91).
    # Solved in the Chaos-facing frame (north = locked facing): angle 0 = front (toward MT), 90 =
    # right, measured clockwise. Chaos sits ~z:11.9 along its own facing, so a spot at boss-relative
    # angle A and radius R is { r: R*sin(A), z: 11.9 + R*cos(A) }.
    #   mt/ot/h1/h2 -> NE intercard (45): latitude 44, longitude 46.
    #   m1/m2       -> NW intercard (315): latitude 316, longitude 314.
    #   r1/r2       -> nearest back intercard, far out: SW(225) 224/226 or SE(135) 136/134 based on crystal
    # Latitude (E/W) -> sit off the E/W cone (44/316/224/136); Longitude (N/S) -> the
    # other side (46/314/226/134). The 2-degree straddle is a tiny move that fits the 2s gap in either order.

    #  - Latitude, angle 224°, R 16→25.1 → { r: -17.4, z: -6.2 } (dist ≈18.5)
  #- Longitude, angle 226°, R 16→24.7 → { r: -17.7, z: -5.2 } (dist ≈18.5)
    - when: { mechanic: [latitude-implosion-left, latitude-implosion-right], partyDebuff: Dynamic Fluid Long }
      frame: [{ boss: { id: chaos, from: facing } }]
      origin: { boss: chaos }
      spots:
        mt: { r: 2.91, z: 8.08 }
        ot: { r: 2.91, z: 8.08 }
        h1: { r: 2.91, z: 8.08 }
        h2: { r: 2.91, z: 8.08 }
        m1: { r: -4.98, z: 8.06 }
        m2: { r: -4.98, z: 8.06 }

    - when: { mechanic: [longitude-implosion-front, longitude-implosion-back], partyDebuff: Dynamic Fluid Long }
      frame: [{ boss: { id: chaos, from: facing } }]
      origin: { boss: chaos }
      spots:
        mt: { r: 6.06, z: 5.78}
        ot: { r: 6.06, z: 5.78}
        h1: { r: 6.06, z: 5.78}
        h2: { r: 6.06, z: 5.78}
        m1: { r: -7.11, z: 5.81}
        m2: { r: -7.11, z: 5.81}


    - when: { mechanic: [latitude-implosion-left, latitude-implosion-right], partyDebuff: Dynamic Fluid Long }
      frame: [{ boss: { id: chaos, from: facing } }, { crystal : water }]
      origin: { boss: chaos }
      mirrorLateral: true
      spots:
        r1:  { r: 15.60, z: -16.20 }
        r2:  { r: 7.00, z: -7.96 }

    - when: { mechanic: [longitude-implosion-front, longitude-implosion-back], partyDebuff: Dynamic Fluid Long }
      frame: [{ boss: { id: chaos, from: facing } }, { crystal : water }]
      origin: { boss: chaos }
      mirrorLateral: true
      spots:
        r1: { r: 17.10, z: -10.66 }
        r2: { r: 8.31, z: -7.96 }

    - when: { mechanic: [latitude-implosion-left, latitude-implosion-right], partyDebuff: Entropy Long }
      frame: [{ boss: { id: chaos, from: facing } }]
      origin: { boss: chaos }
      spots:
        mt: { r: 2.91, z: 8.08 }
        ot: { r: 2.91, z: 8.08 }
        h1: { r: 2.91, z: 8.08 }
        h2: { r: 2.91, z: 8.08 }
        m1: { r: -4.98, z: 8.06 }
        m2: { r: -4.98, z: 8.06 }

    - when: { mechanic: [longitude-implosion-front, longitude-implosion-back] , partyDebuff: Entropy Long}
      frame: [{ boss: { id: chaos, from: facing } }]
      origin: { boss: chaos }
      spots:
        mt: { r: 6.06, z: 5.78}
        ot: { r: 6.06, z: 5.78}
        h1: { r: 6.06, z: 5.78}
        h2: { r: 6.06, z: 5.78}
        m1: { r: -7.11, z: 5.81}
        m2: { r: -7.11, z: 5.81}


    - when: { mechanic: [latitude-implosion-left, latitude-implosion-right] , partyDebuff: Entropy Long}
      frame: [{ boss: { id: chaos, from: facing } }, { crystal : fire }]
      origin: { boss: chaos }
      mirrorLateral: true
      spots:
        r1:  { r: 15.60, z: -16.20 }
        r2:  { r: 7.00, z: -7.96 }

    - when: { mechanic: [longitude-implosion-front, longitude-implosion-back] , partyDebuff: Entropy Long}
      frame: [{ boss: { id: chaos, from: facing } }, { crystal : fire }]
      origin: { boss: chaos }
      mirrorLateral: true
      spots:
        r1: { r: 17.10, z: -10.66 }
        r2: { r: 8.31, z: -7.96 }



    # Pre-park Exdeath on the inner wind line so its t:81 Vacuum Wave snapshot is stable per seed.
    - when: { static: true }
      startAt: 68
      endAt: 81
      frame: [{ crystal: wind }]
      spots:
        ot: { r: 0, z: 4 }

    # Vacuum Wave + Umbra Smash (t:81–88): one bot baits furthest; the rest stack for knockback.
    - when: { mechanic: [vacuum-wave, umbra-smash] }
      frame: [{ crystal: wind }]
      spots:
        mt: { r: 0, z: 8 }
        ot: { r: 0, z: 8 }
        h1: { r: 0, z: 8 }
        h2: { r: 0, z: 8 }
        r1: { r: 0, z: 8 }
        r2: { r: 0, z: -10 }
        m1: { r: 0, z: 8 }
        m2: { r: 0, z: 8 }

    # Vacuum Wave (t:81–88): stack west of exdeath; KB pushes group further west, stays in arena.
    # Headwind/Tailwind facing is not auto set, this needs to be fixed
    - when: { mechanic: vacuum-wave }
      frame: [{ crystal: wind }]
      spot: { r: 0, z: 8 }

    # Bowls stack (t:90–93): converge so requiredCount:4 is met; 80 dmg split 8 ways.
    - when: { mechanic: bowls-stack }
      frame: [{ crystal: wind }]
      spot: { r: 0, z: 6 }

    # Limit Cut (gated on the bowls-limit-cut mechanic, live t:91–100): each bot fans out to its
    # numbered inter-inter-cardinal at radius 18. Spots are authored relative to relative-north
    # (clockwise polar: #1 is one inter-inter step clockwise of N); the solver rotates them by the
    # matched limit cut's basis (relative-north = opposite Kefka's first divebomb, handedness = opposite
    # Kefka's dash direction). With the bowls config (Kefka N/CCW), relative-north resolves to S and bots
    # place clockwise, so #1 lands SSW … #8 SSE. One rule covers all 8 bots; it only yields a spot for
    # bots currently carrying a limit-cut number.
    - when: { mechanic: bowls-limit-cut }
      limitCutSpread:
        spots:
          - { dist: 18, angleDeg: 22.5 }   # #1
          - { dist: 18, angleDeg: 67.5 }   # #2
          - { dist: 18, angleDeg: 112.5 }  # #3
          - { dist: 18, angleDeg: 157.5 }  # #4
          - { dist: 18, angleDeg: 202.5 }  # #5
          - { dist: 18, angleDeg: 247.5 }  # #6
          - { dist: 18, angleDeg: 292.5 }  # #7
          - { dist: 18, angleDeg: 337.5 }  # #8

  holds:
    - { mechanic: bowls-stack, duration: 1 }
