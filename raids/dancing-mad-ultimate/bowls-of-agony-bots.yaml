# Bot patterns for Bowls of Agony — survival, not perfect strategy.
# Bots spread at t:24 to dodge Entropy/Dynamic Fluid pops and Thunder III get-out,
# then use diagonal safe zones for both Implosions, stack for Vacuum Wave + group stack.

players:
  mt:
    - { t: 0,  pos: [-12, 0] }
    - { t: 24, pos: [-2, 0] }    # anchors chaos facing east; holds through both implosions
  ot:
    - { t: 0,  pos: [10, 0] }
    - { t: 24, pos: [-4, -13] }  # far from exdeath for Thunder III get-out
  h1:
    - { t: 0,  pos: [-6, 8] }
    - { t: 24, pos: [-13, 8] }   # Entropy carrier 1 (NW spread)
  h2:
    - { t: 0,  pos: [6, 8] }
    - { t: 24, pos: [2, 14] }    # Dynamic Fluid carrier 1 (N spread)
  r1:
    - { t: 0,  pos: [-6, -8] }
    - { t: 24, pos: [-13, -8] }  # Dynamic Fluid carrier 2 (SW spread, far from h2)
  r2:
    - { t: 0,  pos: [6, -8] }
    - { t: 24, pos: [4, -10] }   # SE spread
  m1:
    - { t: 0,  pos: [-4, -6] }
    - { t: 24, pos: [4, -14] }   # Entropy carrier 2 (S spread, far from h1)
  m2:
    - { t: 0,  pos: [4, -6] }
    - { t: 24, pos: [-8, 14] }   # N spread (>8 from h2 to avoid Dynamic Fluid donut)

solvers:
  generic:
    # Latitude Implosion (t:60–66): chaos faces east (toward mt). Left/right cones hit N/S.
    # All bots go to diagonal zones (NE/SE/SW/NW) — safe from both Latitude and Longitude cones.
    # mt holds east to pin chaos's facing; it takes the Longitude hit (~60 dmg, tank survives).
    - when: { mechanic: latitude-implosion-left }
      spots:
        mt: [-2, 0]
        ot: [0, 8]
        h1: [2, 10]
        h2: [-15, 7]
        r1: [-15, -7]
        r2: [-1, -8]
        m1: [-13, 5]
        m2: [-3, -7]

    # Longitude Implosion (t:66–68): same diagonal spots — already safe, no travel needed.
    - when: { mechanic: longitude-implosion-front }
      spots:
        mt: [-2, 0]
        ot: [0, 8]
        h1: [2, 10]
        h2: [-15, 7]
        r1: [-15, -7]
        r2: [-1, -8]
        m1: [-13, 5]
        m2: [-3, -7]

    # Vacuum Wave (t:81–88): stack west of exdeath; KB pushes group further west, stays in arena.
    # Headwind/Tailwind facing is auto-set by botIntent.ts — no authoring needed.
    - when: { mechanic: vacuum-wave }
      spot: [-6, 0]

    # Bowls stack (t:90–93): converge so requiredCount:4 is met; 80 dmg split 8 ways.
    - when: { mechanic: bowls-stack }
      spot: [-6, 0]

  holds:
    - { mechanic: bowls-stack, duration: 1 }
