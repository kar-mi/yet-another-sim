# Bot patterns for Bowls of Agony — survival, not perfect strategy.
# Bots spread at time:24 to dodge Entropy/Dynamic Fluid pops and Thunder III get-out,
# then use diagonal safe zones for both Implosions, stack for Vacuum Wave + group stack.

players:
  mt:
    - { time: 0,  pos: { x: 0, z: 6 } }
  ot:
    - { time: 0,  pos: { x: 5, z: 0 } }
  h1:
    - { time: 0,  pos: { x: -6, z: 8 } }
  h2:
    - { time: 0,  pos: { x: 6, z: 8 } }
  r1:
    - { time: 0,  pos: { x: -6, z: -8 } }
  r2:
    - { time: 0,  pos: { x: 6, z: -8 } }
  m1:
    - { time: 0,  pos: { x: -4, z: -6 } }
  m2:
    - { time: 0,  pos: { x: 4, z: -6 } }

solvers:
  generic:

    #ot moves exdeath to middle after decisive battle
    - when: { static: true }
      startAt: 6
      endAt: 9
      spots:
        ot: { x: -4.5, z: 0 }


    # After crystals spawn, OT holds in the Wind frame between Chaos and Exdeath.
    - when: { static: true }
      startAt: 24
      endAt: 36
      frame: { crystal: wind }
      spots:
        ot: { r: 0, z: 4.5 }

    # Once Thunder III snapshots Exdeath, OT moves farther along the same Wind-frame line.
    - when: { mechanic: thunder-iii-get-out }
      frame: { crystal: wind }
      spots:
        ot: { r: 0, z: 14 }

    # short debuff static spots
    - when: { static: true }
      startAt: 24
      endAt: 43
      frame: { crystal: wind }
      spots:
        mt: { r: 0, z: 18 }
        h1: { r: 6, z: 16 }
        m1: { r: -6, z: 16 }
        m2: { r: -6, z: 16 }
        h2: { r: 6, z: 16 }

    #ot and mt bait tb #need to fix timing
    - when: { static: true } # 
      startAt: 36
      endAt: 47
      frame: { crystal: wind }
      spots:
        ot: { r: 0, z: 4.5 }
        mt: { r: 0, z: 4.5 }


        #range go to crystal based on which debuff is the short one
    - when: { static: true } # TODO: gate on entropy-short debuff when that mechanic exists
      startAt: 24
      endAt: 43
      frame: { crystal: fire }
      spots:
        r1: { r: -5, z: 14 }
        r2: { r: 5, z: 14 }


    # range start to move during Thunder III tankbusters.
    - when: { static: true }
      startAt: 43
      endAt: 53
      frame: { crystal: wind }
      spots:
        r1: { r: 0, z: -14 }
        r2: { r: 0, z: -14 }

    # Post-tankbuster: preposition for Chaos's outward-facing implosions and drag Exdeath to Wind.
    - when: { static: true }
      startAt: 53
      endAt: 60
      frame: { crystal: wind }
      spots:
        mt: { r: 0, z: 18 }
        ot: { r: 0, z: 18 }
        h1: { r: 6, z: 16 }
        m1: { r: -6, z: 16 }
        m2: { r: -6, z: 16 }
        h2: { r: 6, z: 16 }

    - when: { static: true } # TODO: gate on fluid-long debuff when that mechanic exists, 
      startAt: 53
      endAt: 60
      frame: { crystal: water }
      spots:
        r1: { r: -4, z: 14 } #adjust this, so that its in line with the south intercard of the boss if boss was at wind
        r2: { r: 4, z: 10 }

    # Latitude/Longitude is one six-second cast (starts t:60) resolving as two staggered hits:
    # Latitude (left/right = E/W cones) at t:66, then Longitude (front/back = N/S cones) at t:68.
    # The cones reach length 44 (whole arena), so distance can't save you -- everyone sits ON an
    # intercardinal of Chaos and steps ~2 degrees across whichever cone edge is firing (89->91).
    # Solved in the Chaos-facing frame (north = locked facing): angle 0 = front (toward MT), 90 =
    # right, measured clockwise. Chaos sits ~z:11.9 along its own facing, so a spot at boss-relative
    # angle A and radius R is { r: R*sin(A), z: 11.9 + R*cos(A) }.
    #   mt/ot/h1/h2 -> NE intercard (45): latitude 44, longitude 46.
    #   m1/m2       -> NW intercard (315): latitude 316, longitude 314.
    #   r1/r2       -> nearest back intercard, far out: SW(225) 224/226 or SE(135) 136/134 based on crystal
    # Latitude (E/W) fires first -> sit off the E/W cone (44/316/224/136); Longitude (N/S) -> the
    # other side (46/314/226/134). The 2-degree straddle is a tiny move that fits the 2s gap.

    #  - Latitude, angle 224°, R 16→25.1 → { r: -17.4, z: -6.2 } (dist ≈18.5)
  #- Longitude, angle 226°, R 16→24.7 → { r: -17.7, z: -5.2 } (dist ≈18.5)
    - when: { mechanic: [latitude-implosion-left, latitude-implosion-right] }
      frame: { boss: { id: chaos, from: facing } }
      spots:
        mt: { r: 4.2, z: 16.2 }
        ot: { r: 4.9, z: 16.9 }
        h1: { r: 5.6, z: 17.7 }
        h2: { r: 6.3, z: 18.4 }
        m1: { r: -4.9, z: 16.9 }
        m2: { r: -5.6, z: 17.7 }
        r1: { r: -17.4, z: -6.2 } # same SW intercard line as r2, pushed out near the edge
        r2: { r: -11.1, z: 0.4 }

    - when: { mechanic: [longitude-implosion-front, longitude-implosion-back] }
      frame: { boss: { id: chaos, from: facing } }
      spots:
        mt: { r: 4.3, z: 16.1 }
        ot: { r: 5.0, z: 16.8 }
        h1: { r: 5.8, z: 17.5 }
        h2: { r: 6.5, z: 18.3 }
        m1: { r: -5.0, z: 16.8 }
        m2: { r: -5.8, z: 17.5 }
        r1: { r: -17.7, z: -5.2 } # same SW intercard line as r2, pushed out near the edge
        r2: { r: -11.5, z: 0.8 }

    # Vacuum Wave + Umbra Smash (t:81–88): one bot baits furthest; the rest stack for knockback.
    - when: { mechanic: [vacuum-wave, umbra-smash] }
      frame: { crystal: wind }
      spots:
        mt: { r: 0, z: 6 }
        ot: { r: 0, z: 6 }
        h1: { r: 0, z: 6 }
        h2: { r: 0, z: 6 }
        r1: { r: 0, z: 6 }
        r2: { r: 0, z: -10 }
        m1: { r: 0, z: 6 }
        m2: { r: 0, z: 6 }

    # Vacuum Wave (t:81–88): stack west of exdeath; KB pushes group further west, stays in arena.
    # Headwind/Tailwind facing is not auto set, this needs to be fixed
    - when: { mechanic: vacuum-wave }
      frame: { crystal: wind }
      spot: { r: 0, z: 6 }

    # Bowls stack (t:90–93): converge so requiredCount:4 is met; 80 dmg split 8 ways.
    - when: { mechanic: bowls-stack }
      frame: { crystal: wind }
      spot: { r: 0, z: 6 }

  holds:
    - { mechanic: bowls-stack, duration: 1 }
