# Bot patterns + generic-solver rules for Forsaken — opening spots plus rotated-frame
# tower/bait rules. Spots are authored in a frame whose north is the bisector of the
# wave's two towers; the engine rotates them per wave (45° each). See docs/authoring-raids.md.

players:
  mt:
    - { t: 0, pos: [6.14, -4.3] }
  ot:
    - { t: 0, pos: [1.3, -7.39] }
  h1:
    - { t: 0, pos: [7.39, -1.3] }
  h2:
    - { t: 0, pos: [4.3, -6.14] }
  r1:
    - { t: 0, pos: [-1.3, 7.39] }
  r2:
    - { t: 0, pos: [-7.39, 1.3] }
  m1:
    - { t: 0, pos: [-4.3, 6.14] }
  m2:
    - { t: 0, pos: [-6.14, 4.3] }

_positions:
  _even:
    _ir:  &innerRightTower  [-4, 2.6]
    _il:  &innerLeftTower   [4, 2.6]
    _or:  &outerRightTower [-5.85, 9.05]
    _ol:  &outerLeftTower  [5.85, 9.05]
    _nsm: &nonSoakMelee  [-3.5, -5.0]
    _nst: &nonSoakTank [3.5, -5.0]
    _nsr: &nonSoakRange [-10.5, 1.25]
    _nsh: &nonSoakHeal [10.5, 1.25]

solvers:
  generic:
    # --- Endings: everyone clusters at max melee on one side so the closest baits, and the 180°
    #     stored cone fires into the empty hemisphere. The frame north is the coincident tower
    #     wave's bisector (continued 45° rotation lands bait 4 on wave 1). Past (rear cone) baits
    #     toward the towers (+north) so the rear cleave fires away; Future (front cone) baits on
    #     the far side (-north) so the front cleave fires away; both then soak the tower (+north).
    - { when: { mechanic: bait-1 }, frame: [tower-3-left, tower-3-right], spot: [0, -6] } # Future
    - { when: { mechanic: bait-2 }, frame: [tower-5-left, tower-5-right], spot: [0, 6] }  # Past
    - { when: { mechanic: bait-3 }, frame: [tower-7-left, tower-7-right], spot: [0, -6] } # Future
    - { when: { mechanic: bait-4 }, frame: [tower-1-left, tower-1-right], spot: [0, 6] }  # Past

    # --- Odd tower waves (one stack pair + cone + defam soak the two towers; the off-group
    #     supports the soak). Frame north = the wave's tower bisector.
    # Soaking group (X). The two stacks always split across the towers: the healer holds the
    # support stack (right), the other carrier the dps stack (left). Same-charge cone/defam pairs
    # share a tower (still two soakers each).
    - { when: { mechanic: tower-odd, soaks: true, debuff: Stack Charge, role: healer }, frame: matched, spot: [4.565, 4.9265] } #should be supports
    - { when: { mechanic: tower-odd, soaks: true, debuff: Stack Charge },               frame: matched, spot: [-4.6295, 3.5295] }
    - { when: { mechanic: tower-odd, soaks: true, debuff: Cone Charge },                frame: matched, spot: [6.8943, 6.8943] }
    - { when: { mechanic: tower-odd, soaks: true, debuff: Defamation Charge },          frame: matched, spot: [-7.975, 7.975] }
    # Off group (Y): tank flanks, healer baits the cone, dps split ranged/melee.
    - { when: { mechanic: tower-odd, soaks: false, role: tank },   frame: matched, spot: [2.065, 2.6265] }
    - { when: { mechanic: tower-odd, soaks: false, role: healer }, frame: matched, spot: [9.414, 8.344] }
    - { when: { mechanic: tower-odd, soaks: false, role: dps },    frame: matched, spots: { r1: [-1.8738, 2.7224], r2: [-1.8738, 2.7224], m1: [-2.7224, 1.8738], m2: [-2.7224, 1.8738] } }

    # --- Even tower waves (two cones + two defams, one cone + one defam per tower). Mixed pairs
    #     split support-left / dps-right; same-charge pairs split by role. Frame north = bisector.
    # Soaking group (X) — mixed pairs (cone + defam partner):
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Defamation Charge, role: dps }, frame: matched, spot: *innerLeftTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Defamation Charge },            frame: matched, spot: *innerRightTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Cone Charge, role: dps }, frame: matched, spot: *outerLeftTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Cone Charge },            frame: matched, spot: *outerRightTower }
    # Soaking group (X) — same-charge pairs (role split: tank/ranged left, healer/melee right):
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Cone Charge, role: healer }, frame: matched, spot: *innerLeftTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Cone Charge, role: tank },   frame: matched, spot: *innerRightTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Cone Charge, role: dps },    frame: matched, spots: { r1: *innerRightTower, r2: *innerRightTower, m1: *innerLeftTower, m2: *innerLeftTower } }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Defamation Charge, role: healer }, frame: matched, spot: *outerLeftTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Defamation Charge, role: tank },   frame: matched, spot: *outerRightTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Defamation Charge, role: dps },    frame: matched, spots: { r1: *outerRightTower, r2: *outerRightTower, m1: *outerLeftTower, m2: *outerLeftTower } }
    # Off group (Y): healer holds the right tower corner, ranged the left; tank/melee hold opposite the towers.
    - { when: { mechanic: tower-even, soaks: false, role: healer }, frame: matched, spot: *nonSoakHeal }
    - { when: { mechanic: tower-even, soaks: false, role: tank },   frame: matched, spot: *nonSoakTank }
    - { when: { mechanic: tower-even, soaks: false, role: dps },    frame: matched, spots: { m1: *nonSoakMelee, m2: *nonSoakMelee, r1: *nonSoakRange, r2: *nonSoakRange } }
