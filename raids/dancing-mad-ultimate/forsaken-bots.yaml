# Bot patterns + generic-solver rules for Forsaken — opening spots plus rotated-frame
# tower/bait rules. Spots are authored in a frame whose north is the bisector of the
# wave's two towers; the engine rotates them per wave (45° each). See docs/authoring-raids.md.

players:
  mt:
    - { t: 0, pos: [6.14, -4.3] }
  ot:
    - { t: 0, pos: [1.3, -7.39] }
  h1:
    - { t: 0, pos: [7.39, -1.3] }
  h2:
    - { t: 0, pos: [4.3, -6.14] }
  r1:
    - { t: 0, pos: [-1.3, 7.39] }
  r2:
    - { t: 0, pos: [-7.39, 1.3] }
  m1:
    - { t: 0, pos: [-4.3, 6.14] }
  m2:
    - { t: 0, pos: [-6.14, 4.3] }

_positions:
  _odd:
    _ls: &oddLeftStack [4.56, 4.92]
    _rs: &oddRightStack [-4.62, 3.52]
    _cone: &oddCone [6.89, 6.89]
    _defam: &odddefam [-7.97, 7.97]
    _nst: &oddNonSoakTank [2.06, 2.62]
    _nsh: &oddNonSoakHeal [9.41, 8.34]
    _nsd: &oddNonSoakDPS [-1.87, 2.72]
  _even:
    _ir:  &evenInnerRightTower  [-4.5, 2.6]
    _il:  &evenInnerLeftTower   [4.5, 2.6]
    _or:  &evenOuterRightTower [-6.15, 9.15]
    _ol:  &evenOuterLeftTower  [6.15, 9.15]
    _nsm: &evenNonSoakMelee  [-3.2, -6.0]
    _nst: &evenNonSoakTank [3.2, -6.0]
    _nsr: &evenNonSoakRange [-10.3, .4]
    _nsh: &evenNonSoakHeal [10.3, .4]

solvers:
  generic:
    # --- Endings: everyone clusters at max melee on one side so the closest baits, and the 180°
    #     stored cone fires into the empty hemisphere. The frame north is the coincident tower
    #     wave's bisector (continued 45° rotation lands bait 4 on wave 1). Past (rear cone) baits
    #     toward the towers (+north) so the rear cleave fires away; Future (front cone) baits on
    #     the far side (-north) so the front cleave fires away; both then soak the tower (+north).
    # Timing: the cluster forms in the 4s before each All Ending bait picks its target at cast start
    # (all-ending-1/2/3/4 at t=28/48/68/88), gated by startAt/endAt. The whole-encounter
    # boss-facing-lock is just the always-live mechanic that keeps the rule eligible.
    - { when: { mechanic: boss-facing-lock }, startAt: 24, endAt: 28, frame: [tower-3-left, tower-3-right], spot: [0, -6] } # Future, all-ending-1 @31
    - { when: { mechanic: boss-facing-lock }, startAt: 44, endAt: 49, frame: [tower-5-left, tower-5-right], spot: [0, 6] }  # Past,   all-ending-2 @51
    - { when: { mechanic: boss-facing-lock }, startAt: 64, endAt: 68, frame: [tower-7-left, tower-7-right], spot: [0, -6] } # Future, all-ending-3 @71
    # Ending 4 has no following tower to hand off to, so hold the cluster through the rear cone's
    # resolve (all-ending-4 fires at 96) instead of stopping at the bait's targeting tick.
    - { when: { mechanic: boss-facing-lock }, startAt: 84, endAt: 93, frame: [tower-1-left, tower-1-right], spot: [0, 6] }  # Past,   all-ending-4 @91, cone @96

    # --- Odd tower waves (one stack pair + cone + defam soak the two towers; the off-group
    #     supports the soak). Frame north = the wave's tower bisector.
    # Soaking group (X). The two stacks always split across the towers: the healer holds the
    # support stack (right), the other carrier the dps stack (left). Same-charge cone/defam pairs
    # share a tower (still two soakers each).
    - { when: { mechanic: tower-odd, soaks: true, debuff: Stack Charge, role: healer }, frame: matched, spot: *oddLeftStack } #should be supports
    - { when: { mechanic: tower-odd, soaks: true, debuff: Stack Charge },               frame: matched, spot: *oddRightStack }
    - { when: { mechanic: tower-odd, soaks: true, debuff: Cone Charge },                frame: matched, spot: *oddCone }
    - { when: { mechanic: tower-odd, soaks: true, debuff: Defamation Charge },          frame: matched, spot: *odddefam }
    # Off group (Y): tank flanks, healer baits the cone, dps split ranged/melee.
    - { when: { mechanic: tower-odd, soaks: false, role: tank },   frame: matched, spot: *oddNonSoakTank}
    - { when: { mechanic: tower-odd, soaks: false, role: healer }, frame: matched, spot: *oddNonSoakHeal }
    - { when: { mechanic: tower-odd, soaks: false, role: dps },    frame: matched, spots: { r1: *oddNonSoakDPS, r2: *oddNonSoakDPS, m1: *oddNonSoakDPS, m2: *oddNonSoakDPS } }

    # --- Even tower waves (two cones + two defams, one cone + one defam per tower). Mixed pairs
    #     split support-left / dps-right; same-charge pairs split by role. Frame north = bisector.
    # Soaking group (X) — mixed pairs (cone + defam partner):
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Defamation Charge, role: dps }, frame: matched, spot: *evenInnerLeftTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Defamation Charge },            frame: matched, spot: *evenInnerRightTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Cone Charge, role: dps }, frame: matched, spot: *evenOuterLeftTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Cone Charge },            frame: matched, spot: *evenOuterRightTower }
    # Soaking group (X) — same-charge pairs (role split: tank/ranged left, healer/melee right):
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Cone Charge, role: healer }, frame: matched, spot: *evenInnerLeftTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Cone Charge, role: tank },   frame: matched, spot: *evenInnerRightTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Cone Charge, partnerDebuff: Cone Charge, role: dps },    frame: matched, spots: { r1: *evenInnerRightTower, r2: *evenInnerRightTower, m1: *evenInnerLeftTower, m2: *evenInnerLeftTower } }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Defamation Charge, role: healer }, frame: matched, spot: *evenOuterLeftTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Defamation Charge, role: tank },   frame: matched, spot: *evenOuterRightTower }
    - { when: { mechanic: tower-even, soaks: true, debuff: Defamation Charge, partnerDebuff: Defamation Charge, role: dps },    frame: matched, spots: { r1: *evenOuterRightTower, r2: *evenOuterRightTower, m1: *evenOuterLeftTower, m2: *evenOuterLeftTower } }
    # Off group (Y): healer holds the right tower corner, ranged the left; tank/melee hold opposite the towers.
    - { when: { mechanic: tower-even, soaks: false, role: healer }, frame: matched, spot: *evenNonSoakHeal }
    - { when: { mechanic: tower-even, soaks: false, role: tank },   frame: matched, spot: *evenNonSoakTank }
    - { when: { mechanic: tower-even, soaks: false, role: dps },    frame: matched, spots: { m1: *evenNonSoakMelee, m2: *evenNonSoakMelee, r1: *evenNonSoakRange, r2: *evenNonSoakRange } }

  # Hold position for 1s after each tower resolves before re-solving for the next mechanic.
  holds:
    - { mechanic: tower-odd, duration: 1 }
    - { mechanic: tower-even, duration: 1 }
