# Dancing Mad P4.  Thunder/Blizzard/Mana Release are cast-bar placeholders until
# their geometry pass; all other mechanics are authored from p4_timeline.md.
name: P4 - Kefka Says
arena:
  floorPlan: dmu-p1
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 165

bosses:
  - { id: kefka, pos: { x: 0, z: 0 }, aggro: mt }
  - { id: chaos, pos: { x: -12, z: 12 }, targetable: false }
  - { id: exdeath, pos: { x: 12, z: 12 }, targetable: false }

players:
  - { id: mt, role: tank, spawn: { x: 0, z: 8 } }
  - { id: ot, role: tank, spawn: { x: 0, z: -8 } }
  - { id: h1, role: healer, spawn: { x: -8, z: 0 } }
  - { id: h2, role: healer, spawn: { x: 8, z: 0 } }
  - { id: r1, role: dps, spawn: { x: -5.66, z: 5.66 } }
  - { id: r2, role: dps, spawn: { x: 5.66, z: 5.66 } }
  - { id: m1, role: dps, spawn: { x: -5.66, z: -5.66 } }
  - { id: m2, role: dps, spawn: { x: 5.66, z: -5.66 } }

_noBehavior: &noBehavior { kind: none }
_water: &water { ref: compressed_water, behavior: *noBehavior }
_fakeWater: &fakeWater { ref: fake_compressed_water, behavior: *noBehavior }
_lightning: &lightning { ref: forked_lightning, behavior: *noBehavior }
_fakeLightning: &fakeLightning { ref: fake_forked_lightning, behavior: *noBehavior }
_shriek: &shriek { ref: cursed_shriek, behavior: *noBehavior }
_fakeShriek: &fakeShriek { ref: fake_cursed_shriek, behavior: *noBehavior }
_entropy: &entropy { ref: entropy, behavior: *noBehavior }
_fakeEntropy: &fakeEntropy { ref: fake_entropy, behavior: *noBehavior }
_fluid: &fluid { ref: dynamic_fluid, behavior: *noBehavior }
_fakeFluid: &fakeFluid { ref: fake_dynamic_fluid, behavior: *noBehavior }
_field: &field { ref: allagan_field, behavior: *noBehavior }
_beyond: &beyond { ref: beyond_death, behavior: *noBehavior }

optionals:
  rngLabels:
    event-set-grand-cross-duration:
      label: Grand Cross durations
      options: [GC1 short, GC1 long]
    event-set-chaos-order:
      label: Chaos cast order
      options: [Tsunami first, Inferno first]
    event-set-antilight-side:
      label: Antilight sides
      options: [White left, White right]
  combinations:
    eventSets:
      grand-cross-duration:
        rng: true
        sets:
          - [gc1-water-short, gc1-lightning-short, gc1-shriek, gc1-bombs-short, gc1-bombs-long, gc2-water-long, gc2-lightning-long, gc2-shriek, gc2-bombs-short, gc2-bombs-long]
          - [gc1-water-long, gc1-lightning-long, gc1-shriek-long, gc1-bombs-long-first, gc1-bombs-short-second, gc2-water-short, gc2-lightning-short, gc2-shriek-short, gc2-bombs-long-first, gc2-bombs-short-second]
      chaos-order:
        rng: true
        sets:
          - [tsunami-first, dynamic-fluid-first, inferno-second, entropy-second]
          - [inferno-first, entropy-first, tsunami-second, dynamic-fluid-second]
      antilight-side:
        rng: true
        sets:
          - [white-antilight-left, black-antilight-right]
          - [black-antilight-left, white-antilight-right]

