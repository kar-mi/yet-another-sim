# Graven Image 3 (P1) — plant arrows (Teletrouncing), sleep/confuse statues,
# Double Trouble pairs, then Mystery Magic 3 (lightning rects + fire flip).

name: P1 - Graven Image 3
arena:
  floorPlan: dmu-p1
  zones:
    - kind: circle
      center: { x: 0, z: 0 }
      radius: 20
duration: 47
boss:
  pos: { x: 0, z: 0 }
  radius: 3
  ring:
    scale: 2
    color: "#e62120"
botPatterns: graven-image-3-bots

players:
  - id: mt
    role: tank
    spawn: { x: 0, z: 8 }
  - id: ot
    role: tank
    spawn: { x: 0, z: -8 }
  - id: h1
    role: healer
    spawn: { x: -8, z: 0 }
  - id: h2
    role: healer
    spawn: { x: 8, z: 0 }
  - id: r1
    role: dps
    spawn: { x: -5.66, z: 5.66 }
  - id: r2
    role: dps
    spawn: { x: 5.66, z: 5.66 }
  - id: m1
    role: dps
    spawn: { x: -5.66, z: -5.66 }
  - id: m2
    role: dps
    spawn: { x: 5.66, z: -5.66 }

optionals:
  rngLabels:
    plant-swap:
      label: Arrow groups
      options: [Support same arrow, DPS same arrow]
  combinations:
    plant:
      rng: true
      debuffOrder: [1, 0]
      g1:
        members: [mt, ot, h1, h2]
        combos:
          - [up, up]
          - [down, down]
          - [left, left]
          - [right, right]
      g2:
        members: [r1, r2, m1, m2]
        combos:
          - [up, right]
          - [right, down]
          - [down, left]
          - [left, up]

events:
  # Lock the boss facing for the whole encounter.
  - type: aoe
    id: keep-boss-still
    time: 0
    name: keep_boss_still
    telegraph: 67
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 0.1 }

  # Teletrouncing — hands out short/long plant-arrow debuffs.
  - id: teletrouncing
    time: 3
    name: Teletrouncing
    telegraph: 5
    damage: 0
    damageType: magical
    showCastBar: true
    showTelegraph: false
    applyEffects:
      order: shuffleBalanced
      effects:
        - ref: plant_short
        - ref: plant_long
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 20 }

  - id: graven-image
    time: 17
    name: Graven Image
    telegraph: 3
    damage: 0
    damageType: "true"
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: { x: 0, z: 0 }, radius: 0.1 }

  # Statues — rng decides which role group each statue links to.
  - type: line_link
    id: sleep-statue
    time: 22
    name: Left Statue (Sleep)
    pos: { x: -8, z: 24 }
    linkDuration: 6
    resolveAfter: 8
    rng: true
    target: { roleGroups: [[dps], [tank, healer]], count: 4, mode: closest }
    hiddenDebuff: sleep_tether
    applyEffect:
      ref: sleep
    visual: { kind: statue, width: 3, height: 6, depth: 1 }
  - type: line_link
    id: confuse-statue
    time: 22
    name: Right Statue (Confuse)
    pos: { x: 8, z: 24 }
    linkDuration: 6
    resolveAfter: 8
    link: sleep-statue
    target: { roleGroups: [[dps], [tank, healer]], count: 4, mode: closest }
    hiddenDebuff: confuse_tether
    applyEffect:
      ref: confusion
    visual: { kind: statue, width: 3, height: 6, depth: 1 }

  # Double Trouble — one random member per group carries the debuff.
  - type: effect_select
    id: double-trouble-dps
    time: 0
    name: Double Trouble (DPS)
    groups: [[r1, r2, m1, m2]]
    applyEffect:
      ref: double_trouble
  - type: effect_select
    id: double-trouble-support
    time: 0
    name: Double Trouble (Support)
    groups: [[mt, ot, h1, h2]]
    applyEffect:
      ref: double_trouble

  # Sleepers burst if still asleep when this fires.
  - type: effect_burst
    id: sleeper-burst
    time: 30
    name: Sleeper Burst
    telegraph: 0.5
    effectName: Sleep
    radius: 4
    damage: 40
    damageType: magical
    showCastBar: false

  - type: heal
    id: raidwide-heal
    time: 35
    name: Raidwide Heal

  # Mystery Magic 3 — rng lightning rects (A/B variants) + fire flip.
  - type: inverse
    id: lightning-1
    time: 37
    name: Mystery Magic 3 (Lightning)
    telegraph: 5
    damage: 60
    damageType: magical
    showCastBar: true
    rng: true
    variantRng: true
    ringColor: "#a855f7"
    ringHeight: 3.2
    telegraphAlpha: 0.1
    shownShapes:
      - { kind: rect, origin: { x: -17.929725, z: -10.174735 }, direction: { x: 0.724049, z: 0.689749 }, width: 10, length: 40 }
      - { kind: rect, origin: { x: -4.134745, z: -24.655715 }, direction: { x: 0.724049, z: 0.689749 }, width: 10, length: 40 }
    hiddenShapes:
      - { kind: rect, origin: { x: -24.827215, z: -2.934245 }, direction: { x: 0.724049, z: 0.689749 }, width: 10, length: 40 }
      - { kind: rect, origin: { x: -11.032235, z: -17.415225 }, direction: { x: 0.724049, z: 0.689749 }, width: 10, length: 40 }
    shownShapesB:
      - { kind: rect, origin: { x: 17.929725, z: -10.174735 }, direction: { x: -0.724049, z: 0.689749 }, width: 10, length: 40 }
      - { kind: rect, origin: { x: 4.134745, z: -24.655715 }, direction: { x: -0.724049, z: 0.689749 }, width: 10, length: 40 }
    hiddenShapesB:
      - { kind: rect, origin: { x: 24.827215, z: -2.934245 }, direction: { x: -0.724049, z: 0.689749 }, width: 10, length: 40 }
      - { kind: rect, origin: { x: 11.032235, z: -17.415225 }, direction: { x: -0.724049, z: 0.689749 }, width: 10, length: 40 }
  - type: spread_stack
    id: fire-1
    time: 37
    name: Mystery Magic 3 (Fire)
    telegraph: 5
    shown: random
    rng: true
    damageType: magical
    spread: { radius: 4, damage: 80 }
    stack:
      groups: [[r1, r2, m1, m2], [h1, h2, mt, ot]]
      radius: 6
      requiredCount: 4
      damage: 200
    ringColor: "#f97316"
    ringHeight: 7
    showCastBar: true

waymarks:
  - { mark: A, pos: { x: 0, z: 12 } }
  - { mark: B, pos: { x: 12, z: 0 } }
  - { mark: C, pos: { x: 0, z: -12 } }
  - { mark: D, pos: { x: -12, z: 0 } }
  - { mark: "1", pos: { x: -6, z: 6 } }
  - { mark: "2", pos: { x: 6, z: 6 } }
  - { mark: "3", pos: { x: 6, z: -6 } }
  - { mark: "4", pos: { x: -6, z: -6 } }
