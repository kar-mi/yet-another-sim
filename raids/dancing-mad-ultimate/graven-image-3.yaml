# Graven Image 3 (P1) — plant arrows (Teletrouncing), sleep/confuse statues,
# Double Trouble pairs, then Mystery Magic 3 (lightning rects + fire flip).

name: Graven Image 3 (P1)
arena:
  floorPlan: dmu-p1
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 55
boss:
  pos: [0, 0]
  radius: 3
  ring:
    scale: 2
    color: "#e62120"
botPatterns: graven-image-3-bots

players:
  - id: mt
    role: tank
    spawn: [0, 8]
  - id: ot
    role: tank
    spawn: [0, -8]
  - id: h1
    role: healer
    spawn: [-8, 0]
  - id: h2
    role: healer
    spawn: [8, 0]
  - id: r1
    role: dps
    spawn: [-5.66, 5.66]
  - id: r2
    role: dps
    spawn: [5.66, 5.66]
  - id: m1
    role: dps
    spawn: [-5.66, -5.66]
  - id: m2
    role: dps
    spawn: [5.66, -5.66]

optionals:
  combinations:
    plant:
      rng: true
      debuffOrder: [1, 0]
      g1:
        members: [mt, ot, h1, h2]
        combos:
          - [up, up]
          - [down, down]
          - [left, left]
          - [right, right]
      g2:
        members: [r1, r2, m1, m2]
        combos:
          - [up, right]
          - [right, down]
          - [down, left]
          - [left, up]

events:
  # Lock the boss facing for the whole encounter.
  - type: aoe
    id: keep-boss-still
    t: 0
    name: keep_boss_still
    telegraph: 67
    damage: 0
    damageType: "true"
    lockFacing: true
    showCastBar: false
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 0.1 }

  # Teletrouncing — hands out short/long plant-arrow debuffs.
  - id: teletrouncing
    t: 3
    name: Teletrouncing
    telegraph: 5
    damage: 0
    damageType: magical
    showCastBar: true
    showTelegraph: false
    applyEffects:
      order: shuffleBalanced
      effects:
        - name: Plant (short)
          kind: debuff
          duration: 7
          behavior: { kind: plant, direction: option, distance: 6.5, radius: 1.7, armDelay: 3, duration: 20, tpDelay: 1.25 }
        - name: Plant (long)
          kind: debuff
          duration: 10
          behavior: { kind: plant, direction: option, distance: 6.5, radius: 1.7, armDelay: 3, duration: 20, tpDelay: 1.25 }
    shape: { kind: circle, center: [0, 0], radius: 20 }

  - id: graven-image
    t: 17
    name: Graven Image
    telegraph: 3
    damage: 0
    damageType: "true"
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 0.1 }

  # Statues — rng decides which role group each statue links to.
  - type: line_link
    id: sleep-statue
    t: 22
    name: Left Statue (Sleep)
    pos: [-8, 24]
    linkDuration: 6
    resolveAfter: 8
    rng: true
    target: { roleGroups: [[dps], [tank, healer]], count: 4, mode: closest }
    hiddenDebuffName: Sleep Tether
    applyEffect:
      name: Sleep
      kind: debuff
      duration: 6
      behavior: { kind: sleep }
    visual: { kind: statue, width: 3, height: 6, depth: 1 }
  - type: line_link
    id: confuse-statue
    t: 22
    name: Right Statue (Confuse)
    pos: [8, 24]
    linkDuration: 6
    resolveAfter: 8
    link: sleep-statue
    target: { roleGroups: [[dps], [tank, healer]], count: 4, mode: closest }
    hiddenDebuffName: Confuse Tether
    applyEffect:
      name: Confusion
      kind: debuff
      duration: 6
      behavior: { kind: confusion, damage: 50, damageType: "true", radius: 1.5 }
    visual: { kind: statue, width: 3, height: 6, depth: 1 }

  # Double Trouble — one random member per group carries the debuff.
  - type: effect_select
    id: double-trouble-dps
    t: 0
    name: Double Trouble (DPS)
    groups: [[r1, r2, m1, m2]]
    applyEffect:
      name: Double Trouble
      kind: debuff
      duration: 24
      icon: double-trouble.png
      behavior: { kind: burstSpread, radius: 5, damage: 10, damageType: magical, knockbackDistance: 14 }
  - type: effect_select
    id: double-trouble-support
    t: 0
    name: Double Trouble (Support)
    groups: [[mt, ot, h1, h2]]
    applyEffect:
      name: Double Trouble
      kind: debuff
      duration: 24
      icon: double-trouble.png
      behavior: { kind: burstSpread, radius: 5, damage: 10, damageType: magical, knockbackDistance: 14 }

  # Sleepers burst if still asleep when this fires.
  - type: effect_burst
    id: sleeper-burst
    t: 30
    name: Sleeper Burst
    telegraph: 0.5
    effectName: Sleep
    radius: 4
    damage: 40
    damageType: magical
    showCastBar: false

  - type: heal
    id: raidwide-heal
    t: 35
    name: Raidwide Heal

  # Mystery Magic 3 — rng lightning rects (A/B variants) + fire flip.
  - type: inverse
    id: lightning-1
    t: 43
    name: Mystery Magic 3 (Lightning)
    telegraph: 5
    damage: 60
    damageType: magical
    showCastBar: true
    rng: true
    variantRng: true
    ringColor: "#a855f7"
    ringHeight: 3.2
    telegraphAlpha: 0.1
    shownShapes:
      - { kind: rect, origin: [-17.929725, -10.174735], direction: [0.724049, 0.689749], width: 10, length: 40 }
      - { kind: rect, origin: [-4.134745, -24.655715], direction: [0.724049, 0.689749], width: 10, length: 40 }
    hiddenShapes:
      - { kind: rect, origin: [-24.827215, -2.934245], direction: [0.724049, 0.689749], width: 10, length: 40 }
      - { kind: rect, origin: [-11.032235, -17.415225], direction: [0.724049, 0.689749], width: 10, length: 40 }
    shownShapesB:
      - { kind: rect, origin: [17.929725, -10.174735], direction: [-0.724049, 0.689749], width: 10, length: 40 }
      - { kind: rect, origin: [4.134745, -24.655715], direction: [-0.724049, 0.689749], width: 10, length: 40 }
    hiddenShapesB:
      - { kind: rect, origin: [24.827215, -2.934245], direction: [-0.724049, 0.689749], width: 10, length: 40 }
      - { kind: rect, origin: [11.032235, -17.415225], direction: [-0.724049, 0.689749], width: 10, length: 40 }
  - type: spread_stack
    id: fire-1
    t: 43
    name: Mystery Magic 3 (Fire)
    telegraph: 5
    shown: random
    rng: true
    damageType: magical
    spread: { radius: 4, damage: 80 }
    stack:
      groups: [[r1, r2, m1, m2], [h1, h2, mt, ot]]
      radius: 6
      requiredCount: 4
      damage: 200
    ringColor: "#f97316"
    ringHeight: 7
    showCastBar: true

waymarks:
  - { mark: A, pos: [0, 12] }
  - { mark: B, pos: [12, 0] }
  - { mark: C, pos: [0, -12] }
  - { mark: D, pos: [-12, 0] }
  - { mark: "1", pos: [-6, 6] }
  - { mark: "2", pos: [6, 6] }
  - { mark: "3", pos: [6, -6] }
  - { mark: "4", pos: [-6, -6] }
