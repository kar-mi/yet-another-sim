players: {}

_fallback: &fallback
  mt: { x: 0, z: 0 }
  ot: { x: 0, z: 0 }
  h1: { x: 0, z: 0 }
  h2: { x: 0, z: 0 }
  r1: { x: 0, z: 0 }
  r2: { x: 0, z: 0 }
  m1: { x: 0, z: 0 }
  m2: { x: 0, z: 0 }

_partySafeEast: &partySafeEast
  mt: { r: 7, z: 0 }
  ot: { r: 7, z: 0 }
  h1: { r: 7, z: 0 }
  h2: { r: 7, z: 0 }
  r1: { r: 7, z: 0 }
  r2: { r: 7, z: 0 }
  m1: { r: 7, z: 0 }
  m2: { r: 7, z: 0 }

_roleSafeWest: &roleSafeWest
  mt: { r: -4.5, z: 4 }
  ot: { r: -4.5, z: 4 }
  h1: { r: -7, z: 0 }
  h2: { r: -7, z: 0 }
  r1: { r: -4.5, z: -4 }
  r2: { r: -4.5, z: -4 }
  m1: { r: -4.5, z: -4 }
  m2: { r: -4.5, z: -4 }

_pixelBehindChaos: &pixelBehindChaos { r: 0, z: -0.1 }

_clockwiseSoak: &clockwiseSoak { r: 9.44, z: 3.44 }
_preclockwiseSoak: &preclockwiseSoak { r: 6.44, z: 2.44 }
_atOrb: &atOrb { r: 0, z: 4 }
_stackMiddle: &stackMiddle { x: 0, z: 0 }

_thunderBait: &thunderBait
  mt: { x: 7, z: 0 }
  ot: { x: 7, z: 0 }
  h1: { x: 0, z: 0 }
  h2: { x: 0, z: 0 }
  r1: { x: 0, z: 0 }
  r2: { x: 0, z: 0 }
  m1: { x: 0, z: 0 }
  m2: { x: 0, z: 0 }

_thunderRelativeBait: &thunderRelativeBait
    mt: { dist: 0, angleDeg: 240 }
    ot: { dist: 0, angleDeg: 240 } 

solvers:
  generic:
    # Everyone regroups at arena centre for ~2s right after each Black Hole spawns (even soakers -
    # they resume their orb pre-positioning immediately after via the rules below).
    - { when: { static: true }, startAt: 37.1, endAt: 39, spot: *stackMiddle }
    - { when: { static: true }, startAt: 68.1, endAt: 70, spot: *stackMiddle }
    - { when: { static: true }, startAt: 102.1, endAt: 104, spot: *stackMiddle }
    - { when: { static: true }, startAt: 135.1, endAt: 137, spot: *stackMiddle }

    # Damning Edict doesn't bait: the party just stacks tight behind Chaos through the tell and
    # the cast; the hit rules below then move safe for Slap Happy once those go live.
    - { when: { mechanic: slap-happy-2-right-edict-bait }, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *pixelBehindChaos }
    - { when: { mechanic: slap-happy-2-left-edict-bait }, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *pixelBehindChaos }

    # ...and stays there until the cast actually resolves - listed ahead of the Slap Happy hit rules
    # below so it keeps winning for the whole cast even while a hit window is also live. (Damning
    # Edict 2 no longer uses this spot - see the combined Edict/Look Upon Me dodge further down,
    # since pixelBehindChaos sits inside Look Upon Me 1's beam once its direction is fixed.)
    - { when: { mechanic: damning-edict-1 }, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *pixelBehindChaos }

    # Slap Happy right-side cleave rolls party stack: all middle relative in the safe quadrant.
    - { when: { mechanic: slap-happy-1-right-hit-1 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    - { when: { mechanic: slap-happy-1-right-hit-2 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    - { when: { mechanic: slap-happy-1-right-hit-3 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    - { when: { mechanic: slap-happy-2-right-hit-1 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    - { when: { mechanic: slap-happy-2-right-hit-2 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    - { when: { mechanic: slap-happy-2-right-hit-3 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    - { when: { mechanic: slap-happy-3-right-hit-1 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    - { when: { mechanic: slap-happy-3-right-hit-2 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    - { when: { mechanic: slap-happy-3-right-hit-3 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }

    # Slap Happy left-side cleave rolls role stacks: tanks north, healers mid, DPS south.
    - { when: { mechanic: slap-happy-1-left-hit-1 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    - { when: { mechanic: slap-happy-1-left-hit-2 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    - { when: { mechanic: slap-happy-1-left-hit-3 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    - { when: { mechanic: slap-happy-2-left-hit-1 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    - { when: { mechanic: slap-happy-2-left-hit-2 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    - { when: { mechanic: slap-happy-2-left-hit-3 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    - { when: { mechanic: slap-happy-3-left-hit-1 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    - { when: { mechanic: slap-happy-3-left-hit-2 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    - { when: { mechanic: slap-happy-3-left-hit-3 }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }

    # Tether soakers first move onto the orb itself (guaranteeing they're the nearest player when
    # the tether spawns), then transition to the clockwise bait spot 45 degrees off the orb's own
    # radial line. For hand-off soakers, that transit from the orb to clockwiseSoak is co-linear
    # with "orb -> current holder" (every soaker for the same orb shares the same clockwiseSoak
    # rest spot), so walking it is a genuine line interception, not a proximity trick.
    # Real-log-derived: raids/dancing-mad-ultimate/black-hole.yaml orbs sit at cardinal +/-17;
    # r=z=13.44 keeps the old radius-19 soak distance, just rotated 45 degrees.
    #
    # Assignments are driven by the First/Second/Third in Line debuffs + role (never a hardcoded
    # player id), so they stay correct however those debuffs end up grouped. Where a line group has
    # two members of the same role (first_in_line has 2 dps), the Accretion Duty marker (an inert,
    # invisible tag applied alongside real Accretion - see black-hole.yaml) disambiguates: the
    # marked-variant rule is listed first so it claims that specific player, and the plain-role rule
    # then only matches the *other* same-role member.

    # wave 2 (Black Hole 1's 2nd/3rd tethers, fire t=51): Accretion carrier #1 (first_in_line's
    # spare dps) solos the 3rd tether. Listed before wave 1's rule below (priority ordering, not
    # chronological) so it claims the marked player first. atOrb starts at 34, not 41 - laser-1
    # spawns earlier (t=37) than laser-2/3 (t=44), so wave 1's "First in Line dps" rule is already
    # live from 34; without this earlier claim, the Accretion-tagged dps would also match that rule
    # (both dps have "First in Line") and shadow the real hand-off player at laser-1's orb.
    - { when: { debuff: ["First in Line", "Accretion Duty"], role: dps }, startAt: 34, endAt: 47, frame: [black-hole-1-laser-3], spot: *atOrb }
    - { when: { debuff: ["First in Line", "Accretion Duty"], role: dps }, startAt: 41, endAt: 49, frame: [black-hole-1-laser-3], spot: *preclockwiseSoak }
    - { when: { debuff: ["First in Line", "Accretion Duty"], role: dps }, startAt: 44, endAt: 51, frame: [black-hole-1-laser-3], spot: *clockwiseSoak }

    # wave 1 (Black Hole 1's 1st tether, fires t=44): DPS hand-off chain starts here - first_in_line's
    # other dps (no Accretion Duty marker).
    - { when: { debuff: "First in Line", role: dps }, startAt: 34, endAt: 40, frame: [black-hole-1-laser-1], spot: *atOrb }
    - { when: { debuff: "First in Line", role: dps }, startAt: 34, endAt: 42, frame: [black-hole-1-laser-1], spot: *preclockwiseSoak }
    - { when: { debuff: "First in Line", role: dps }, startAt: 37, endAt: 44, frame: [black-hole-1-laser-1], spot: *clockwiseSoak }

    # wave 2 (Black Hole 1's 2nd tether, fires t=51): Support hand-off chain starts here -
    # first_in_line's tank.
    - { when: { debuff: "First in Line", role: tank }, startAt: 41, endAt: 47, frame: [black-hole-1-laser-2], spot: *atOrb }
    - { when: { debuff: "First in Line", role: tank }, startAt: 41, endAt: 49, frame: [black-hole-1-laser-2], spot: *preclockwiseSoak }
    - { when: { debuff: "First in Line", role: tank }, startAt: 44, endAt: 51, frame: [black-hole-1-laser-2], spot: *clockwiseSoak }

    # Drag exdeath (ot holds its aggro) out to the empty spot on the far side of Black Hole 1's 2nd
    # tether ahead of tb-4: exdeath is unlocked (no active mechanic of its own) through this whole
    # window, so it walks to wherever ot stands. 10 out from centre, 180 degrees opposite the tether's
    # bearing (clear of every beam) plus 4 more degrees clockwise.
    # ot holds this same *fixed, absolute* point clear through tb-4's resolve rather than switching to
    # a boss-relative spot: since exdeath is chasing ot, a boss-relative target for ot would keep
    # re-deriving itself from exdeath's still-catching-up position every tick, and the two would never
    # converge (a runaway feedback loop that drags them both off the arena edge).
    - { when: { static: true }, startAt: 40, endAt: 45, frame: [black-hole-1-laser-2], spots: { ot: { dist: 12, angleDeg: 240 } } }
    # mt doesn't drive exdeath's position, so it can safely target "7 out from exdeath's current spot,
    # same bearing it was dragged to" for tb-4 itself - it lands correctly wherever exdeath settled.

    # waves 3-5 (Black Hole 2's 3rd tether, fires t=75/80/85): Accretion carrier #1 continues
    # soloing - no hand-off.
    - { when: { debuff: ["First in Line", "Accretion Duty"], role: dps }, startAt: 65, endAt: 71, frame: [black-hole-2-laser-3], spot: *atOrb }
    - { when: { debuff: ["First in Line", "Accretion Duty"], role: dps }, startAt: 65, endAt: 73, frame: [black-hole-2-laser-3], spot: *preclockwiseSoak }
    - { when: { debuff: ["First in Line", "Accretion Duty"], role: dps }, startAt: 68, endAt: 85, frame: [black-hole-2-laser-3], spot: *clockwiseSoak }

    # waves 3-5 (Black Hole 2's 1st tether, fires t=75/80/85): DPS hand-off, wave 3 = first_in_line,
    # waves 4-5 = second_in_line.
    - { when: { debuff: "First in Line", role: dps }, startAt: 65, endAt: 71, frame: [black-hole-2-laser-1], spot: *atOrb }
    - { when: { debuff: "First in Line", role: dps }, startAt: 65, endAt: 73, frame: [black-hole-2-laser-1], spot: *preclockwiseSoak }
    - { when: { debuff: "First in Line", role: dps }, startAt: 68, endAt: 75, frame: [black-hole-2-laser-1], spot: *clockwiseSoak }
    - { when: { debuff: "Second in Line", role: dps }, startAt: 72, endAt: 77, frame: [black-hole-2-laser-1], spot: *atOrb }
    - { when: { debuff: "Second in Line", role: dps }, startAt: 72, endAt: 80, frame: [black-hole-2-laser-1], spot: *preclockwiseSoak }
    - { when: { debuff: "Second in Line", role: dps }, startAt: 75, endAt: 85, frame: [black-hole-2-laser-1], spot: *clockwiseSoak }

    # waves 3-5 (Black Hole 2's 2nd tether, fires t=75/80/85): Support hand-off, waves 3-4 =
    # first_in_line's tank, wave 5 = second_in_line's tank.
    - { when: { debuff: "First in Line", role: tank }, startAt: 65, endAt: 71, frame: [black-hole-2-laser-2], spot: *atOrb }
    - { when: { debuff: "First in Line", role: tank }, startAt: 65, endAt: 73, frame: [black-hole-2-laser-2], spot: *preclockwiseSoak }
    - { when: { debuff: "First in Line", role: tank }, startAt: 68, endAt: 80, frame: [black-hole-2-laser-2], spot: *clockwiseSoak }
    - { when: { debuff: "Second in Line", role: tank }, startAt: 77, endAt: 79, frame: [black-hole-2-laser-2], spot: *atOrb }
    - { when: { debuff: "Second in Line", role: tank }, startAt: 77, endAt: 82, frame: [black-hole-2-laser-2], spot: *preclockwiseSoak }
    - { when: { debuff: "Second in Line", role: tank }, startAt: 80, endAt: 85, frame: [black-hole-2-laser-2], spot: *clockwiseSoak }

    # Damning Edict 2 (84-89) and Look Upon Me 1 (86-90) overlap: Look Upon Me is a beam from
    # bigkefka straight through arena centre (width 13.33, so +/-6.67 either side is unsafe), and
    # the Edict's safe/unsafe halves are split by a line through the origin perpendicular to
    # chaos's facing (chaos sits exactly at centre). A spot purely lateral to Kefka's beam axis
    # (z:0, i.e. measured from arena centre) is automatically safe from Look Upon Me at +/-7 (party)
    # or +/-10 (ot); mirrorLateral picks whichever of those two lateral sides is NOT where chaos's
    # cone is currently facing, so this is safe for any Kefka teleport bearing / any randomly-baited
    # Edict target, not just this pull's roll. ot's dodge spot doubles as its tb-5 drag-out approach
    # (same window it needs anyway, since exdeath - unlocked, no active mechanic of its own here -
    # follows ot there); the mechanic-gated tb-5 formation rule below takes over once tb-5 goes live.
    - { when: { static: true }, startAt: 84.1, endAt: 90, frame: [{ boss: { id: bigkefka, from: facing } }, { boss: { id: chaos, from: facing } }], mirrorLateral: true, spots: { mt: { r: -7, z: 0 }, h1: { r: -7, z: 0 }, h2: { r: -7, z: 0 }, r1: { r: -7, z: 0 }, r2: { r: -7, z: 0 }, m1: { r: -7, z: 0 }, m2: { r: -7, z: 0 }, ot: { r: -10, z: 0 } } }

    # waves 6-8 (Black Hole 3's 3rd tether, fires t=109/114/119): Accretion carrier #2
    # (second_in_line's healer) solos - no hand-off. (This is the swap found during review: today's
    # file had this as h1 solo/h2 hand-off, backwards.)
    - { when: { debuff: "Second in Line", role: healer }, startAt: 99, endAt: 104, frame: [black-hole-3-laser-3], spot: *atOrb }
    - { when: { debuff: "Second in Line", role: healer }, startAt: 99, endAt: 107, frame: [black-hole-3-laser-3], spot: *preclockwiseSoak }
    - { when: { debuff: "Second in Line", role: healer }, startAt: 102, endAt: 119, frame: [black-hole-3-laser-3], spot: *clockwiseSoak }

    # waves 6-8 (Black Hole 3's 1st tether, fires t=109/114/119): DPS hand-off, wave 6 =
    # second_in_line, waves 7-8 = third_in_line.
    - { when: { debuff: "Second in Line", role: dps }, startAt: 99, endAt: 104, frame: [black-hole-3-laser-1], spot: *atOrb }
    - { when: { debuff: "Second in Line", role: dps }, startAt: 99, endAt: 107, frame: [black-hole-3-laser-1], spot: *preclockwiseSoak }
    - { when: { debuff: "Second in Line", role: dps }, startAt: 102, endAt: 109, frame: [black-hole-3-laser-1], spot: *clockwiseSoak }
    - { when: { debuff: "Third in Line", role: dps }, startAt: 106, endAt: 111, frame: [black-hole-3-laser-1], spot: *atOrb }
    - { when: { debuff: "Third in Line", role: dps }, startAt: 106, endAt: 114, frame: [black-hole-3-laser-1], spot: *preclockwiseSoak }
    - { when: { debuff: "Third in Line", role: dps }, startAt: 109, endAt: 119, frame: [black-hole-3-laser-1], spot: *clockwiseSoak }

    # waves 6-8 (Black Hole 3's 2nd tether, fires t=109/114/119): Support hand-off, waves 6-7 =
    # second_in_line's tank, wave 8 = third_in_line's healer (its only non-dps member).
    - { when: { debuff: "Second in Line", role: tank }, startAt: 99, endAt: 104, frame: [black-hole-3-laser-2], spot: *atOrb }
    - { when: { debuff: "Second in Line", role: tank }, startAt: 99, endAt: 107, frame: [black-hole-3-laser-2], spot: *preclockwiseSoak }
    - { when: { debuff: "Second in Line", role: tank }, startAt: 102, endAt: 114, frame: [black-hole-3-laser-2], spot: *clockwiseSoak }
    - { when: { debuff: "Third in Line", role: healer }, startAt: 111, endAt: 113, frame: [black-hole-3-laser-2], spot: *atOrb }
    - { when: { debuff: "Third in Line", role: healer }, startAt: 111, endAt: 116, frame: [black-hole-3-laser-2], spot: *preclockwiseSoak }
    - { when: { debuff: "Third in Line", role: healer }, startAt: 114, endAt: 119, frame: [black-hole-3-laser-2], spot: *clockwiseSoak }

    # wave 9 (Black Hole 4's 1st tether, fires t=142): DPS chain ends at third_in_line - solos alone,
    # no further hand-off.
    - { when: { debuff: "Third in Line", role: dps }, startAt: 133, endAt: 138, frame: [black-hole-4-laser-1], spot: *atOrb }
    - { when: { debuff: "Third in Line", role: dps }, startAt: 133, endAt: 141, frame: [black-hole-4-laser-1], spot: *preclockwiseSoak }
    - { when: { debuff: "Third in Line", role: dps }, startAt: 136, endAt: 142, frame: [black-hole-4-laser-1], spot: *clockwiseSoak }

    # wave 9 (Black Hole 4's 3rd tether, fires t=142) then wave 10 (its 2nd/delayed tether, fires
    # t=150): Support chain ends at third_in_line's healer, who solos the 3rd tether then continues
    # straight onto the delayed 2nd tether once it resolves (2 tethers collapsing into 1 soloed by
    # the same player, since there's no fourth line to hand off to).
    - { when: { debuff: "Third in Line", role: healer }, startAt: 133, endAt: 138, frame: [black-hole-4-laser-3], spot: *atOrb }
    - { when: { debuff: "Third in Line", role: healer }, startAt: 133, endAt: 141, frame: [black-hole-4-laser-3], spot: *preclockwiseSoak }
    - { when: { debuff: "Third in Line", role: healer }, startAt: 136, endAt: 142, frame: [black-hole-4-laser-3], spot: *clockwiseSoak }
    - { when: { debuff: "Third in Line", role: healer }, startAt: 139, endAt: 144, frame: [black-hole-4-laser-2], spot: *atOrb }
    - { when: { debuff: "Third in Line", role: healer }, startAt: 139, endAt: 147, frame: [black-hole-4-laser-2], spot: *preclockwiseSoak }
    - { when: { debuff: "Third in Line", role: healer }, startAt: 142, endAt: 150, frame: [black-hole-4-laser-2], spot: *clockwiseSoak }

    # tb-3 has no Black Hole in play yet, so it keeps the plain shared bait spot. tb-4/tb-5 have
    # their own mechanic-gated rules above (framed on their Black Hole's 2nd tether).
    - { when: { mechanic: thunder-iii-tb-3 }, spots: *thunderBait }
    - { when: { mechanic: thunder-iii-tb-4 }, frame: [black-hole-1-laser-2], origin: { boss: exdeath }, spots: *thunderRelativeBait }
    - { when: { mechanic: thunder-iii-tb-5 }, frame: [black-hole-2-laser-3], origin: { boss: exdeath }, spots: *thunderRelativeBait }

    # Everyone not already soaking a tether just stacks arena center, out of every beam's path.
    - { when: { static: true }, startAt: 37, endAt: 51, spot: *stackMiddle }
    - { when: { static: true }, startAt: 68, endAt: 85, spot: *stackMiddle }
    - { when: { static: true }, startAt: 102, endAt: 119, spot: *stackMiddle }
    - { when: { static: true }, startAt: 135, endAt: 150, spot: *stackMiddle }

    - { when: { static: true }, spots: *fallback }

  holds:
    - { mechanic: [slap-happy-1-right-hit-3, slap-happy-1-left-hit-3, slap-happy-2-right-hit-3, slap-happy-2-left-hit-3, slap-happy-3-right-hit-3, slap-happy-3-left-hit-3], duration: 4 }
