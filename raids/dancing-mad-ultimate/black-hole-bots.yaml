# Chaos-facing-relative dodge for wave 8's Latitude/Longitude Implosion (see the wave 8 comment
# further down): sequential, not simultaneous, with Slap Happy 3 - the party parks on the diagonal of
# chaos's locked facing opposite whichever side Kefka is cleaving (east for the right/partySafeEast
# cleave, west for the left/roleSafeWest cleave) while latlong is live, then falls through to the
# plain bigkefka spot for the cleave itself. Each 90deg-wide implosion cone's edge sits exactly on the
# diagonal, so a couple degrees' nudge one way or the other (endingFacing) clears whichever axis is
# live - mirrors bowels-of-agony-bots.yaml's Latitude/Longitude dodge.

_chaosPartySafeEastLongitude: &chaosPartySafeEastLongitude { dist: 9, angleDeg: 227 }
_chaosPartySafeEastLatitude: &chaosPartySafeEastLatitude { dist: 9, angleDeg: 223 }
_chaosPartySafeWestLongitude: &chaosPartySafeWestLongitude { dist: 9, angleDeg: 47 }
_chaosPartySafeWestLatitude: &chaosPartySafeWestLatitude { dist: 9, angleDeg: 43 }

_pixelBehindChaos: &pixelBehindChaos { r: 0, z: -0.1 }

_clockwiseSoak: &clockwiseSoak { r: 9.44, z: 3.44 }
_preclockwiseSoak: &preclockwiseSoak { r: 6.44, z: 2.44 }
_atOrb: &atOrb { r: 0, z: 4 }
_stackMiddle: &stackMiddle { x: 0, z: 0 }

_thunderBait: &thunderBait
  mt: { x: 7, z: 0 }
  ot: { x: 7, z: 0 }
  h1: { x: 0, z: 0 }
  h2: { x: 0, z: 0 }
  r1: { x: 0, z: 0 }
  r2: { x: 0, z: 0 }
  m1: { x: 0, z: 0 }
  m2: { x: 0, z: 0 }

_thunderRelativeBait: &thunderRelativeBait
    mt: { dist: 0, angleDeg: 240 }
    ot: { dist: 0, angleDeg: 240 } 

solvers:
  generic:
    # Everyone regroups at arena centre for ~2s right after each Black Hole spawns (even soakers -
    # they resume their orb pre-positioning immediately after via the rules below).
    - { when: { static: true }, startAt: 37.1, endAt: 39, spot: *stackMiddle }
    - { when: { static: true }, startAt: 68.1, endAt: 70, spot: *stackMiddle }
    - { when: { static: true }, startAt: 135.1, endAt: 137, spot: *stackMiddle }

    # Damning Edict doesn't bait: the party just stacks tight behind Chaos through the tell and
    # the cast; the hit rules below then move safe for Slap Happy once those go live.
    - { when: { mechanic: slap-happy-2-right-edict-bait }, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *pixelBehindChaos }
    - { when: { mechanic: slap-happy-2-left-edict-bait }, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *pixelBehindChaos }

    # ...and stays there until the cast actually resolves - listed ahead of the Slap Happy hit rules
    # below so it keeps winning for the whole cast even while a hit window is also live. (Damning
    # Edict 2 no longer uses this spot - see the combined Edict/Look Upon Me dodge further down,
    # since pixelBehindChaos sits inside Look Upon Me 1's beam once its direction is fixed.)
    - { when: { mechanic: damning-edict-1 }, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *pixelBehindChaos }

    # wave 8 -> lat/long: right after Black Hole 3's last tether resolves, mt baits SW intercardinal
    # relative to Kefka's (fixed since kefka-teleport-2) position. Chaos is aggro'd on mt, and
    # Implosion (latlong-1/2) locks chaos's facing toward whoever it's tracking at t=125 (the lock
    # instant, see boss-facing-lock-chaos-latlong/_implosion's lockFacing in black-hole.yaml) - so mt
    # only needs to hold this spot through t=125, not the whole Slap Happy 3 + latlong window; once the
    # lock is captured it's fixed regardless of where mt goes, so mt rejoins the party's own
    # partySafeEast/roleSafeWest like any other tank from t=125 on. Listed ahead of the Slap Happy
    # 1/2/3 rules below (which also name mt in their spots dicts) so it wins for mt through t=125
    # regardless of list position further down - first-match-wins means a later, wider-reaching rule
    # can otherwise steal mt away even though this rule's own startAt/endAt would still be active.
    - { when: { static: true }, startAt: 119.1, endAt: 125, frame: [{ boss: { id: bigkefka, from: position } }], spots: { mt: { dist: 9.5, angleDeg: 225 } } }

    # Slap Happy right-side cleave rolls party stack: all middle relative in the safe quadrant. Gated
    # on the invisible slap-happy-{1,2}-right-hold markers (black-hole.yaml, same eventSets branch as
    # the real hits) rather than each hit individually: the 3 real hits resolve well before
    # party-stack fires (t=34->36 for wave 1, t=64->67 for wave 2), and nothing else bridges that gap,
    # so a mechanic-per-hit gate would leave the party stranded mid-transit right when it matters.
    - { when: { mechanic: slap-happy-1-right-hold }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    - { when: { mechanic: slap-happy-2-right-hold }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }
    # Slap Happy 3's right cleave ("Kefka cleaves west") overlaps the Latitude/Longitude Implosion:
    # dodge sequentially, not simultaneously. Gated on slap-happy-3-right-hold, an invisible damageless
    # marker (black-hole.yaml, same eventSets branch as the real hits so it always agrees on side) that
    # stays live t=127-135 - long enough to span both latlong slots *and* bridge the ~2s gap after the
    # real hits resolve (t=133) but before party-stack fires (t=135), which no visible mechanic covers.
    # The chaos-relative east diagonal (opposite the cleave) takes priority through t=132 (whichever
    # latlong slot is currently live), nudged +-2deg by axis the same way bowels-of-agony-bots.yaml
    # solves this; from t=132 it falls through to the plain bigkefka partySafeEast below (unchanged),
    # still gated on the same hold marker so the party keeps heading there instead of freezing
    # mid-transit once the last real hit resolves at t=133.
    - { when: { mechanic: slap-happy-3-right-hold, endingFacing: { event: latlong-1-a, offset: 0 } }, startAt: 127, endAt: 130, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *chaosPartySafeEastLongitude }
    - { when: { mechanic: slap-happy-3-right-hold, endingFacing: { event: latlong-1-a, offset: -1.5707963267948966 } }, startAt: 127, endAt: 130, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *chaosPartySafeEastLatitude }
    - { when: { mechanic: slap-happy-3-right-hold, endingFacing: { event: latlong-2-a, offset: 0 } }, startAt: 130, endAt: 132, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *chaosPartySafeEastLongitude }
    - { when: { mechanic: slap-happy-3-right-hold, endingFacing: { event: latlong-2-a, offset: -1.5707963267948966 } }, startAt: 130, endAt: 132, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *chaosPartySafeEastLatitude }
    - { when: { mechanic: slap-happy-3-right-hold }, startAt: 132, endAt: 135, frame: [{ boss: { id: bigkefka, from: position } }], spots: *partySafeEast }

    # Slap Happy left-side cleave rolls role stacks: tanks north, healers mid, DPS south. Gated on the
    # invisible slap-happy-{1,2}-left-hold markers (black-hole.yaml, same eventSets branch as the real
    # hits) rather than each hit individually - same reasoning as the right-side block above.
    - { when: { mechanic: slap-happy-1-left-hold }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    - { when: { mechanic: slap-happy-2-left-hold }, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }
    # Slap Happy 3's left cleave ("Kefka cleaves east") overlaps the Latitude/Longitude Implosion:
    # dodge sequentially, not simultaneously. Gated on slap-happy-3-left-hold, an invisible damageless
    # marker (black-hole.yaml, same eventSets branch as the real hits so it always agrees on side) that
    # stays live t=127-135 - long enough to span both latlong slots *and* bridge the ~2s gap after the
    # real hits resolve (t=133) but before role-stack fires (t=135), which no visible mechanic covers.
    # The chaos-relative west diagonal (opposite the cleave) takes priority through t=132 (whichever
    # latlong slot is currently live), nudged +-2deg by axis the same way bowels-of-agony-bots.yaml
    # solves this; from t=132 it falls through to the plain bigkefka roleSafeWest below (unchanged),
    # still gated on the same hold marker so the party keeps heading there instead of freezing
    # mid-transit once the last real hit resolves at t=133.
    - { when: { mechanic: slap-happy-3-left-hold, endingFacing: { event: latlong-1-a, offset: 0 } }, startAt: 127, endAt: 130, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *chaosPartySafeWestLongitude }
    - { when: { mechanic: slap-happy-3-left-hold, endingFacing: { event: latlong-1-a, offset: -1.5707963267948966 } }, startAt: 127, endAt: 130, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *chaosPartySafeWestLatitude }
    - { when: { mechanic: slap-happy-3-left-hold, endingFacing: { event: latlong-2-a, offset: 0 } }, startAt: 130, endAt: 132, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *chaosPartySafeWestLongitude }
    - { when: { mechanic: slap-happy-3-left-hold, endingFacing: { event: latlong-2-a, offset: -1.5707963267948966 } }, startAt: 130, endAt: 132, frame: [{ boss: { id: chaos, from: facing } }], origin: { boss: chaos }, spot: *chaosPartySafeWestLatitude }
    - { when: { mechanic: slap-happy-3-left-hold }, startAt: 132, endAt: 135, frame: [{ boss: { id: bigkefka, from: position } }], spots: *roleSafeWest }


