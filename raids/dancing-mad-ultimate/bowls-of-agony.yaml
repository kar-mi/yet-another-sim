name: Bowls of Agony
arena:
  floorPlan: dmu-p1
  zones:
    - kind: circle
      center: [0, 0]
      radius: 20
duration: 106

bosses:
  - id: chaos
    pos: [-8, 0]
    aggro: mt
  - id: exdeath
    pos: [8, 0]
    aggro: ot
  - id: kefka
    pos: [0, 18]

crystals:
  spawnAt: 24
  spots: [[-14, 14], [14, 14], [14, -14], [-14, -14]]
  rng: true

players:
  - { id: mt, role: tank,   spawn: [-4,  8] }
  - { id: ot, role: tank,   spawn: [ 4,  8] }
  - { id: h1, role: healer, spawn: [-8,  2] }
  - { id: h2, role: healer, spawn: [ 8,  2] }
  - { id: r1, role: dps,    spawn: [-8, -4] }
  - { id: r2, role: dps,    spawn: [ 8, -4] }
  - { id: m1, role: dps,    spawn: [-4, -8] }
  - { id: m2, role: dps,    spawn: [ 4, -8] }

_heroEpic: &heroEpic
  name: Epic Hero
  kind: debuff
  duration: 31
  icon: alpha.png
  behavior: { kind: assignment, expiryDamage: 0, expiryDamageType: "true" }

_heroFated: &heroFated
  name: Fated Hero
  kind: debuff
  duration: 31
  icon: beta.png
  behavior: { kind: assignment, expiryDamage: 0, expiryDamageType: "true" }

_headwind: &headwind
  name: Headwind
  kind: debuff
  duration: 70
  icon: headwind.png
  behavior: { kind: directionalKnockback, requiredFacing: away, distance: 8, doubledDistance: 18 }

_tailwind: &tailwind
  name: Tailwind
  kind: debuff
  duration: 70
  icon: tailwind.png
  behavior: { kind: directionalKnockback, requiredFacing: toward, distance: 8, doubledDistance: 18 }

_entropyShort: &entropyShort
  name: Entropy
  kind: debuff
  duration: 18
  icon: entropy.png
  behavior:
    kind: burstSpread
    selfShape: circle
    radius: 5
    damage: 8
    damageType: magical
    knockbackDistance: 1
    followUp:
      mode: closest
      count: 2
      shape: donut
      radius: 8
      inner: 3
      damage: 12
      damageType: magical

_dynamicFluidLong: &dynamicFluidLong
  name: Dynamic Fluid
  kind: debuff
  duration: 45
  icon: dynamic_fluid.png
  behavior:
    kind: burstSpread
    selfShape: donut
    selfInner: 3
    radius: 8
    damage: 12
    damageType: magical
    knockbackDistance: 1
    followUp:
      mode: closest
      count: 2
      shape: circle
      radius: 5
      damage: 8
      damageType: magical

events:
  - type: aoe
    id: decisive-battle
    t: 2
    name: Decisive Battle
    telegraph: 3
    damage: 0
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 20 }

  - type: apply_effect
    id: epic-hero
    t: 5
    name: Epic Hero
    players: [mt, h1, m1, m2]
    applyEffect: *heroEpic
  - type: apply_effect
    id: fated-hero
    t: 5
    name: Fated Hero
    players: [ot, h2, r1, r2]
    applyEffect: *heroFated

  - type: aoe
    id: bowls-of-agony-cast
    t: 19
    name: Bowls of Agony
    telegraph: 5
    damage: 0
    damageType: magical
    showCastBar: true
    showTelegraph: false
    shape: { kind: circle, center: [0, 0], radius: 20 }

  - type: apply_effect
    id: headwind-assign
    t: 24
    name: Headwind
    players: [mt, h1, m1, m2]
    applyEffect: *headwind
  - type: apply_effect
    id: tailwind-assign
    t: 24
    name: Tailwind
    players: [ot, h2, r1, r2]
    applyEffect: *tailwind
  - type: apply_effect
    id: entropy-short
    t: 24
    name: Entropy
    players: [h1, m1]
    applyEffect: *entropyShort
  - type: apply_effect
    id: dynamic-fluid-long
