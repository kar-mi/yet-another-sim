  - type: limit_cut
    id: bowls-limit-cut
    time: 91
    name: Limit Cut
    # Mirrors the trance divebombs (first sweep from N, sequence rotates CCW). Relative-north is the
    # opposite (S) and bots place clockwise. RNG-ready: roll kefkaStart/kefkaClockwise here later.
    rotation: { kefkaStart: { x: 0, z: 20 }, kefkaClockwise: false }
    effect:
      name: Limit Cut
      kind: debuff
      duration: 9
      visibility: invisible
      behavior: { kind: none }
      markerIconScale: 2.5

