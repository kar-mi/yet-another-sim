services:
  sim:
    build: .
    image: yet-another-sim
    container_name: yet-another-sim
    restart: unless-stopped
    environment:
      - PORT=${PORT:-3000}
      - MAX_SESSIONS=${MAX_SESSIONS:-10}
      - METRICS_TOKEN=${METRICS_TOKEN:?set METRICS_TOKEN in .env}
      - METRICS_PORT=${METRICS_PORT:-9100}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
      - "127.0.0.1:${METRICS_PORT:-9100}:${METRICS_PORT:-9100}"
