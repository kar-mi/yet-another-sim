services:
  sim:
    build: .
    image: yet-another-sim
    container_name: yet-another-sim
    restart: unless-stopped
    environment:
      - PORT=${PORT:-3000}
      - METRICS_TOKEN=${METRICS_TOKEN:?set METRICS_TOKEN in .env}
      - METRICS_PORT=${METRICS_PORT:-9100}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${METRICS_BIND_IP:-0.0.0.0}:${METRICS_PORT:-9100}:${METRICS_PORT:-9100}"
