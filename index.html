<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yet Another Sim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/client/style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <button id="home-btn" title="Return to class select">🏠</button>
  <button id="info-btn" title="About">?</button>
  <button id="settings-btn">⚙</button>

  <div id="settings-panel">
    <div class="settings-tabs">
      <button class="settings-tab active" data-tab="camera">CAMERA</button>
      <button class="settings-tab" data-tab="keybinds">KEYBINDS</button>
      <button class="settings-tab" data-tab="controller">CONTROLLER</button>
      <button class="settings-tab" data-tab="display">DISPLAY</button>
    </div>

    <div id="tab-camera">
      <div class="settings-group-header">KEYBOARD &amp; MOUSE</div>

      <div class="settings-field">
        <div class="settings-label">MOUSE SENSITIVITY: <span id="sensitivity-val" class="settings-value">1.0</span></div>
        <input id="sensitivity-slider" type="range" min="0.1" max="2" step="0.1" value="1">
      </div>

      <div class="settings-field">
        <div class="settings-label">CONTROL SCHEME</div>
        <div class="settings-radio-group">
          <label class="settings-radio-option">
            <input type="radio" name="controlScheme" value="legacy"> LEGACY
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="controlScheme" value="standard"> STANDARD
          </label>
        </div>
      </div>

    </div>

    <div id="tab-keybinds" style="display:none">
      <div class="settings-group-header">KEYBINDS</div>
      <div class="keybind-header">
        <span></span>
        <span>⌨ KBM</span>
        <span>🎮 CONTROLLER</span>
      </div>
      <div class="keybind-row" data-action="moveForward">
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="moveForward">W</button>
        <span class="keybind-controller" data-controller-label="LS ↑"></span>
      </div>
      <div class="keybind-row" data-action="moveBack">
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="moveBack">S</button>
        <span class="keybind-controller" data-controller-label="LS ↓"></span>
      </div>
      <div class="keybind-row" data-action="strafeLeft">
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="strafeLeft">Q</button>
        <span class="keybind-controller" data-controller-label="LS ←"></span>
      </div>
      <div class="keybind-row" data-action="strafeRight">
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="strafeRight">E</button>
        <span class="keybind-controller" data-controller-label="LS →"></span>
      </div>
      <div class="keybind-row" data-action="cameraPanLeft"> <!-- doubles as turn/move in legacy -->
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="cameraPanLeft">A</button>
        <span class="keybind-controller" data-controller-label="RS ←"></span>
      </div>
      <div class="keybind-row" data-action="cameraPanRight"> <!-- doubles as turn/move in legacy -->
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="cameraPanRight">D</button>
        <span class="keybind-controller" data-controller-label="RS →"></span>
      </div>
      <div class="keybind-row" data-action="jump">
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="jump">SPACE</button>
        <button class="keybind-controller keybind-controller-btn" data-action="jump"></button>
      </div>
      <div class="keybind-row" data-action="sprint">
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="sprint">1</button>
        <button class="keybind-controller keybind-controller-btn" data-action="sprint"></button>
      </div>
      <div class="keybind-row" data-action="antiKnockback">
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="antiKnockback">2</button>
        <button class="keybind-controller keybind-controller-btn" data-action="antiKnockback"></button>
      </div>
      <div class="keybind-row" data-action="provoke">
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="provoke">3</button>
        <button class="keybind-controller keybind-controller-btn" data-action="provoke"></button>
      </div>
      <div class="keybind-row" data-action="swapTarget">
        <span class="keybind-label"></span>
        <button class="keybind-btn" data-action="swapTarget">TAB</button>
        <button class="keybind-controller keybind-controller-btn" data-action="swapTarget"></button>
      </div>
      <button id="reset-keybinds">RESET KEYBINDS</button>
    </div>

    <div id="tab-controller" style="display:none">
      <div class="settings-group-header">CAMERA</div>

      <div class="settings-field">
        <div class="settings-label">CONTROLLER SENSITIVITY: <span id="ctrl-sens-val" class="settings-value">2.0</span></div>
        <input id="ctrl-sens-slider" type="range" min="0.5" max="6" step="0.5" value="2">
      </div>

      <div class="settings-field">
        <label class="settings-check">
          <input id="cam-accel-toggle" type="checkbox"> CAMERA ACCELERATION
        </label>
      </div>

      <div class="settings-field">
        <div class="settings-label">ACCELERATION STRENGTH: <span id="cam-accel-strength-val" class="settings-value">1.0</span></div>
        <input id="cam-accel-strength" type="range" min="0" max="3" step="0.5" value="1">
      </div>

      <div class="settings-group-header">DEVICE</div>

      <div class="settings-field">
        <div class="settings-label">CONNECTED CONTROLLER</div>
        <div class="controller-info">
          <span id="controller-type-badge" class="controller-badge controller-badge--none">NO CONTROLLER</span>
          <span id="controller-name" class="controller-name"></span>
          <select id="controller-select" class="controller-select" style="display:none"></select>
        </div>
      </div>
    </div>

    <div id="tab-display" style="display:none">
      <div class="settings-field">
        <label class="settings-check">
          <input id="rendered-player-hp-toggle" type="checkbox"> RENDERED PLAYER HP BARS
        </label>
      </div>

      <div class="settings-field">
        <div class="settings-label">UI SCALE</div>
        <div class="settings-radio-group">
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="0.85"> XS
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="1"> SMALL
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="1.125"> NORMAL
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="1.25"> LARGE
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="1.5"> XL
          </label>
        </div>
      </div>
    </div>

    <div class="settings-footer">
      <button id="settings-close">CLOSE</button>
    </div>
  </div>

  <div id="info-panel">
    <div class="info-title">YET ANOTHER SIM</div>
    <div class="info-tagline">A raid mechanics practice sandbox.</div>
    <div class="info-version">VERSION <span id="info-version"></span></div>
    <a class="info-link" href="https://github.com/kar-mi/yet-another-sim" target="_blank" rel="noopener">github.com/kar-mi/yet-another-sim</a>
    <div class="settings-footer">
      <button id="info-close">CLOSE</button>
    </div>
  </div>

  <template id="yas-hud-template">
    <div id="yas-hud">
      <div class="yas-hotbar-row">
        <div class="yas-debuff-tracker"></div>
        <div class="yas-hotbar-panel">
          <div class="yas-hotbar"></div>
          <div class="yas-controller-hotbar" style="display:none"></div>
          <button class="yas-hotbar-debug" title="Log position">⌖</button>
          <button class="yas-hotbar-toggle" title="Switch input display">⌨</button>
        </div>
        <div class="yas-boss-cast-panel"></div>
      </div>
      <div class="yas-resource-cluster">
        <div class="yas-resource-panel">
          <div class="yas-bar-row">
            <span class="yas-bar-label">HP</span>
            <div class="yas-bar-track">
              <div class="yas-bar-fill yas-hp-fill" style="width:100%"></div>
              <span class="yas-bar-val" data-hp-val>100 / 100</span>
            </div>
          </div>
          <div class="yas-bar-row">
            <span class="yas-bar-label">MP</span>
            <div class="yas-bar-track">
              <div class="yas-bar-fill yas-mp-fill" style="width:100%"></div>
              <span class="yas-bar-val" data-mp-val>10000 / 10000</span>
            </div>
          </div>
        </div>
        <button class="yas-invuln-btn" title="Toggle invincibility">🛡∞</button>
        <button class="yas-bot-invuln-btn" title="Toggle bot invincibility">BOT∞</button>
      </div>
    </div>
  </template>

  <script type="module" src="./src/client/main.ts"></script>
</body>
</html>
