<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yet Another Sim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/client/style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <button id="home-btn" title="Return to class select">🏠</button>
  <button id="settings-btn">⚙</button>

  <div id="settings-panel">
    <div class="settings-tabs">
      <button class="settings-tab active" data-tab="camera">CAMERA</button>
      <button class="settings-tab" data-tab="controls">CONTROLS</button>
      <button class="settings-tab" data-tab="controller">CONTROLLER</button>
      <button class="settings-tab" data-tab="display">DISPLAY</button>
    </div>

    <div id="tab-camera">
      <div class="settings-group-header">KEYBOARD &amp; MOUSE</div>

      <div class="settings-field">
        <div class="settings-label">MOUSE SENSITIVITY: <span id="sensitivity-val" class="settings-value">1.0</span></div>
        <input id="sensitivity-slider" type="range" min="0.1" max="2" step="0.1" value="1">
      </div>

      <div class="settings-field">
        <div class="settings-label">PAN BUTTON</div>
        <div class="settings-radio-group">
          <label class="settings-radio-option">
            <input type="radio" name="panBtn" value="left"> LEFT CLICK
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="panBtn" value="right"> RIGHT CLICK
          </label>
        </div>
      </div>

      <div class="settings-group-header">CONTROLLER</div>

      <div class="settings-field">
        <div class="settings-label">CONTROLLER SENSITIVITY: <span id="ctrl-sens-val" class="settings-value">2.0</span></div>
        <input id="ctrl-sens-slider" type="range" min="0.5" max="6" step="0.5" value="2">
      </div>

      <div class="settings-field">
        <label class="settings-check">
          <input id="cam-accel-toggle" type="checkbox"> CAMERA ACCELERATION
        </label>
      </div>

      <div class="settings-field">
        <div class="settings-label">ACCELERATION STRENGTH: <span id="cam-accel-strength-val" class="settings-value">1.0</span></div>
        <input id="cam-accel-strength" type="range" min="0" max="3" step="0.5" value="1">
      </div>
    </div>

    <div id="tab-controls" style="display:none">
      <div class="keybind-row" data-action="moveForward">
        <span class="keybind-label">FORWARD</span>
        <button class="keybind-btn" data-action="moveForward">W</button>
      </div>
      <div class="keybind-row" data-action="moveBack">
        <span class="keybind-label">BACK</span>
        <button class="keybind-btn" data-action="moveBack">S</button>
      </div>
      <div class="keybind-row" data-action="moveLeft">
        <span class="keybind-label">LEFT</span>
        <button class="keybind-btn" data-action="moveLeft">A</button>
      </div>
      <div class="keybind-row" data-action="moveRight">
        <span class="keybind-label">RIGHT</span>
        <button class="keybind-btn" data-action="moveRight">D</button>
      </div>
      <div class="keybind-row" data-action="jump">
        <span class="keybind-label">JUMP</span>
        <button class="keybind-btn" data-action="jump">SPACE</button>
      </div>
      <div class="keybind-row" data-action="sprint">
        <span class="keybind-label">SPRINT</span>
        <button class="keybind-btn" data-action="sprint">1</button>
      </div>
      <div class="keybind-row" data-action="antiKnockback">
        <span class="keybind-label">ANTI-KB</span>
        <button class="keybind-btn" data-action="antiKnockback">2</button>
      </div>
      <button id="reset-keybinds">RESET KEYBINDS</button>
    </div>

    <div id="tab-controller" style="display:none">
      <div class="settings-field">
        <div class="settings-label">CONNECTED CONTROLLER</div>
        <div class="controller-info">
          <span id="controller-type-badge" class="controller-badge controller-badge--none">NO CONTROLLER</span>
          <span id="controller-name" class="controller-name"></span>
          <select id="controller-select" class="controller-select" style="display:none"></select>
        </div>
      </div>
    </div>

    <div id="tab-display" style="display:none">
      <div class="settings-field">
        <div class="settings-label">UI SCALE</div>
        <div class="settings-radio-group">
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="0.85"> XS
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="1"> SMALL
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="1.125"> NORMAL
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="1.25"> LARGE
          </label>
          <label class="settings-radio-option">
            <input type="radio" name="uiScale" value="1.5"> XL
          </label>
        </div>
      </div>
    </div>

    <div class="settings-footer">
      <button id="settings-close">CLOSE</button>
    </div>
  </div>

  <template id="yas-hud-template">
    <div id="yas-hud">
      <div class="yas-hotbar-panel">
        <div class="yas-hotbar"></div>
        <div class="yas-controller-hotbar" style="display:none">
          <div class="yas-controller-diamond">
            <div class="yas-slot yas-ctrl-top" data-ctrl-slot="3">
              <span class="yas-keybind">Y</span>
              <span class="yas-slot-icon">↑</span>
              <span class="yas-slot-name">JUMP</span>
            </div>
            <div class="yas-slot yas-ctrl-left" data-ctrl-slot="2"><span class="yas-keybind">X</span></div>
            <div class="yas-slot yas-ctrl-right" data-ctrl-slot="1"><span class="yas-keybind">B</span></div>
            <div class="yas-slot yas-ctrl-bottom" data-ctrl-slot="0"><span class="yas-keybind">A</span></div>
          </div>
          <div class="yas-ctrl-separator">LT</div>
          <div class="yas-controller-diamond">
            <div class="yas-slot yas-ctrl-top" data-ctrl-slot="7">
              <span class="yas-keybind">LT+Y</span>
              <span class="yas-slot-icon">⚡</span>
              <span class="yas-slot-name">SPRINT</span>
              <div class="yas-cd-overlay"></div>
              <div class="yas-cd-text"></div>
            </div>
            <div class="yas-slot yas-ctrl-left" data-ctrl-slot="6">
              <span class="yas-keybind">LT+X</span>
              <span class="yas-slot-icon">🛡</span>
              <span class="yas-slot-name">ANTI-KB</span>
              <div class="yas-cd-overlay"></div>
              <div class="yas-cd-text"></div>
            </div>
            <div class="yas-slot yas-ctrl-right" data-ctrl-slot="5"><span class="yas-keybind">LT+B</span></div>
            <div class="yas-slot yas-ctrl-bottom" data-ctrl-slot="4"><span class="yas-keybind">LT+A</span></div>
          </div>
        </div>
        <button class="yas-hotbar-toggle" title="Switch input display">⌨</button>
      </div>
      <div class="yas-resource-panel">
        <div class="yas-bar-row">
          <span class="yas-bar-label">HP</span>
          <div class="yas-bar-track">
            <div class="yas-bar-fill yas-hp-fill" style="width:100%"></div>
            <span class="yas-bar-val" data-hp-val>100 / 100</span>
          </div>
          <button class="yas-invuln-btn" title="Toggle invincibility">🛡∞</button>
        </div>
        <div class="yas-bar-row">
          <span class="yas-bar-label">MP</span>
          <div class="yas-bar-track">
            <div class="yas-bar-fill yas-mp-fill" style="width:100%"></div>
            <span class="yas-bar-val" data-mp-val>10000 / 10000</span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="./src/client/main.ts"></script>
</body>
</html>
